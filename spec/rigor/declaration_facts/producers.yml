# Declaration producers (#1507, ADR-119 WD6): every method, or class or module body, under lib/ and
# plugins/*/lib/ whose code decides what a declaration is. producers_spec.rb computes the set with Prism and
# compares it with this file. Each file says what it computes, and each entry why it computes a declaration
# context itself instead of going through DeclarationWalk::Context or ModuleFunctionState. `grandfathered`
# marks the entries present when the tripwire landed; they converge as bugs are filed. A new entry must say
# why; `RIGOR_REGENERATE_GATES=1` adds new entries as TODO, which the spec fails on.

lib/rigor/analysis/check_rules.rb:
  computes: the visibility of a method and its override, for the def.method-visibility-mismatch and override rules
  producers:
    Rigor::Analysis::CheckRules.visibility_mismatch_diagnostic: grandfathered
    Rigor::Analysis::CheckRules.visibility_reduced?: grandfathered
lib/rigor/analysis/check_rules/ivar_write_collector.rb:
  computes: the instance-variable writes in each class's instance-method bodies, keyed by qualified name
  producers:
    Rigor::Analysis::CheckRules::IvarWriteCollector: grandfathered
    Rigor::Analysis::CheckRules::IvarWriteCollector#gather_writes: grandfathered
    Rigor::Analysis::CheckRules::IvarWriteCollector#walk: grandfathered
lib/rigor/analysis/check_rules/lexical_method_sites.rb:
  computes: where a singleton def on a local is in scope
  producers:
    Rigor::Analysis::CheckRules::LexicalMethodSites#walk: grandfathered
lib/rigor/analysis/check_rules/rule_walk.rb:
  computes: the single AST walk that hosts the check-rule collectors
  producers:
    Rigor::Analysis::CheckRules::RuleWalk: grandfathered
    Rigor::Analysis::CheckRules::RuleWalk.detached_ivar_facet?: grandfathered
    Rigor::Analysis::CheckRules::RuleWalk.extend_prefix: grandfathered
lib/rigor/analysis/check_rules/self_closedness_scanner.rb:
  computes: the qualified names of modules and open classes that call.self-undefined-method skips
  producers:
    Rigor::Analysis::CheckRules::SelfClosednessScanner#walk: grandfathered
lib/rigor/analysis/check_rules/shadowed_rescue_collector.rb:
  computes: the qualified owner a flow.shadowed-rescue-clause diagnostic names
  producers:
    Rigor::Analysis::CheckRules::ShadowedRescueCollector#extend_prefix: grandfathered
lib/rigor/analysis/check_rules/source_arity.rb:
  computes: whether a source-inferred method is public at a call site
  producers:
    Rigor::Analysis::CheckRules::SourceArity#public_at?: grandfathered
lib/rigor/analysis/dependency_source_inference/walker.rb:
  computes: the method catalog of an opt-in gem's source roots, per class and side, and its refine bodies' refinements
  producers:
    Rigor::Analysis::DependencySourceInference::Walker#walk_node: grandfathered
    Rigor::Analysis::DependencySourceInference::Walker#walk_refine_declarations: a dispatcher over a refine body; it hands each nested class or module back to walk_node under the prefix it was given and derives no declaration context itself
lib/rigor/analysis/reachability/scan.rb:
  computes: every constant declaration and reference with the lexical nesting in force there (ADR-102)
  producers:
    Rigor::Analysis::Reachability::Scan::LocalValues: SCOPE_GATES lists the nodes that open a local-variable scope, so an interpolated const_get argument is read through its own method's assignments (#1734); it derives no declaration context
    Rigor::Analysis::Reachability::Scan::LocalValues#collect_local_writes: stops a local-variable search at a nested def, class, module or singleton class (#1734); it derives no declaration context
    Rigor::Analysis::Reachability::Scan::Walker#mixin_names: grandfathered
    Rigor::Analysis::Reachability::Scan::Walker#walk: grandfathered
lib/rigor/effects/definition_context.rb:
  computes: the side a definition lands on and the self its body runs with, for the effects scan
  producers:
    Rigor::Effects::DefinitionContext#for_child: grandfathered
    Rigor::Effects::DefinitionContext.rebinds?: grandfathered
lib/rigor/effects/definition_lines.rb:
  computes: the line a method key's def is written at, in the file the key was traced to
  producers:
    Rigor::Effects::DefinitionLines#walk: grandfathered
lib/rigor/effects/scanner.rb:
  computes: the effect units a file defines, keyed Class#m or Class.m, and their superclasses
  producers:

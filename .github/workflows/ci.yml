name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel any in-progress run on the same branch when a new commit
# arrives. Pushes to master are always run to completion so the
# commit-level status is always present.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  # ── 1. RSpec suite ───────────────────────────────────────────────
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: make test-parallel

  # ── 2. RuboCop ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # RuboCop stores its result cache under ~/.cache/rubocop_cache
      # on Linux. Cache it keyed on the cop config + lock so a pure
      # gem-version or source change that does not touch linting rules
      # reuses the warm cache and skips re-inspecting unchanged files.
      - name: Restore RuboCop cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/rubocop_cache
          key: rubocop-${{ runner.os }}-${{ hashFiles('.rubocop.yml', '.rubocop_todo.yml', 'Gemfile.lock') }}
          restore-keys: rubocop-${{ runner.os }}-

      - name: Run lint
        run: make lint

  # ── 3. Rigor self-check (warm + cold) ───────────────────────────
  # Two matrix variants run in parallel:
  #   warm — restores .rigor/cache from the previous run so Rigor
  #           exercises the cache read/write path and skips slices
  #           for unchanged (path, sha, config) tuples (ADR-6).
  #   cold — starts with an empty cache directory every time so the
  #           full analysis path is exercised without any cached
  #           state; catches regressions that only surface on a
  #           first-run / cache-miss code path.
  # Both must pass for the required fan-in job to succeed.
  self-check:
    name: Self-check (${{ matrix.cache }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: [warm, cold]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # ADR-6: the analysis cache grows monotonically and is
      # content-addressed; restoring a warm cache from a prior run
      # skips recomputing slices for unchanged (path, sha, config)
      # tuples.  The key encodes every input that could change the
      # analysis result; a partial match restores the closest ancestor
      # cache and Rigor fills any missing slices on the fly.
      # Skipped entirely for the cold variant — no restore, no save.
      - name: Restore Rigor analysis cache
        if: matrix.cache == 'warm'
        uses: actions/cache@v5
        with:
          path: .rigor/cache
          key: rigor-cache-${{ runner.os }}-${{ hashFiles('lib/**/*.rb', 'sig/**/*.rbs', 'data/builtins/**/*.yml', 'Gemfile.lock') }}
          restore-keys: rigor-cache-${{ runner.os }}-

      # Run once with --format json so we get both structured output for
      # the warm-vs-cold diff and a human-readable summary in the CI log.
      # continue-on-error keeps the job alive long enough to upload the
      # artifact even when errors are found; we re-raise at the end.
      - name: Run rigor self-check
        id: check
        continue-on-error: true
        run: |
          bundle exec exe/rigor check --format json lib > rigor-raw.json
          rigor_exit=$?
          # Print human-readable diagnostic lines to the CI log.
          jq -r '.diagnostics[] |
            "\(.path):\(.line):\(.column): \(.severity): \(.message)"' \
            rigor-raw.json >&2 || true
          # Normalize for comparison: keep only stable fields, sort
          # deterministically so output order cannot produce a false diff.
          jq '[.diagnostics[] | {path, line, column, severity, rule, message}]
              | sort_by(.path, .line, .column, .rule)' \
            rigor-raw.json > rigor-diagnostics-${{ matrix.cache }}.json || true
          exit $rigor_exit

      # Upload even when the check found errors so the diff job always
      # has both artifacts to compare.
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rigor-diagnostics-${{ matrix.cache }}
          path: rigor-diagnostics-${{ matrix.cache }}.json
          retention-days: 1

      - name: Fail if self-check found errors
        if: steps.check.outcome == 'failure'
        run: |
          echo "rigor self-check found errors — see diagnostic output above"
          exit 1

      # Precision gate: `rigor coverage --threshold 0.43 lib` fails when the
      # type-inference precision ratio on Rigor's own source drops below 43 %.
      # The cold variant runs this so the gate exercises the full analysis path
      # without any cached assistance; the warm variant skips it to avoid
      # double-counting in CI time.
      - name: Run precision coverage gate
        if: matrix.cache == 'cold'
        run: make coverage

      # Plugin-contract gate (ADR-43): the bundled plugin / example LIB
      # trees must stay clean under `rigor check`. ADR-43 ancestor
      # resolution makes a plugin's inherited contract calls
      # (`manifest.…`, `io_boundary.…`) resolve against `Plugin::Base`'s
      # RBS, so misuse of the contract surface surfaces here as
      # `call.undefined-method`. Cold variant only — the result is
      # deterministic and needs no warm/cold cross-check.
      - name: Run plugin-contract check
        if: matrix.cache == 'cold'
        run: make check-plugins

  # ── 4. Warm-vs-cold diagnostic diff ─────────────────────────────
  # The two self-check variants must agree on every diagnostic.  Any
  # difference means the cache is altering analysis results — a bug.
  # Runs whenever self-check was not outright cancelled (so the diff
  # still executes when one variant failed, surfacing a discrepancy).
  self-check-diff:
    name: Self-check diff (warm == cold)
    needs: self-check
    runs-on: ubuntu-latest
    if: always() && needs.self-check.result != 'cancelled'
    steps:
      - name: Download warm diagnostics
        uses: actions/download-artifact@v4
        with:
          name: rigor-diagnostics-warm
          path: .

      - name: Download cold diagnostics
        uses: actions/download-artifact@v4
        with:
          name: rigor-diagnostics-cold
          path: .

      - name: Assert warm == cold
        run: |
          if diff -u rigor-diagnostics-warm.json rigor-diagnostics-cold.json; then
            echo "warm and cold diagnostics are identical"
          else
            echo "Cache-dependent diagnostics detected — warm and cold differ."
            echo "A stale or corrupt cache entry is producing different results."
            exit 1
          fi

  # ── Fan-in: single required-check target for branch protection ───
  # Configure branch protection to require only "CI required" rather
  # than each individual job. New jobs added above are automatically
  # gated without touching protection rules.
  required:
    name: CI required
    needs: [test, lint, self-check, self-check-diff]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SELF_CHECK_RESULT: ${{ needs.self-check.result }}
          SELF_CHECK_DIFF_RESULT: ${{ needs.self-check-diff.result }}
        run: |
          failed=0
          for job_result in "$TEST_RESULT" "$LINT_RESULT" "$SELF_CHECK_RESULT" "$SELF_CHECK_DIFF_RESULT"; do
            if [[ "$job_result" != "success" ]]; then
              echo "A required job did not succeed (result: $job_result)"
              failed=1
            fi
          done
          exit $failed

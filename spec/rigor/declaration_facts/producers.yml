  producers:
    Rigor::Inference::GlobalWriteCensus: grandfathered
    Rigor::Inference::GlobalWriteCensus#walk: grandfathered
    Rigor::Inference::GlobalWriteCensus::Collector#visit_call: grandfathered
lib/rigor/inference/guard_rebinding.rb:
  computes: where a guard's narrowing of a global or constant stops holding
  producers:
    Rigor::Inference::GuardRebinding::ScanScope: grandfathered
    Rigor::Inference::GuardRebinding::ScanScope#collect_local_writes: grandfathered
lib/rigor/inference/in_effect_refinements/walk.rb:
  computes: the lexical prefix a using's constant and a refine block's own module resolve in, the body a using stays in effect to the end of, and the Module.nesting a refine-body def is written in
  producers:
    Rigor::Inference::InEffectRefinements::Walk#walk: moved from LexicalMethodSites#walk (#1673), which was grandfathered; the prefix only spells a using's candidate names, as ScopeIndexer.constant_receiver_candidates does for the refinement table, and the nesting is ConstantPath.pushed_nesting's, so it decides no declaration
lib/rigor/inference/jump_targets.rb:
  computes: the break and next nodes that target a construct
  producers:
    Rigor::Inference::JumpTargets: grandfathered
    Rigor::Inference::JumpTargets#boundary?: grandfathered
lib/rigor/inference/last_line.rb:
  computes: whether a gets / readline reader runs in a frame of its own, for the $_ binding
  producers:
    Rigor::Inference::LastLine#scan: grandfathered

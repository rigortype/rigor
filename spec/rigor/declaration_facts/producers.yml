# Declaration producers (#1507, ADR-119 WD6): every method, or class or module body, under lib/ and
# plugins/*/lib/ whose code decides what a declaration is. producers_spec.rb computes the set with Prism and
# compares it with this file. Each file says what it computes, and each entry why it computes a declaration
# context itself instead of going through DeclarationWalk::Context or ModuleFunctionState. `grandfathered`
# marks the entries present when the tripwire landed; they converge as bugs are filed. A new entry must say
# why; `RIGOR_REGENERATE_GATES=1` adds new entries as TODO, which the spec fails on.
# A reason containing a space and a hash must be quoted, or folded with `>-`, or YAML reads the rest as a comment.

lib/rigor/analysis/check_rules.rb:
  computes: the visibility of a method and its override, for the def.method-visibility-mismatch and override rules
  producers:
    Rigor::Analysis::CheckRules.instance_visibility_mismatch: 'the instance-side half of the grandfathered visibility_mismatch_diagnostic, split out by issue #1984; its visibility comparisons are the grandfathered method''s, and it adds the method_missing / respond_to_missing? decline; it reads the recorded visibility through Scope and DefinerResolution and derives no declaration context'
    Rigor::Analysis::CheckRules.private_recorded_names: 'issue #1984, the set of names some class records :private (either side), the table-only gate the singleton visibility rule asks before reading a chain; it derives no declaration context'
    Rigor::Analysis::CheckRules.singleton_visibility_mismatch: 'issue #1984, the singleton-side half of visibility_mismatch_diagnostic; it compares DefinerResolution''s singleton-side :visibility answer with :private and derives no declaration context'
    Rigor::Analysis::CheckRules.visibility_reduced?: grandfathered
lib/rigor/analysis/check_rules/ivar_write_collector.rb:

# Pins for `make coverage` (tool/coverage_ratchet.rb, #3315): two figures of the precision scan over Rigor's own
# `lib/`, each held within `slack` of its `pin` in BOTH directions.
#
# - A figure that worsens past the slack fails: declare what the change left untyped, or raise the pin in the same
#   commit with the reason in its message.
# - A figure that improves past the slack also fails, so the gain is locked in: set the pin to the new figure.
#
# The scan is deterministic (the same tree gives the same counts on every run), so the slack is not noise margin. It
# is the drift an ordinary change may carry without touching this file, sized on measured moves (2026-11-19). The 17
# commits between 8ef9d1e3a and #3354's head, and the ones from there to 5d90cfe0f, moved either figure by at most
# 0.01 points per window. Removing four of #3354's declarations (`DependencyRecorder.active?` and the `try_dispatch` of
# KernelDispatch, RbsDispatch and ShapeDispatch) moves the call share by +0.12 points and precision by -0.05; all
# 28 of them moved the share by -0.26 and precision by +0.16. How to read and refresh the figures:
# docs/agents/measurement.md § "The self-typing ratchet".

# The configuration the figures are measured under; the tool refuses any other. `.rigor.gates.yml` is the self-check
# configuration with `parameter_inference:` off, so the ratchet sees a regression in declarations or in the engine but
# not one in parameter inference itself.
config: .rigor.gates.yml
parameter_inference: false

# `precise_ratio` of `rigor coverage --format json lib`: expressions whose type is constant, nominal, shaped, refined
# or bot, over every expression counted.
precision:
  pin: 0.5959 # 239217 / 401466
  slack: 0.0010

# `dynamic_call_count` / `call_sites`: the `Prism::CallNode`s whose result is a whole `Dynamic` or a union whose worst
# member is one (the `dynamic_top` and `dynamic_specific` tiers), over every `Prism::CallNode`.
dynamic_call_share:
  pin: 0.4983 # 50984 / 102322
  slack: 0.0010

# A scan that counted fewer than these visited the wrong tree or lost files, and its ratios prove nothing.
floors:
  expressions: 350000
  call_sites: 90000

# A move larger than this in one change is an instrument change, not a typing change.
max_step: 0.02

name: Release gate

# Comprehensive, release-only gate that runs on every push to a
# `release/x.y.z` branch (ADR-50 WD6). It runs the heavier checks the
# normal master/PR `ci.yml` does not — the perf-regression benchmark
# (ADR-50 WD4), a gem-build validation, and the OSS-corpus sweep (today
# Mastodon; data-driven, so Redmine / GitLab are a threshold-file
# addition away).
#
# ADR-50 WD6 hardening status:
#   perf-bench   — HARD gate: bench/baseline.json is calibrated on Linux
#                  CI. A regression past the tolerance band in
#                  bench/thresholds.yml fails the job. It measures this
#                  checkout's engine over the frozen corpus the baseline
#                  names (the previous release's tag, #1507), not over
#                  this checkout's growing `lib`. A red allocations band
#                  clears one way only: attribute the rise, and on the
#                  user's ruling recalibrate on the same corpus
#                  (bench/README.md, "Over a release cycle").
#                  An uncalibrated baseline passes, provided its corpus
#                  tag is in the clone (a missing tag fails the job).
#   gem-build    — advisory (continue-on-error); not yet required check.
#   oss-sweep    — advisory; not yet required check.
# Wire perf-bench into branch protection as a required check once the
# trial confirms the Linux wall-time band is stable.
#
# The base gate (test / lint / self-check warm+cold / diff) also runs on
# release/** via ci.yml's push trigger; this workflow is the *extra*
# depth on top of it.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Perf-regression benchmark (ADR-50 WD4) ──────────────────────
  perf-bench:
    name: Perf benchmark
    runs-on: ubuntu-latest
    steps:
      # Full history, for its tags: tool/bench.rb `git archive`s the corpus
      # revision bench/baseline.json names, and a shallow clone has none.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # Hard gate when bench/baseline.json is calibrated (exits 1 on
      # regression). An uncalibrated baseline exits 0 and emits a
      # suggestion; either way the corpus tag must resolve, or the step
      # fails before measuring.
      #
      # One command, two reps per target since #987: `tool/bench.rb` spawns a
      # fresh process per rep itself and gates on the LOWER wall_s /
      # peak_rss_kb, so this step costs ~2× what it did and the sampling rule
      # lives in the script rather than in this YAML.
      - name: Run make bench-perf
        run: make bench-perf

      - name: Upload suggested baseline (for calibration)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-baseline-${{ github.run_id }}
          path: bench/baseline.updated.json
          if-no-files-found: ignore
          retention-days: 30

  # ── Gem build validation ────────────────────────────────────────
  gem-build:
    name: Gem build (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # Confirms the gemspec still builds for the (bumped) version. The
      # built .gem is discarded — it must never be committed.
      - name: Build gem
        continue-on-error: true
        run: |
          gem build rigortype.gemspec
          rm -f rigortype-*.gem

  # ── OSS-corpus sweep (reuses oss-sweep.yml) ─────────────────────
  # Advisory: the sweep gates against data/oss-sweep/mastodon-thresholds.json
  # (an exact diagnostic count and a precision floor). A reusable-workflow
  # caller job cannot carry `continue-on-error` (GitHub rejects the workflow
  # file), so "advisory" here means this workflow is simply not a required
  # check in branch protection: a red sweep is a visible signal, not a
  # publish blocker.
  oss-sweep:
    name: OSS corpus sweep (advisory)
    uses: ./.github/workflows/oss-sweep.yml

  # ── Gate summary ─────────────────────────────────────────────────
  release-gate-summary:
    name: Release gate summary
    needs: [perf-bench, gem-build, oss-sweep]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        env:
          PERF: ${{ needs.perf-bench.result }}
          GEM: ${{ needs.gem-build.result }}
          SWEEP: ${{ needs.oss-sweep.result }}
        run: |
          echo "Release gate status (ADR-50 WD6):"
          echo "  perf-bench: $PERF  (HARD gate — calibrated baseline)"
          echo "  gem-build:  $GEM  (advisory)"
          echo "  oss-sweep:  $SWEEP  (advisory)"
          if [ "$PERF" = "failure" ]; then
            echo "FAILED: perf regression past tolerance band — see bench/thresholds.yml."
            exit 1
          fi
          echo "Gate passed."

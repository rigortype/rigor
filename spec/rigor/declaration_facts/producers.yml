    Rigor::Inference::ProjectPatchedScanner::Visibility#bare_call_nested?: 'issue #1708, reads the visibility a pre_eval: file gives each def in a class, module or class << body (a bare private / protected / public / module_function toggle, the def-argument form, private_class_method def self.x) for the pre_eval: registry only, so a private patch does not answer an explicit-receiver call; it walks no analysed file and writes no discovery table; ModuleFunctionState reads the module_function mode, not the private / protected / public default a def takes, and this asks it only whether a call is bare'
    Rigor::Inference::ProjectPatchedScanner::Visibility#call: 'issue #1708, reads the visibility a pre_eval: file gives each def in a class, module or class << body (a bare private / protected / public / module_function toggle, the def-argument form, private_class_method def self.x) for the pre_eval: registry only, so a private patch does not answer an explicit-receiver call; it walks no analysed file and writes no discovery table; ModuleFunctionState reads the module_function mode, not the private / protected / public default a def takes, and this asks it only whether a call is bare'
    Rigor::Inference::ProjectPatchedScanner::Visibility#mark: 'issue #1708, reads the visibility a pre_eval: file gives each def in a class, module or class << body (a bare private / protected / public / module_function toggle, the def-argument form, private_class_method def self.x) for the pre_eval: registry only, so a private patch does not answer an explicit-receiver call; it walks no analysed file and writes no discovery table; ModuleFunctionState reads the module_function mode, not the private / protected / public default a def takes, and this asks it only whether a call is bare'
    Rigor::Inference::ProjectPatchedScanner::Visibility#mark_nested: 'issue #1708, reads the visibility a pre_eval: file gives each def in a class, module or class << body (a bare private / protected / public / module_function toggle, the def-argument form, private_class_method def self.x) for the pre_eval: registry only, so a private patch does not answer an explicit-receiver call; it walks no analysed file and writes no discovery table; ModuleFunctionState reads the module_function mode, not the private / protected / public default a def takes, and this asks it only whether a call is bare'
    Rigor::Inference::ProjectPatchedScanner::Visibility#read_body: 'issue #1708, reads the visibility a pre_eval: file gives each def in a class, module or class << body (a bare private / protected / public / module_function toggle, the def-argument form, private_class_method def self.x) for the pre_eval: registry only, so a private patch does not answer an explicit-receiver call; it walks no analysed file and writes no discovery table; ModuleFunctionState reads the module_function mode, not the private / protected / public default a def takes, and this asks it only whether a call is bare'

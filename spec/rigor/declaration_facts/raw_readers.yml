# Raw readers (#1507): for each Scope::DiscoveryIndex member, the Ruby files under lib/ and plugins/*/lib/
# whose code calls a method of exactly that name. That is the whole-table reader Scope exposes or the
# index's own accessor, read instead of one of Scope's keyed readers. lib/rigor/scope.rb, which hosts
# the keyed readers, and lib/rigor/scope/discovery_index.rb are not counted; the producers are.
# raw_readers_spec.rb computes this census from the tree and compares it with this file, so a new raw
# read fails until it is recorded here. A forthcoming ADR decides which of these move behind a keyed
# reader.


name: CI

on:
  push:
    branches: [master]
    # A Markdown-only push (ADRs, notes, CHANGELOG, READMEs, skills) does
    # not change analysable code, so skip the full suite for it. Mixed
    # commits still run — paths-ignore only skips when EVERY changed file
    # matches. Applied to `push` only: `pull_request` stays unfiltered at
    # the trigger level, because a paths-filtered required check hangs
    # pending and blocks the merge. The equivalent PR-side skip is done
    # downstream by the `changes` job, which gates the code jobs on whether
    # any non-Markdown file changed while the "CI required" fan-in still
    # always reports.
    paths-ignore:
      - "**/*.md"
  pull_request:

# A release or feature branch is validated through its pull request (the
# `pull_request` event), so release/** is deliberately NOT listed under
# `push`: listing it there double-ran every release PR (push +
# pull_request). master still runs on push for the post-merge
# commit-level status.
#
# Cancel an in-progress run on the same ref when a new commit arrives,
# except for master and release-branch PRs, which run to completion (a
# release PR is a publish candidate — its base gate must not be
# cancelled mid-run; matched via head_ref now that release/** no longer
# triggers a push run). Other PR heads cancel the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.head_ref, 'release/') }}

permissions:
  contents: read

jobs:
  # ── 0. Change detection — skip the code suite for md-only PRs ────
  # A pull request that touches only *.md gains nothing from the RSpec
  # suite, self-check, lint, or the RBS matrix — the same reasoning that
  # lets a Markdown-only *push* skip the whole workflow (paths-ignore
  # above). But `pull_request` cannot use paths-ignore: a paths-filtered
  # required check hangs pending and blocks the merge. So this job always
  # runs, and the code jobs gate on its `code` output. Non-PR events
  # (master push) always run the suite. On any detection error we fail
  # safe to `code=true` — never skip on doubt (false-positive discipline:
  # a skipped suite that should have run is worse than a redundant run).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Detect non-Markdown changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event — running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "diff failed — failing safe to the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$changed"
          non_md=$(printf '%s\n' "$changed" | grep -vE '\.md$' || true)
          if [ -n "$non_md" ]; then
            echo "Non-Markdown files changed — running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Markdown-only PR — skipping the code suite."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. RSpec suite (via binpacker) ──────────────────────────────
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Cache the binpacker timing file between runs so that LPT
      # scheduling can use measured per-file runtimes to balance
      # workers. On a cache miss binpacker falls back to filesize
      # weighting automatically — no cold-start breakage. The file is
      # written at the end of each successful run and picked up by the
      # next. Key is unique per run-id so the post-step always saves
      # fresh timing data; restore-keys prefix-matches the most recent.
      - name: Restore binpacker timing file
        uses: actions/cache@v6
        with:
          path: tmp/binpacker.timings
          key: binpacker-timings-${{ runner.os }}-ruby${{ matrix.ruby }}-${{ github.run_id }}
          restore-keys: binpacker-timings-${{ runner.os }}-ruby${{ matrix.ruby }}-

      - name: Run tests
        run: make test-binpacker

      # The pool-runner spec is excluded from the default suite (see
      # spec/spec_helper.rb) and runs as its own rspec process. Without
      # this step the gated file has no CI coverage at all — a
      # deterministic failure in it once rotted unnoticed for three
      # weeks (fork-backend default 86ed9129 → fixed 7ebeac08).
      - name: Run pool-runner spec
        run: make test-ractor-pool

  # ── 2. RBS compatibility (3.x + 4.x) ────────────────────────────
  rbs-compat:
    name: RBS compatibility (RBS ${{ matrix.rbs }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rbs: "3.x"
            constraint: "~> 3.10"
            expected_major: "3"
          - rbs: "4.x"
            constraint: "~> 4.0"
            expected_major: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # The public gemspec supports `rbs >= 3.0, < 5.0`, but RBS 3.x and
      # 4.x diverge on the env-population API (`add_signature` /
      # `MultiEntry::D` wrappers vs `add_source` / `RBS::Source` + bare
      # decls) — a divergence that crashed `rigor check` under RBS 3.x.
      # This job exercises both lines against the RBS-loading surface so
      # that range stays honest.
      #
      # The normal development bundle cannot take an `rbs` matrix axis:
      # it includes rbs-inline, whose upstream gem pins `rbs (~> 4.0)`.
      # So this focused compatibility bundle installs Rigor as a path gem
      # — only runtime dependencies, rspec, and the requested RBS line
      # are resolved, with no rbs-inline to constrain it — and never
      # rewrites the repo's Gemfile.lock.
      - name: Install RBS compatibility bundle
        env:
          RBS_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          cat > Gemfile.rbs-compat <<GEMFILE
          source "https://rubygems.org"
          ruby ">= 4.0.0", "< 4.1"
          gem "rigortype", path: "."
          gem "rspec", ">= 3.13", "< 4.0"
          gem "rbs", "$RBS_CONSTRAINT"
          GEMFILE
          BUNDLE_GEMFILE=Gemfile.rbs-compat bundle install --jobs 4 --retry 3

      - name: Assert selected RBS version
        env:
          EXPECTED_RBS_MAJOR: ${{ matrix.expected_major }}
        run: |
          BUNDLE_GEMFILE=Gemfile.rbs-compat bundle exec ruby -e '
            require "rbs"
            expected = ENV.fetch("EXPECTED_RBS_MAJOR")
            abort "expected RBS #{expected}.x, got #{RBS::VERSION}" unless RBS::VERSION.start_with?("#{expected}.")
            puts "RBS #{RBS::VERSION}"
          '

      - name: Run RBS environment compatibility specs
        run: BUNDLE_GEMFILE=Gemfile.rbs-compat bundle exec rspec spec/rigor/environment

  # ── 3. RuboCop ───────────────────────────────────────────────────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # RuboCop stores its result cache under ~/.cache/rubocop_cache
      # on Linux. Cache it keyed on the cop config + lock so a pure
      # gem-version or source change that does not touch linting rules
      # reuses the warm cache and skips re-inspecting unchanged files.
      - name: Restore RuboCop cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/rubocop_cache
          key: rubocop-${{ runner.os }}-${{ hashFiles('.rubocop.yml', '.rubocop_todo.yml', 'Gemfile.lock') }}
          restore-keys: rubocop-${{ runner.os }}-

      - name: Run lint
        run: make lint

  # ── 4. Rigor self-check (warm + cold) ───────────────────────────
  # Two matrix variants run in parallel:
  #   warm — restores .rigor/cache from the previous run so Rigor
  #           exercises the cache read/write path and skips slices
  #           for unchanged (path, sha, config) tuples (ADR-6).
  #   cold — starts with an empty cache directory every time so the
  #           full analysis path is exercised without any cached
  #           state; catches regressions that only surface on a
  #           first-run / cache-miss code path.
  # Both must pass for the required fan-in job to succeed.
  self-check:
    name: Self-check (${{ matrix.cache }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: [warm, cold]
    # Cache validation runs in digest mode here without any env: the
    # `cache.validation: auto` default (#190) detects CI and switches from the
    # stat tier (which a fresh checkout defeats — every tuple regenerates) to
    # content hashes, deterministic across checkouts. This job dogfoods that
    # auto-detection; a regression shows up as the warm restore recomputing
    # slots it should serve.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # ADR-6: the analysis cache grows monotonically and is
      # content-addressed; restoring a warm cache from a prior run
      # skips recomputing slices for unchanged (path, sha, config)
      # tuples.  The key encodes every input that could change the
      # analysis result; a partial match restores the closest ancestor
      # cache and Rigor fills any missing slices on the fly.
      # Skipped entirely for the cold variant — no restore, no save.
      #
      # The restore-keys are scoped to the current Gemfile.lock hash so
      # that a lockfile change (e.g. adding a gem) never restores a cache
      # built under the old lockfile.  A stale-lockfile restore would make
      # the gem-without-rbs count diverge between warm and cold, failing
      # the warm==cold diff gate even when the analysis is correct.
      - name: Restore Rigor analysis cache
        id: restore-cache
        if: matrix.cache == 'warm'
        uses: actions/cache@v6
        with:
          path: .rigor/cache
          key: rigor-cache-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-${{ hashFiles('lib/**/*.rb', 'sig/**/*.rbs', 'data/builtins/**/*.yml') }}
          restore-keys: rigor-cache-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-

      # Issue #427 — put the warm arm in the ONE state that exercises what this gate exists to catch,
      # instead of leaving it to whatever the restore happened to produce.
      #
      # The hazard is the rbs `TypeName#hash` memoisation riding into the Marshal'd `rbs.environment`
      # blob and coming back wrong in a fresh process.  Catching it needs a cross-process restore of
      # that blob AND a real analysis against it.  The arm failed to meet that on two counts:
      #
      #   1. A lockfile change leaves nothing restorable — both keys are scoped to the Gemfile.lock
      #      hash (deliberately; see the note above), so a gem bump starts the arm empty and the diff
      #      compares two cold runs.  Observed green against nothing on #412.
      #   2. Even a FULLY warm arm never loads the environment: measured, with the whole-run
      #      `analysis.run-diagnostics` slot populated, `rigor check` is served straight from it and
      #      `rbs.environment` is consulted zero times.  No analysis, so no hazard on show.
      #
      # So: prime when nothing exact was restored, then drop the whole-run slot.  What remains is the
      # RBS slices, restored across a process boundary, with a real analysis on top — which is the
      # comparison the job's name claims.  `cache-hit` is 'true' only on an exact key match, so a
      # restore-key (prefix) match still primes, where priming is itself warm and costs a second.
      - name: Prime the analysis cache when the restore missed
        if: matrix.cache == 'warm' && steps.restore-cache.outputs.cache-hit != 'true'
        run: bundle exec exe/rigor check lib > /dev/null || true

      - name: Drop the whole-run slot so the warm arm actually analyses
        if: matrix.cache == 'warm'
        run: rm -rf .rigor/cache/analysis.run-diagnostics

      # Run once with --format json so we get both structured output for
      # the warm-vs-cold diff and a human-readable summary in the CI log.
      # continue-on-error keeps the job alive long enough to upload the
      # artifact even when errors are found; we re-raise at the end.
      - name: Run rigor self-check
        id: check
        continue-on-error: true
        run: |
          bundle exec exe/rigor check --format json lib > rigor-raw.json
          rigor_exit=$?
          # Print human-readable diagnostic lines to the CI log.
          jq -r '.diagnostics[] |
            "\(.path):\(.line):\(.column): \(.severity): \(.message)"' \
            rigor-raw.json >&2 || true
          # Normalize for comparison: keep only stable fields, sort
          # deterministically so output order cannot produce a false diff.
          jq '[.diagnostics[] | {path, line, column, severity, rule, message}]
              | sort_by(.path, .line, .column, .rule)' \
            rigor-raw.json > rigor-diagnostics-${{ matrix.cache }}.json || true
          exit $rigor_exit

      # Issue #427 — the anti-vacuity assertion, the shape `make check-mutation-cache` already uses on
      # its own warm arm.  It asserts `rbs.environment` was SERVED this run, which is the difference
      # between "a cache was read" and "the cache that can be wrong was read".  Runs after the
      # self-check; it re-establishes the measured run's cache state itself, because that run writes the
      # whole-run slot back.
      - name: Assert the warm arm was served from cache
        if: matrix.cache == 'warm'
        run: bundle exec ruby tool/warm_cache_assertion.rb lib

      # Upload even when the check found errors so the diff job always
      # has both artifacts to compare.
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rigor-diagnostics-${{ matrix.cache }}
          path: rigor-diagnostics-${{ matrix.cache }}.json
          retention-days: 1

      - name: Fail if self-check found errors
        if: steps.check.outcome == 'failure'
        run: |
          echo "rigor self-check found errors — see diagnostic output above"
          exit 1

      # Precision gate: `rigor coverage --threshold 0.43 lib` fails when the
      # type-inference precision ratio on Rigor's own source drops below 43 %.
      # The cold variant runs this so the gate exercises the full analysis path
      # without any cached assistance; the warm variant skips it to avoid
      # double-counting in CI time.
      - name: Run precision coverage gate
        if: matrix.cache == 'cold'
        run: make coverage

      # Plugin-contract gate (ADR-43): the bundled plugin / example LIB
      # trees must stay clean under `rigor check`. ADR-43 ancestor
      # resolution makes a plugin's inherited contract calls
      # (`manifest.…`, `io_boundary.…`) resolve against `Plugin::Base`'s
      # RBS, so misuse of the contract surface surfaces here as
      # `call.undefined-method`. Cold variant only — the result is
      # deterministic and needs no warm/cold cross-check.
      - name: Run plugin-contract check
        if: matrix.cache == 'cold'
        run: make check-plugins

      # Incremental-analysis acceptance gate (ADR-46): the incremental
      # analyzer must produce diagnostics byte-identical to a full run.
      # `--verify-incremental` re-analyzes a subset and serves the rest
      # from the per-file cache, then asserts the merge equals a full
      # `--no-cache` analysis — a mismatch would mean a stale, manufactured
      # diagnostic. Cold variant only; the result is deterministic.
      - name: Run incremental-analysis gate
        if: matrix.cache == 'cold'
        run: make check-incremental

      # Mutation-cache acceptance gate (#134 slice 3): the per-file
      # mutation-result cache must serve a measurement byte-identical to
      # the cold one. ADR-46 made that obligation mandatory for the
      # incremental check path and a cached per-file MEASUREMENT inherits
      # it — the number the cache serves is the number `--threshold` gates
      # a build on. The gate also asserts the warm arm really was served
      # from cache, so it cannot pass vacuously the day the cache disables
      # itself. Cold variant only, like the gate above: deterministic, and
      # it warms its own snapshot.
      - name: Run mutation-cache gate
        if: matrix.cache == 'cold'
        run: make check-mutation-cache

  # ── 5. Warm-vs-cold diagnostic diff ─────────────────────────────
  # The two self-check variants must agree on every diagnostic.  Any
  # difference means the cache is altering analysis results — a bug.
  # Runs whenever self-check was not outright cancelled (so the diff
  # still executes when one variant failed, surfacing a discrepancy).
  self-check-diff:
    name: Self-check diff (warm == cold)
    needs: [changes, self-check]
    runs-on: ubuntu-latest
    # Skip on a Markdown-only PR (self-check was skipped, so there are no
    # artifacts to diff). Otherwise run whenever self-check was not
    # outright cancelled, so a discrepancy still surfaces when one variant
    # failed.
    if: always() && needs.changes.outputs.code == 'true' && needs.self-check.result != 'cancelled'
    steps:
      - name: Download warm diagnostics
        uses: actions/download-artifact@v8
        with:
          name: rigor-diagnostics-warm
          path: .

      - name: Download cold diagnostics
        uses: actions/download-artifact@v8
        with:
          name: rigor-diagnostics-cold
          path: .

      - name: Assert warm == cold
        run: |
          if diff -u rigor-diagnostics-warm.json rigor-diagnostics-cold.json; then
            echo "warm and cold diagnostics are identical"
          else
            echo "Cache-dependent diagnostics detected — warm and cold differ."
            echo "A stale or corrupt cache entry is producing different results."
            exit 1
          fi

  # ── 6. Self-check under the bleeding-edge overlay ───────────────
  # ADR-50 § WD2's "Rigor's own CI exercises the overlay" made real: `rigor
  # check` under the WHOLE queued overlay (`--bleeding-edge` = adopt all)
  # must stay clean on Rigor's own lib, because WD7 graduation flips a
  # queued discipline default-on at a major, and lib drifting out of
  # compliance with a queued discipline would otherwise surface only on
  # graduation day.
  #
  # This exercises severity features only: a behaviour feature changes what
  # a separate command measures, not what `check` analyses, and its on/off
  # correctness is spec'd in the suite (byte-identity with the feature
  # off), not exercised here.
  #
  # Runs cold on purpose — deterministic, no cache interplay: no cache
  # restore and no JSON artifact, since the exit code is the whole
  # assertion.
  self-check-bleeding-edge:
    name: Self-check (bleeding-edge)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run rigor self-check under the bleeding-edge overlay
        run: bundle exec exe/rigor check --bleeding-edge lib

  # ── Fan-in: single required-check target for branch protection ───
  # Configure branch protection to require only "CI required" rather
  # than each individual job. New jobs added above are automatically
  # gated without touching protection rules.
  required:
    name: CI required
    needs: [changes, test, rbs-compat, lint, self-check, self-check-diff, self-check-bleeding-edge]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RBS_COMPAT_RESULT: ${{ needs.rbs-compat.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SELF_CHECK_RESULT: ${{ needs.self-check.result }}
          SELF_CHECK_DIFF_RESULT: ${{ needs.self-check-diff.result }}
          SELF_CHECK_BLEEDING_EDGE_RESULT: ${{ needs.self-check-bleeding-edge.result }}
        run: |
          failed=0
          # Change detection must always succeed — it is what decides
          # whether the gated jobs were legitimately skipped.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed (result: $CHANGES_RESULT)"
            failed=1
          fi
          # A gated job that was skipped (Markdown-only PR) is acceptable;
          # only an outright failure or cancellation blocks the merge.
          for job_result in "$TEST_RESULT" "$RBS_COMPAT_RESULT" "$LINT_RESULT" "$SELF_CHECK_RESULT" "$SELF_CHECK_DIFF_RESULT" "$SELF_CHECK_BLEEDING_EDGE_RESULT"; do
            if [[ "$job_result" != "success" && "$job_result" != "skipped" ]]; then
              echo "A required job did not succeed (result: $job_result)"
              failed=1
            fi
          done
          exit $failed

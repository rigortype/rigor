# Pins for `make coverage` (tool/coverage_ratchet.rb, #3315): two figures of the precision scan over Rigor's own
# `lib/`. The ratchet is one-sided:
#
# - A figure worse than its pin by more than `slack` fails: declare what the change left untyped in `sig/`, or move
#   the pin the worse way through an approval-queue.d/ entry of class `gate-row` (docs/agents/contribution-flow.md
#   § "Decisions and the approval queue").
# - A figure better than its pin by more than `slack` passes with a notice. `make coverage-tighten` writes every gain
#   in and never loosens a pin; the PR that lands a typing batch runs it, and release prep does.
#
# The scan is deterministic, so the slack is not noise margin: it is the drift ordinary changes may carry against a
# pin. Measured over 17 merged PRs (the review of #3356, 2026-11-19), an ordinary refactor moves a figure by 0.02 to
# 0.047 points; #3354's 28 `sig/` declarations moved the call share by -0.26 points and precision by +0.16; removing
# four of them (`DependencyRecorder.active?` and the `try_dispatch` of KernelDispatch, RbsDispatch and ShapeDispatch)
# moves the call share by +0.12 and fails. How to read and refresh the figures: docs/agents/measurement.md
# § "The self-typing ratchet".

# The configuration the figures are measured under; the tool refuses any other. `.rigor.gates.yml` is the self-check
# configuration with `parameter_inference:` off, so the ratchet sees a regression in declarations or in the engine but
# not one in parameter inference itself.
config: .rigor.gates.yml
parameter_inference: false

# `precise_ratio` of `rigor coverage --format json lib`: expressions whose type is constant, nominal, shaped, refined
# or bot, over every expression counted.
precision:
  pin: 0.5958 # 239217 / 401466
  slack: 0.0010

# `dynamic_call_count` / `call_sites`: the `Prism::CallNode`s whose result is a whole `Dynamic` or a union whose worst
# member is one (the `dynamic_top` and `dynamic_specific` tiers), over every `Prism::CallNode`.
dynamic_call_share:
  pin: 0.4983 # 50984 / 102322
  slack: 0.0010

# A scan that counted fewer than these visited the wrong tree or lost files, and its ratios prove nothing.
floors:
  expressions: 350000
  call_sites: 90000

# A move larger than this from a pin, either way, is an instrument change, not a typing change.
max_step: 0.02

    Rigor::Inference::ProjectPatchedScanner::Mixins#pending: 'issue #1708, records the include / prepend edges a pre_eval: file writes (Numeric.include(M), include M in a body, a top-level include into Object) for the pre_eval: registry''s ancestor walk only; it writes no discovery table and derives no declaration context'

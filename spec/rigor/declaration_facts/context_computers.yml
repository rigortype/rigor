# Declaration-context computers (#1507): every Ruby file under lib/ and plugins/*/lib/ whose code names
# Prism::ClassNode, Prism::ModuleNode or Prism::SingletonClassNode. context_computers_spec.rb computes that
# set from the tree and compares it with this list, so a new file fails until it is listed here with what
# it computes and the helper it uses:
#
# - DeclarationWalk::Context: the shared declaration walk (ADR-116 WD5);
# - ModuleFunctionState: the module_function readings;
# - "own: <reason>": the file tracks the context itself, and why.
#
# A forthcoming ADR decides when a listed file must move onto a helper. Until then this list records the
# computers that exist, so a new one is a decision rather than a copy.

lib/rigor/analysis/check_rules/ivar_write_collector.rb:
  computes: the instance-variable writes in each class's instance-method bodies, keyed by qualified name
  helpers:
    - "own: a check-rule collector that needs only the lexical qualified prefix"
lib/rigor/analysis/check_rules/lexical_method_sites.rb:
  computes: where a using activates refinements and where a singleton def on a local is in scope
  helpers:
    - "own: per-file lexical spans for call.undefined-method, read off the syntax"
lib/rigor/analysis/check_rules/rule_walk.rb:
  computes: the single AST walk that hosts the check-rule collectors
  helpers:
    - "own: uses the nodes as collector boundaries and derives no declaration context"
lib/rigor/analysis/check_rules/self_closedness_scanner.rb:
  computes: the qualified names of modules and open classes that call.self-undefined-method skips
  helpers:
    - "own: a check-rule scan that needs only the lexical qualified prefix"
lib/rigor/analysis/check_rules/shadowed_rescue_collector.rb:
  computes: the qualified owner a flow.shadowed-rescue-clause diagnostic names
  helpers:
    - "own: extends the lexical qualified prefix only"
lib/rigor/analysis/dependency_source_inference/walker.rb:
  computes: the method catalog of an opt-in gem's source roots, per class and side
  helpers:
    - "own: walks gem source, not the project, and feeds no discovery table"
lib/rigor/analysis/reachability/scan.rb:
  computes: every constant declaration and reference with the lexical nesting in force there (ADR-102)
  helpers:
    - "own: the reference index's nesting, independent of the typing path by design"
lib/rigor/effects/definition_context.rb:
  computes: the side a definition lands on and the self its body runs with, for the effects scan
  helpers:
    - "own: the effects model's definee and self rules (ADR-103)"
lib/rigor/effects/definition_lines.rb:
  computes: the line a method key's def is written at, in the file the key was traced to
  helpers:
    - "own: indexes that one file's defs, deliberately not a second discovery pass"
lib/rigor/effects/scanner.rb:
  computes: the effect units a file defines, keyed Class#m or Class.m, and their superclasses
  helpers:
    - "own: the effects scan keys units on its own walk (ADR-103 WD14)"
lib/rigor/environment/missing_gem_constant_index.rb:
  computes: the top-level constant names an RBS-less gem declares
  helpers:
    - "own: reads only the root segment of top-level headers in gem files"
lib/rigor/inference/captured_locals.rb:
  computes: the outer locals a block body can rebind
  helpers:
    - "own: uses the nodes as hard scope barriers and derives no declaration context"
lib/rigor/inference/declaration_walk/traversal.rb:
  computes: the shared declaration walk that hands each ScopeIndexer collector its self, cref and nesting
  helpers:
    - DeclarationWalk::Context
lib/rigor/inference/expression_typer.rb:
  computes: the type a class or module expression evaluates to, and the barrier around a re-typed callee body
  helpers:
    - "own: typing dispatch on the node class, not a declaration context"
lib/rigor/inference/global_write_census.rb:
  computes: the global write census (aliases, answer-method defines, top-level mixins)
  helpers:
    - "own: tells the top level from a class or module body and nothing more"
lib/rigor/inference/guard_rebinding.rb:
  computes: where a guard's narrowing of a global or constant stops holding
  helpers:
    - "own: uses the nodes as scan barriers and derives no declaration context"
lib/rigor/inference/jump_targets.rb:
  computes: the break and next nodes that target a construct
  helpers:
    - "own: uses the nodes as retargeting barriers and derives no declaration context"
lib/rigor/inference/last_line/self_evidence.rb:
  computes: what a file shows about the self its implicit-self gets and readline readers run with
  helpers:
    - "own: tracks the self of class, module, class << self and def self bodies in its own walk"
lib/rigor/inference/match_rebinding.rb:
  computes: which code may rebind the regex match globals
  helpers:
    - "own: uses the nodes as frame barriers and derives no declaration context"
lib/rigor/inference/method_dispatcher/member_shape_projection.rb:
  computes: whether a Data or Struct member reader is redefined in the class body
  helpers:
    - "own: uses the nodes as reader-scope barriers and derives no declaration context"
lib/rigor/inference/module_function_state.rb:
  computes: what a module_function call does to the defs around it, for each of its four readers
  helpers:
    - ModuleFunctionState
lib/rigor/inference/operand_effects.rb:
  computes: whether an operand holds a write or a jump the scope after it must see
  helpers:
    - "own: uses the nodes as scope barriers and derives no declaration context"
lib/rigor/inference/project_patched_scanner.rb:
  computes: the def and def self methods each class declares in the pre_eval files (ADR-17)
  helpers:
    - "own: a deliberately smaller walk than ScopeIndexer's, over pre_eval files only"
lib/rigor/inference/receiver_blind_block.rb:
  computes: whether a block can see the hash an in-place transform is rewriting
  helpers:
    - "own: uses the nodes as scope barriers and derives no declaration context"
lib/rigor/inference/scope_indexer.rb:
  computes: the per-file and project discovery tables (methods, def nodes, visibilities, mixins, constants, ranges)
  helpers:
    - DeclarationWalk::Context
    - ModuleFunctionState
    - "own: the walkers not yet on the shared walk (#1197)"
lib/rigor/inference/scope_indexer/member_layouts_collector.rb:
  computes: each Data and Struct class's member layout
  helpers:
    - DeclarationWalk::Context
lib/rigor/inference/statement_evaluator.rb:
  computes: the scope a class, module or class << self body is evaluated in
  helpers:
    - "own: the evaluator's lexical frame (ADR-4), not a discovery table"
lib/rigor/inference/struct_fold_safety.rb:
  computes: the Struct locals that are never mutated, aliased or escaped
  helpers:
    - "own: uses the nodes as local-scope boundaries and derives no declaration context"
lib/rigor/inference/synthetic_method_scanner.rb:
  computes: the synthetic methods plugin heredoc-template DSL calls define on each class (ADR-16)
  helpers:
    - "own: resolves class names from its own scope stack"
lib/rigor/language_server/document_symbol_provider.rb:
  computes: the editor outline of classes, modules and defs
  helpers:
    - "own: an editor view that needs only the syntax"
lib/rigor/language_server/folding_range_provider.rb:
  computes: the editor's folding ranges
  helpers:
    - "own: an editor view that needs only the syntax"
lib/rigor/plugin/node_context.rb:
  computes: the enclosing class or module a node rule sees (ADR-37)
  helpers:
    - "own: reads the node's ancestors the plugin walk already holds"
lib/rigor/sig_gen/generator.rb:
  computes: the defs, attribute readers and ivar observations sig-gen emits per qualified class
  helpers:
    - ModuleFunctionState
    - "own: sig-gen's namespace walk, which also records module-or-class kinds for the writer"
lib/rigor/sig_gen/observation_collector.rb:
  computes: the qualified class of each observed call site's enclosing declaration
  helpers:
    - "own: needs only the lexical qualified prefix"
plugins/rigor-actioncable/lib/rigor/plugin/actioncable/channel_discoverer.rb:
  computes: the ActionCable channel classes and their lexical paths
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-actionmailer/lib/rigor/plugin/actionmailer/mailer_discoverer.rb:
  computes: the mailer classes and the actions their modules contribute
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-actionpack/lib/rigor/plugin/actionpack/analyzer.rb:
  computes: the name of the controller enclosing a node
  helpers:
    - "own: reads the node-rule ancestors the plugin walk already holds"
plugins/rigor-actionpack/lib/rigor/plugin/actionpack/controller_discoverer.rb:
  computes: the controller classes, their parents and their included modules
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-actionpack/lib/rigor/plugin/actionpack/controller_scan.rb:
  computes: each controller class with its namespace
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-active-model-serializers/lib/rigor/plugin/active_model_serializers/serializer_discoverer.rb:
  computes: the serializer classes whose ancestry closes back to a configured root
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-activejob/lib/rigor/plugin/activejob/job_discoverer.rb:
  computes: the job classes and their lexical paths
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-activerecord/lib/rigor/plugin/activerecord/model_discoverer.rb:
  computes: the model classes, their table names and the table-name decorators, including its own module_function reading
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-activestorage/lib/rigor/plugin/activestorage/attachment_discoverer.rb:
  computes: the attachment declarations of each model class
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-dry-schema/lib/rigor/plugin/dry_schema/schema_scanner.rb:
  computes: the schema definitions under each qualified prefix
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-dry-types/lib/rigor/plugin/dry_types/alias_scanner.rb:
  computes: the alias table of each module that includes Dry.Types()
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-dry-validation/lib/rigor/plugin/dry_validation/contract_scanner.rb:
  computes: the contract classes, their params blocks and their rule issues
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-ffi/lib/rigor/plugin/ffi.rb:
  computes: the node rule that checks FFI struct classes
  helpers:
    - "own: registers a node rule on the class node and derives no declaration context"
plugins/rigor-ffi/lib/rigor/plugin/ffi/analyzer.rb:
  computes: the ffx diagnostics for one class node
  helpers:
    - "own: reads the class node it is handed and derives no declaration context"
plugins/rigor-ffi/lib/rigor/plugin/ffi/discoverer.rb:
  computes: the FFI catalog (bindings, libraries, structs, typedefs, enums, callbacks) per enclosing module
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-graphql/lib/rigor/plugin/graphql/type_scanner.rb:
  computes: the GraphQL object, enum, input-object and mutation classes and their field and argument tables
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-hanami/lib/rigor/plugin/hanami.rb:
  computes: the node rule that checks the Hanami::Action protocol
  helpers:
    - "own: registers a node rule on the class node and derives no declaration context"
plugins/rigor-hanami/lib/rigor/plugin/hanami/action_checker.rb:
  computes: the defs a class body declares directly
  helpers:
    - "own: uses nested declarations as barriers and derives no declaration context"
plugins/rigor-pundit/lib/rigor/plugin/pundit/policy_discoverer.rb:
  computes: the policy classes and their lexical paths
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-rails-routes/lib/rigor/plugin/rails_routes/grape_api_discoverer.rb:
  computes: the Grape API classes and their superclasses
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-rails-routes/lib/rigor/plugin/rails_routes/helper_discoverer.rb:
  computes: the _path and _url helper names the helper modules define
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-sidekiq/lib/rigor/plugin/sidekiq/worker_discoverer.rb:
  computes: the Sidekiq worker classes and their lexical paths
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"
plugins/rigor-sorbet/lib/rigor/plugin/sorbet/catalog_walker.rb:
  computes: the Sorbet sig catalog per class and side
  helpers:
    - "own: a plugin discovery walk; the plugin API offers no shared declaration context"

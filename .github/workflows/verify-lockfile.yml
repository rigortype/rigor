# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.

name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - master
  # The merge queue runs only workflows that listen for merge_group. Without
  # this trigger a required verify-lockfile check would never report there,
  # and every queued PR would wait on it forever (#2620).
  merge_group:

permissions:
  contents: read

jobs:
  # Named for the workflow: a ruleset requires a check by its context name, and
  # a bare `verify` would also be satisfied by any later job of that name.
  verify-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify

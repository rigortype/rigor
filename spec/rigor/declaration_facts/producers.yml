  producers:
    Rigor::Analysis::CheckRules::LexicalMethodSites: 'issue #1722, finds the calls that give one local''s object singleton methods (o.extend, o.define_singleton_method, an instance_eval block that writes a def) for call.undefined-method''s per-file local-scope decline; it derives no declaration context'
    Rigor::Analysis::CheckRules::LexicalMethodSites#defines_on_self?: 'issue #1722, finds the calls that give one local''s object singleton methods (o.extend, o.define_singleton_method, an instance_eval block that writes a def) for call.undefined-method''s per-file local-scope decline; it derives no declaration context'
    Rigor::Analysis::CheckRules::LexicalMethodSites#opened_method_name: 'issue #1722, finds the calls that give one local''s object singleton methods (o.extend, o.define_singleton_method, an instance_eval block that writes a def) for call.undefined-method''s per-file local-scope decline; it derives no declaration context'
    Rigor::Analysis::CheckRules::LexicalMethodSites#walk: grandfathered

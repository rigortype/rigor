    Rigor::Effects::Scanner#declaration?: grandfathered
    Rigor::Effects::Scanner#record_declaration: grandfathered
    Rigor::Effects::Scanner#walk: grandfathered
    Rigor::Effects::Scanner#walk_namespace: grandfathered
lib/rigor/effects/visibility.rb:

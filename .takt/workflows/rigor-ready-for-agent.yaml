name: rigor-ready-for-agent
description: >
  Rigor ready-for-agent lane (ADR-115): plan → implement → draft PR. The lane
  ends at the Draft PR; the coordinator waits for CI, runs the independent
  adversarial review and lands (see .takt/README.md).
max_steps: 20
initial_step: plan

# Unattended providers deny every tool not allow-listed: without this the plan
# step cannot run `gh issue view`. Steps that write override it with `edit`.
capabilities: readonly

personas:
  architect: ../facets/personas/architect.md
  lane: ../facets/personas/lane.md
  shipper: ../facets/personas/shipper.md

policies:
  rigor-lane: ../facets/policies/rigor-lane.md

instructions:
  plan: ../facets/instructions/plan.md
  develop: ../facets/instructions/develop.md
  ship-draft-pr: ../facets/instructions/ship-draft-pr.md

steps:
  - name: plan
    persona: architect
    policy: rigor-lane
    instruction: plan
    edit: false
    rules:
      - condition: Plan ready
        next: develop
      - condition: Blocked — need human
        next: ABORT

  - name: develop
    capabilities: edit
    persona: lane
    policy: rigor-lane
    instruction: develop
    edit: true
    required_permission_mode: edit
    rules:
      - condition: Implementation ready to ship
        next: ship
      - condition: Blocked — need human
        next: ABORT

  - name: ship
    capabilities: edit
    persona: shipper
    policy: rigor-lane
    instruction: ship-draft-pr
    edit: true
    required_permission_mode: edit
    allow_git_commit: true
    rules:
      - condition: Draft PR opened
        next: COMPLETE
      - condition: Draft PR already exists
        next: COMPLETE
      - condition: Ship blocked
        next: ABORT

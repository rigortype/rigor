# ADR-29 WD8 — config packed into the wasm VFS at /playground/.rigor.yml.
#
# A verbatim copy of apps/rigor-playground/.rigor.yml. The in-VM
# adapter (boot.rb) `Dir.chdir`s here before invoking the CLI, so
# `Rigor::CLI.start`'s normal cwd-based config discovery finds it —
# identical wiring to the Rack backend, which inherits this file from
# the Puma process CWD.
#
# Kept as a copy rather than a symlink because the wasm packer follows a
# real-file tree; if these drift, the build doc's verification step
# (a known snippet whose diagnostics must match the backend) catches it.
plugins:
  - gem: rigor-rbs-inline
    id: rbs-inline
    config:
      require_magic_comment: false

severity_profile: strict

# yaml-language-server: $schema=schemas/rigor-config.schema.json
target_ruby: "4.0"
paths:
  - lib
plugins: []
# A declared `-> void` is a contract about the caller ("do not rely on the value"); the rule that checks it
# is off in every severity profile, so the self-check enables it (ADR-107; 0 findings when enabled).
severity_overrides:
  static.value-use.void: warning
cache:
  path: .rigor/cache

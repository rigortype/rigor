name: VSCode extension

# Build + package check for the first-party VSCode extension.
# Publishing to the VS Marketplace / Open VSX stays manual and
# authorisation-gated — see editors/vscode/package.json scripts.

on:
  push:
    branches:
      - master
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"

permissions:
  contents: read

jobs:
  build:
    name: build + package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Bundle
        run: npm run compile

      - name: Package .vsix
        run: npx --no-install @vscode/vsce package --no-dependencies --out rigor.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: rigor-vsix
          path: editors/vscode/rigor.vsix

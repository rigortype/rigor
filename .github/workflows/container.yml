name: container

# Build and publish the standalone Rigor container image to GHCR
# (ADR-27 slice 4). Runs on a release tag, or on demand for a
# specific gem version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "rigortype gem version to package"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the gem version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # `rake release` pushes the tag before it pushes the gem, so a
      # tag-triggered run can start before rigortype is on RubyGems.
      # Wait for it rather than fail the `gem install` in the build.
      - name: Wait for the gem on RubyGems
        run: |
          version="${{ steps.version.outputs.value }}"
          for attempt in $(seq 1 30); do
            if curl -sf "https://rubygems.org/api/v1/versions/rigortype.json" \
                 | grep -q "\"number\":\"${version}\""; then
              echo "rigortype ${version} is available"
              exit 0
            fi
            echo "attempt ${attempt}: rigortype ${version} not on RubyGems yet"
            sleep 20
          done
          echo "timed out waiting for rigortype ${version} on RubyGems" >&2
          exit 1

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RIGOR_VERSION=${{ steps.version.outputs.value }}

  producers:
    Rigor::Analysis::Incremental: 'issue #2161, reads the `[:module_function, owner, name]` entries ScopeIndexer#add_module_function_entries puts in a file''s visibility entries only to pick the `visibility:` keys an --incremental recheck fires; it records no declaration fact and derives no context'
    Rigor::Analysis::Incremental#changed_visibility_slots: 'issue #2161, reads the `[:module_function, owner, name]` entries ScopeIndexer#add_module_function_entries puts in a file''s visibility entries only to pick the `visibility:` keys an --incremental recheck fires; it records no declaration fact and derives no context'

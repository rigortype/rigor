  producers:
    Rigor::Inference::DefinerResolution#visibility_answer: a consumer, not a declaration producer; `:public` is the visibility it answers for a definer with none recorded, and it writes no table
lib/rigor/inference/expression_typer.rb:
  computes: the type a class or module expression evaluates to, and the barrier around a re-typed callee body
  producers:
    Rigor::Inference::ExpressionTyper: grandfathered
    Rigor::Inference::ExpressionTyper#prefix_statement_jump_free?: grandfathered
    Rigor::Inference::ExpressionTyper#untraced_type_of: grandfathered
    Rigor::Inference::ExpressionTyper#yield_reachable?: grandfathered
lib/rigor/inference/global_write_census.rb:

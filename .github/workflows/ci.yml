name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:

# Cancel any in-progress run on the same branch when a new commit
# arrives. Pushes to master and to a release/* branch are always run to
# completion so the commit-level status is always present (a release
# branch is a publish candidate — its base gate must not be cancelled
# mid-run); other refs (PR head branches) cancel the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/release/') }}

permissions:
  contents: read

jobs:
  # ── 1. RSpec suite ───────────────────────────────────────────────
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Cache the parallel-rspec runtime log between runs so that
      # `--group-by default` can use measured per-file runtimes to
      # balance groups. On a cache miss (first run, or after the key
      # space is evicted) parallel_rspec falls back to filesize
      # automatically — no cold-start breakage. The log is written at
      # the end of each successful run and picked up by the next.
      # Key is unique per run-id so the post-step always saves fresh
      # timing data; restore-keys prefix-matches the most recent entry.
      - name: Restore parallel-rspec runtime log
        uses: actions/cache@v5
        with:
          path: tmp/parallel_runtime.log
          key: parallel-runtime-${{ runner.os }}-ruby${{ matrix.ruby }}-${{ github.run_id }}
          restore-keys: parallel-runtime-${{ runner.os }}-ruby${{ matrix.ruby }}-

      - name: Run tests
        run: make test-parallel

      # The pool-runner spec is excluded from the default suite (see
      # spec/spec_helper.rb) and runs as its own rspec process. Without
      # this step the gated file has no CI coverage at all — a
      # deterministic failure in it once rotted unnoticed for three
      # weeks (fork-backend default 86ed9129 → fixed 7ebeac08).
      - name: Run pool-runner spec
        run: make test-ractor-pool

  # ── 1b. binpacker parallel suite (trial, not required) ──────────
  # Runs the spec suite via binpacker alongside the parallel_tests job
  # to validate correctness and measure scheduling quality during the
  # trial period. Intentionally excluded from the `required` fan-in
  # so a binpacker regression never blocks a merge while it is still
  # under observation. Promote to `required` once the trial passes.
  test-binpacker:
    name: Tests via binpacker (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Cache the binpacker timing file between runs so that LPT
      # scheduling can use measured per-file runtimes to balance
      # workers. On a cache miss binpacker falls back to filesize
      # weighting automatically — no cold-start breakage.
      - name: Restore binpacker timing file
        uses: actions/cache@v5
        with:
          path: tmp/binpacker.timings
          key: binpacker-timings-${{ runner.os }}-ruby${{ matrix.ruby }}-${{ github.run_id }}
          restore-keys: binpacker-timings-${{ runner.os }}-ruby${{ matrix.ruby }}-

      - name: Run tests via binpacker
        run: make test-binpacker

  # ── 2. RBS compatibility (3.x + 4.x) ────────────────────────────
  rbs-compat:
    name: RBS compatibility (RBS ${{ matrix.rbs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rbs: "3.x"
            constraint: "~> 3.10"
            expected_major: "3"
          - rbs: "4.x"
            constraint: "~> 4.0"
            expected_major: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # The public gemspec supports `rbs >= 3.0, < 5.0`, but RBS 3.x and
      # 4.x diverge on the env-population API (`add_signature` /
      # `MultiEntry::D` wrappers vs `add_source` / `RBS::Source` + bare
      # decls) — a divergence that crashed `rigor check` under RBS 3.x.
      # This job exercises both lines against the RBS-loading surface so
      # that range stays honest.
      #
      # The normal development bundle cannot take an `rbs` matrix axis:
      # it includes rbs-inline, whose upstream gem pins `rbs (~> 4.0)`.
      # So this focused compatibility bundle installs Rigor as a path gem
      # — only runtime dependencies, rspec, and the requested RBS line
      # are resolved, with no rbs-inline to constrain it — and never
      # rewrites the repo's Gemfile.lock.
      - name: Install RBS compatibility bundle
        env:
          RBS_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          cat > Gemfile.rbs-compat <<GEMFILE
          source "https://rubygems.org"
          ruby ">= 4.0.0", "< 4.1"
          gem "rigortype", path: "."
          gem "rspec", ">= 3.13", "< 4.0"
          gem "rbs", "$RBS_CONSTRAINT"
          GEMFILE
          BUNDLE_GEMFILE=Gemfile.rbs-compat bundle install --jobs 4 --retry 3

      - name: Assert selected RBS version
        env:
          EXPECTED_RBS_MAJOR: ${{ matrix.expected_major }}
        run: |
          BUNDLE_GEMFILE=Gemfile.rbs-compat bundle exec ruby -e '
            require "rbs"
            expected = ENV.fetch("EXPECTED_RBS_MAJOR")
            abort "expected RBS #{expected}.x, got #{RBS::VERSION}" unless RBS::VERSION.start_with?("#{expected}.")
            puts "RBS #{RBS::VERSION}"
          '

      - name: Run RBS environment compatibility specs
        run: BUNDLE_GEMFILE=Gemfile.rbs-compat bundle exec rspec spec/rigor/environment

  # ── 3. RuboCop ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # RuboCop stores its result cache under ~/.cache/rubocop_cache
      # on Linux. Cache it keyed on the cop config + lock so a pure
      # gem-version or source change that does not touch linting rules
      # reuses the warm cache and skips re-inspecting unchanged files.
      - name: Restore RuboCop cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/rubocop_cache
          key: rubocop-${{ runner.os }}-${{ hashFiles('.rubocop.yml', '.rubocop_todo.yml', 'Gemfile.lock') }}
          restore-keys: rubocop-${{ runner.os }}-

      - name: Run lint
        run: make lint

  # ── 4. Rigor self-check (warm + cold) ───────────────────────────
  # Two matrix variants run in parallel:
  #   warm — restores .rigor/cache from the previous run so Rigor
  #           exercises the cache read/write path and skips slices
  #           for unchanged (path, sha, config) tuples (ADR-6).
  #   cold — starts with an empty cache directory every time so the
  #           full analysis path is exercised without any cached
  #           state; catches regressions that only surface on a
  #           first-run / cache-miss code path.
  # Both must pass for the required fan-in job to succeed.
  self-check:
    name: Self-check (${{ matrix.cache }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: [warm, cold]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # ADR-6: the analysis cache grows monotonically and is
      # content-addressed; restoring a warm cache from a prior run
      # skips recomputing slices for unchanged (path, sha, config)
      # tuples.  The key encodes every input that could change the
      # analysis result; a partial match restores the closest ancestor
      # cache and Rigor fills any missing slices on the fly.
      # Skipped entirely for the cold variant — no restore, no save.
      #
      # The restore-keys are scoped to the current Gemfile.lock hash so
      # that a lockfile change (e.g. adding a gem) never restores a cache
      # built under the old lockfile.  A stale-lockfile restore would make
      # the gem-without-rbs count diverge between warm and cold, failing
      # the warm==cold diff gate even when the analysis is correct.
      - name: Restore Rigor analysis cache
        if: matrix.cache == 'warm'
        uses: actions/cache@v5
        with:
          path: .rigor/cache
          key: rigor-cache-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-${{ hashFiles('lib/**/*.rb', 'sig/**/*.rbs', 'data/builtins/**/*.yml') }}
          restore-keys: rigor-cache-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-

      # Run once with --format json so we get both structured output for
      # the warm-vs-cold diff and a human-readable summary in the CI log.
      # continue-on-error keeps the job alive long enough to upload the
      # artifact even when errors are found; we re-raise at the end.
      - name: Run rigor self-check
        id: check
        continue-on-error: true
        run: |
          bundle exec exe/rigor check --format json lib > rigor-raw.json
          rigor_exit=$?
          # Print human-readable diagnostic lines to the CI log.
          jq -r '.diagnostics[] |
            "\(.path):\(.line):\(.column): \(.severity): \(.message)"' \
            rigor-raw.json >&2 || true
          # Normalize for comparison: keep only stable fields, sort
          # deterministically so output order cannot produce a false diff.
          jq '[.diagnostics[] | {path, line, column, severity, rule, message}]
              | sort_by(.path, .line, .column, .rule)' \
            rigor-raw.json > rigor-diagnostics-${{ matrix.cache }}.json || true
          exit $rigor_exit

      # Upload even when the check found errors so the diff job always
      # has both artifacts to compare.
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rigor-diagnostics-${{ matrix.cache }}
          path: rigor-diagnostics-${{ matrix.cache }}.json
          retention-days: 1

      - name: Fail if self-check found errors
        if: steps.check.outcome == 'failure'
        run: |
          echo "rigor self-check found errors — see diagnostic output above"
          exit 1

      # Precision gate: `rigor coverage --threshold 0.43 lib` fails when the
      # type-inference precision ratio on Rigor's own source drops below 43 %.
      # The cold variant runs this so the gate exercises the full analysis path
      # without any cached assistance; the warm variant skips it to avoid
      # double-counting in CI time.
      - name: Run precision coverage gate
        if: matrix.cache == 'cold'
        run: make coverage

      # Plugin-contract gate (ADR-43): the bundled plugin / example LIB
      # trees must stay clean under `rigor check`. ADR-43 ancestor
      # resolution makes a plugin's inherited contract calls
      # (`manifest.…`, `io_boundary.…`) resolve against `Plugin::Base`'s
      # RBS, so misuse of the contract surface surfaces here as
      # `call.undefined-method`. Cold variant only — the result is
      # deterministic and needs no warm/cold cross-check.
      - name: Run plugin-contract check
        if: matrix.cache == 'cold'
        run: make check-plugins

      # Incremental-analysis acceptance gate (ADR-46): the incremental
      # analyzer must produce diagnostics byte-identical to a full run.
      # `--verify-incremental` re-analyzes a subset and serves the rest
      # from the per-file cache, then asserts the merge equals a full
      # `--no-cache` analysis — a mismatch would mean a stale, manufactured
      # diagnostic. Cold variant only; the result is deterministic.
      - name: Run incremental-analysis gate
        if: matrix.cache == 'cold'
        run: make check-incremental

  # ── 5. Warm-vs-cold diagnostic diff ─────────────────────────────
  # The two self-check variants must agree on every diagnostic.  Any
  # difference means the cache is altering analysis results — a bug.
  # Runs whenever self-check was not outright cancelled (so the diff
  # still executes when one variant failed, surfacing a discrepancy).
  self-check-diff:
    name: Self-check diff (warm == cold)
    needs: self-check
    runs-on: ubuntu-latest
    if: always() && needs.self-check.result != 'cancelled'
    steps:
      - name: Download warm diagnostics
        uses: actions/download-artifact@v8
        with:
          name: rigor-diagnostics-warm
          path: .

      - name: Download cold diagnostics
        uses: actions/download-artifact@v8
        with:
          name: rigor-diagnostics-cold
          path: .

      - name: Assert warm == cold
        run: |
          if diff -u rigor-diagnostics-warm.json rigor-diagnostics-cold.json; then
            echo "warm and cold diagnostics are identical"
          else
            echo "Cache-dependent diagnostics detected — warm and cold differ."
            echo "A stale or corrupt cache entry is producing different results."
            exit 1
          fi

  # ── Fan-in: single required-check target for branch protection ───
  # Configure branch protection to require only "CI required" rather
  # than each individual job. New jobs added above are automatically
  # gated without touching protection rules.
  required:
    name: CI required
    needs: [test, rbs-compat, lint, self-check, self-check-diff]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RBS_COMPAT_RESULT: ${{ needs.rbs-compat.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SELF_CHECK_RESULT: ${{ needs.self-check.result }}
          SELF_CHECK_DIFF_RESULT: ${{ needs.self-check-diff.result }}
        run: |
          failed=0
          for job_result in "$TEST_RESULT" "$RBS_COMPAT_RESULT" "$LINT_RESULT" "$SELF_CHECK_RESULT" "$SELF_CHECK_DIFF_RESULT"; do
            if [[ "$job_result" != "success" ]]; then
              echo "A required job did not succeed (result: $job_result)"
              failed=1
            fi
          done
          exit $failed

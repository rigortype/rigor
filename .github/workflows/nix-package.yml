name: Nix package

# Build the packaged `rigor` — ADR-27's Nix channel (`packages.default` in
# `flake.nix`, assembled from `nix/Gemfile.lock` + `nix/gemset.nix`).
#
# Why a job of its own: nothing else builds this derivation. `ci.yml` installs
# Ruby with `ruby/setup-ruby` and resolves its own bundle, so a `gemset.nix`
# that still carries the version `spec/docs/nix_lockfile_sync_spec.rb` checks
# but a stale `sha256` passes the whole suite and only fails for a user running
# `nix profile install`. `nix build` fetches each gem by its pinned hash, so it
# is the check that actually holds those hashes, and it holds `flake.nix`'s
# evaluation on Linux (the development host is macOS) at the same time.
#
# Path-filtered: the cold build compiles Ruby 4.0 from source, so it is far too
# slow to run on every PR. It is deliberately NOT a required check — a
# path-filtered workflow never reports on a PR that does not touch these paths,
# and a required check that never reports hangs the merge — so it is signal for
# the PRs that change the package, not a gate. Widen the paths if the package
# gains a dependency the flake reads.

on:
  pull_request:
    paths:
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-package.yml"
  push:
    branches:
      - master
    paths:
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-package.yml"

permissions:
  contents: read

# Cancel a superseded run on the same ref, as `ci.yml` does.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the packaged rigor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Reuse the store across runs; keyed on the lockfiles so a resolution
      # change rebuilds and a source-only change does not.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/Gemfile.lock', 'nix/gemset.nix') }}

      - name: Build the package
        run: nix build .#rigor --print-out-paths

      - name: Run the built binary
        run: ./result/bin/rigor --version

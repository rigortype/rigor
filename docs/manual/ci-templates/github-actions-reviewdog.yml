# Rigor — GitHub Actions workflow (reviewdog → PR review comments).
#
# Copy to .github/workflows/rigor.yml. Runs Rigor on Ruby 4.0 and pipes its
# Checkstyle output through reviewdog, which posts each finding as an inline
# PR review comment. reviewdog also reads `--format sarif` (`-f=sarif`) if
# you prefer. See docs/manual/11-ci.md and ADR-51.
name: rigor
on: [pull_request]

permissions:
  contents: read
  pull-requests: write   # required for the github-pr-review reporter

jobs:
  rigor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rigor needs Ruby 4.0; this is why it runs in its own job (a second
      # setup-ruby would clobber your test job's Ruby). See ADR-27 / ch.11.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # Installed standalone, never in your project's Gemfile (ADR-27).
      - run: gem install rigortype

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # -fail-level=error makes the step (and job) fail when Rigor reports an
      # error; reviewdog still posts warnings/info as review comments.
      - run: rigor check --format checkstyle | reviewdog -f=checkstyle -reporter=github-pr-review -fail-level=error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Effect labels (opt-in until v0.4.0, then the default): if the project
      # has an `effects:` block and a committed .rigor-effects.yml, uncomment
      # this to fail the build when a branch changes what the code *does*.
      # Left commented because `effects check` exits 1 when the snapshot file
      # is absent — which is the point on a project that has one, and noise on
      # one that does not. See docs/manual/19-effect-labels.md § In CI.
      # - run: rigor effects check

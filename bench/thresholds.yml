# Tolerance band for `make bench-perf` (ADR-50 WD4 perf-regression gate).
#
# This file is the committed, reviewed knob — the band is deliberately NOT
# hard-coded in tool/bench.rb so it can be tuned to runner / corpus
# reality as it shifts (changing it is a reviewed commit, like a baseline
# refresh). Each value is the percent regression over the committed
# baseline that fails the gate.
#
# Rationale (ADR-50 WD4): wall is widest (runner noise), allocations is
# tightest (the deterministic signal), RSS sits between (Linux CI only).
#
# wall_pct is deliberately loose: the baseline is a single cold in-process
# run and shared GitHub runners spike wall time by well over 10% under
# contention (a +16.3% false fail on the v0.2.2 gate prompted the widen).
# The real regression teeth are the deterministic allocations / RSS bands,
# so wall stays only a coarse backstop rather than a flaky gate.
#
# allocations_pct is the engine-cost budget of one release cycle. Since
# #1507 the gate reads a frozen corpus (the release tag bench/baseline.json
# names), so the band absorbs no corpus growth, and it needs no room for
# noise: on one corpus, allocations repeat to a few hundred objects in ~30M
# (#1469 saw at most 802, under 0.003%), and macOS reproduces the Linux CI
# number to about 0.2%. 2% is two per-PR warning bands (pr_allocations_pct
# below), and about what v0.4.0's long tail of small merges added by itself
# (140 steps under 20K objects each, +0.98% together). v0.4.0's +19.1%
# would have failed it, and so would two unanswered per-PR warnings. It was
# 5% while the gate read Rigor's own growing `lib`.
wall_pct: 20
allocations_pct: 2
rss_pct: 10

# How far BELOW the baseline allocations may fall before the run prints a
# staleness notice. Not a failure — an improvement is not a regression — but
# an unrefreshed baseline silently widens the real ceiling, because the band
# is a percentage of the baseline rather than of the current cost. A 27% drop
# once left the +5% band permitting +44% over the real number, with nothing
# saying so. Allocations only; wall and RSS drift with runner noise and would
# make this fire spuriously.
#
# 1% on the frozen corpus: an improvement as large as a step the per-PR job
# warns about asks for a refresh, and at a few hundred objects run to run the
# notice cannot fire on noise. Together with the band, an unrefreshed
# improvement leaves at most about 3% over the real cost. It was 15% while
# the corpus grew.
stale_pct: 1

# The per-PR engine A/B (`tool/engine_alloc_ab.rb`, the advisory "Engine allocations" CI job, #1507): how far
# the PR's engine may allocate over the base's engine, both reading the base's `lib`, before the job warns. It
# never fails the build. Like the release gate it compares engines on ONE corpus, so corpus growth drops out and
# a band this tight is meaningful: allocations repeat to a few hundred objects, and each of the largest steps in
# v0.4.0's +19.1% engine cost (#1469: #1135, #1096, #1166) was above 1%. The release gate saw none of them: it
# runs only at a cut, and until #1507 it read a `lib` that grew with every PR.
pr_allocations_pct: 1

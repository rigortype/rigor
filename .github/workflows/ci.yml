name: CI

on:
  push:
    branches: [master]
    # A Markdown-only push (ADRs, notes, CHANGELOG, READMEs, skills) does
    # not change analysable code, so skip the full suite for it. Mixed
    # commits still run — paths-ignore only skips when EVERY changed file
    # matches. Applied to `push` only: `pull_request` stays unfiltered at
    # the trigger level, because a paths-filtered required check hangs
    # pending and blocks the merge. The equivalent PR-side skip is done
    # downstream by the `changes` job, which gates the code jobs on whether
    # any non-Markdown file changed while the "CI required" fan-in still
    # always reports.
    paths-ignore:
      - "**/*.md"
  pull_request:
  # The merge queue on master (ADR-123) runs this workflow on each queued
  # PR merged onto master and the entries ahead of it, and merges only when
  # "CI required" passes there. That run is the check of what will land;
  # the pull_request run before it is the check the review reads.
  merge_group:

# A release or feature branch is validated through its pull request (the
# `pull_request` event), so release/** is deliberately NOT listed under
# `push`: listing it there double-ran every release PR (push +
# pull_request). master still runs on push for the post-merge
# commit-level status.
#
# Cancel an in-progress run on the same ref when a new commit arrives,
# except for master and release-branch PRs, which run to completion (a
# release PR is a publish candidate — its base gate must not be
# cancelled mid-run; matched via head_ref now that release/** no longer
# triggers a push run). Other PR heads cancel the stale run.
concurrency:
  # Master push runs get a per-commit group (#2140) so every merge commit keeps its own
  # completed run; every other ref, merge_group included, keeps the ref-keyed group.
  # master runs are no longer serialized: a burst of merges starts that many runs in parallel
  # (the maintainer's chosen trade-off, #2140).
  group: ${{ github.ref == 'refs/heads/master' && format('{0}-{1}-{2}', github.workflow, github.ref, github.sha) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.head_ref, 'release/') }}

permissions:
  contents: read

jobs:
  # ── 0. Change detection — skip the code suite for md-only PRs ────
  # A pull request that touches only *.md gains nothing from the RSpec
  # suite, self-check, lint, or the RBS matrix — the same reasoning that
  # lets a Markdown-only *push* skip the whole workflow (paths-ignore
  # above). But `pull_request` cannot use paths-ignore: a paths-filtered
  # required check hangs pending and blocks the merge. So this job always
  # runs, and the code jobs gate on its `code` output. Non-PR events
  # (master push) always run the suite. On any detection error we fail
  # safe to `code=true` — never skip on doubt (false-positive discipline:
  # a skipped suite that should have run is worse than a redundant run).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    # attestations: read lets a merge_group run find the attestation of the
    # tree it is about to test (the reuse block below).
    permissions:
      contents: read
      attestations: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      nix: ${{ steps.detect.outputs.nix }}
      reused: ${{ steps.detect.outputs.reused }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      # The tree every job of this run checks out (GITHUB_SHA: on a
      # pull_request, the merge with the base as it stood when the event
      # fired). The tested-tree job below attests it.
      - name: Record the tested tree
        id: tree
        run: echo "tree=$(git rev-parse --verify -q "$GITHUB_SHA^{tree}" || true)" >> "$GITHUB_OUTPUT"

      - name: Detect non-Markdown changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # `nix` gates the Nix package build below: the paths whose change
          # can move the package's gem resolution or its derivation, plus
          # this file, which holds the job, and `lib/rigor/version.rb`,
          # which `flake.nix` reads when it evaluates. Kept separate from
          # `code` because the build is unrelated to most PRs and compiles
          # Ruby cold, so it should not run on every code PR.
          nix_inputs='^(nix/|flake\.nix$|flake\.lock$|\.github/workflows/ci\.yml$|lib/rigor/version\.rb$)'
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "Non-PR event — running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "nix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release ships only ratified decisions (ADR-123): a change to
          # the version, which only release prep makes, fails while
          # approval-queue.d/ holds any entry. This runs in the merge queue
          # too, where the release PR meets entries that landed after its
          # own pull_request run. A diff that errors counts as a change.
          if ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- lib/rigor/version.rb; then
            pending=$(find approval-queue.d -type f ! -name README.md 2>/dev/null || true)
            if [ -n "$pending" ]; then
              echo "::error::The version may change while the approval queue holds entries; ratify, revise or revert them first (rigor-release-prep):"
              printf '%s\n' "$pending"
              exit 1
            fi
          fi
          # Maintainer decision (2026-10-19): a queue entry whose merged tree
          # a pull_request run already passed "CI required" on would rerun the
          # same check on the same files. Such a run signs an artifact
          # attestation of the tree it tested (the tested-tree job below), so
          # the queue reuses the result when one exists for this group's tree,
          # and skips the suite. Anything else runs in full: never skip on doubt.
          #
          # A check run proves nothing here: any workflow of the repository can
          # write one, and a pull_request run into another branch executes that
          # branch's workflow (#2154). The attestation's certificate is issued by
          # GitHub, and names the commit whose workflow file ran (workflow_sha).
          # Reuse only when that commit's tree IS this group's tree: the ci.yml
          # that signed is then the ci.yml that lands, which attests only a
          # pull_request run into master that passed "CI required".
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            group_tree=$(git rev-parse --verify -q "$HEAD_SHA^{tree}" || true)
            signers=""
            if [ -n "$group_tree" ]; then
              printf '%s' "$group_tree" > "$RUNNER_TEMP/tested-tree"
              # Commits whose own ci.yml, run for a pull_request, signed an
              # attestation of this tree.
              signers=$(gh attestation verify "$RUNNER_TEMP/tested-tree" --repo "$REPO" \
                  --signer-workflow "$REPO/.github/workflows/ci.yml" --deny-self-hosted-runners \
                  --limit 100 --format json 2>/dev/null \
                | jq -r --arg cfg "https://github.com/$REPO/.github/workflows/ci.yml@refs/pull/" '
                    .[].verificationResult.signature.certificate
                    | select(.buildTrigger == "pull_request"
                        and (.buildConfigURI | startswith($cfg))
                        and .buildSignerURI == .buildConfigURI
                        and .buildConfigDigest == .sourceRepositoryDigest
                        and .buildSignerDigest == .sourceRepositoryDigest)
                    | .sourceRepositoryDigest' \
                | grep -E '^[0-9a-f]{40}$' | sort -u) || signers=""
            fi
            for sha in $signers; do
              signer_tree=$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha 2>/dev/null || true)
              if [ -n "$signer_tree" ] && [ "$signer_tree" = "$group_tree" ]; then
                echo "Commit $sha passed CI required on this very tree ($group_tree) and its ci.yml attested it: reusing it."
                {
                  echo "reused=true"
                  echo "code=false"
                  echo "nix=false"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            echo "No attestation of group tree '${group_tree:-?}' signed by a pull_request run of that tree's own ci.yml (signers: '$(tr '\n' ' ' <<<"$signers")'): running the suite."
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "diff failed — failing safe to the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "nix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$changed"
          non_md=$(printf '%s\n' "$changed" | grep -vE '\.md$' || true)
          if [ -n "$non_md" ]; then
            echo "Non-Markdown files changed — running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Markdown-only PR — skipping the code suite."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE "$nix_inputs" <<<"$changed"; then
            echo "Nix package inputs changed — building the package."
            echo "nix=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Nix package input changed — skipping the package build."
            echo "nix=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 0a. The timing file every shard partitions ──────────────────
  # Shards agree on which tests are theirs only while they cut the SAME
  # timing file (see the test job's cache step). Each shard used to
  # prefix-match the newest cache on its own, and three jobs that do not
  # start together can see different "newest" caches: in run 35974654728
  # the third shard started 37s after its siblings and restored the cache
  # a concurrent master run had saved in between. So the newest key is
  # resolved ONCE, here, and every shard restores exactly that key.
  #
  # It also keeps "Re-run failed jobs" on one file: this job succeeded,
  # so a partial rerun reuses its output and the re-run shard restores
  # the file its siblings cut. Were that output ever lost, the shard
  # would restore nothing and shard-coverage refuses the mismatch.
  #
  # Pinned to the test matrix's one Ruby; a second one needs its own key.
  timing-cache:
    name: Resolve the shards' timing cache
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.lookup.outputs.cache-matched-key }}
    steps:
      - name: Find the newest timing cache
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: tmp/binpacker.timings
          # Never saved, so only the restore-keys prefix can match.
          key: binpacker-timings-v2-${{ runner.os }}-ruby4.0-lookup
          restore-keys: binpacker-timings-v2-${{ runner.os }}-ruby4.0-
          lookup-only: true

  # ── 1. RSpec suite (via binpacker) ──────────────────────────────
  # The suite is the workflow's critical path, and a runner's core count is
  # the ceiling on what workers alone can do with it — every other job here
  # finishes inside 2m30s. So the run is also split across MACHINES: each
  # shard analyses its own slice with its own workers, and the job's wall
  # time becomes the slowest shard rather than the whole suite.
  #
  # Three shards, because a spec FILE is binpacker's scheduling unit and
  # cannot be split: a shard can never finish faster than the heaviest file
  # it holds. Measured at 438 files (run 34269150881), the suite is ~1604s
  # of predicted work, so the twelve workers of a 3x4 matrix have a floor
  # of ~134s each — which shards 2 and 3 hit exactly, LPT partitioning all
  # three slices to 534.6s of weight apiece. Shard 1 cannot reach it:
  # `runner_spec.rb` alone weighs ~167s, so it occupies a whole worker and
  # becomes the job's makespan on its own. A fourth shard would buy nothing
  # but another job's setup, and neither would a better partition. Past
  # this floor the only lever is a cheaper `runner_spec.rb`.
  test:
    name: Tests (Ruby ${{ matrix.ruby }}, shard ${{ matrix.shard }}/3)
    needs: [changes, timing-cache]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "4.0"
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Cache the binpacker timing file between runs so that LPT
      # scheduling can use measured per-file runtimes to balance
      # workers. On a cache miss binpacker falls back to filesize
      # weighting automatically — no cold-start breakage. The file is
      # written at the end of each successful run and saved for the next.
      #
      # Every shard restores the ONE key the timing-cache job resolved,
      # never a prefix match of its own, so all three cut the same
      # partition. That is not a nicety — shards agree on which tests are
      # theirs only while they agree on the timings, and the
      # shard-coverage job below is what catches it when they do not. A
      # cold start (nothing resolved) skips the restore in every shard.
      #
      # The SAVE key carries the shard index because parallel jobs cannot
      # all save one key — the first wins and the rest warn — and the
      # attempt so that a rerun saves fresh data instead of colliding
      # with the key its earlier attempt already wrote.
      #
      # A shard's saved file stays complete rather than shrinking to its
      # own slice: binpacker APPENDS samples and compacts to the three most
      # recent per test, so a shard's write leaves its siblings' entries
      # untouched.
      #
      # `v2` is a manual generation token, bumped to discard the history.
      # binpacker weighs a file by summing the median of every `[file, name]`
      # entry it holds, and `compact!` prunes samples per test but never the
      # tests themselves — so an entry for a test that no longer exists under
      # that path is charged to the file forever. Splitting a spec file is
      # exactly that: `runner_spec.rb` kept the 225 example entries that moved
      # to `runner_check_rules_spec.rb` and stayed predicted at 163.9s while
      # running 88.7s, and the new file, having no history, fell back to
      # filesize at 0.3s against 66.5s actual (run 34274577832 — shard 1
      # deviation 43.6%). Bump this token whenever a spec file is split,
      # renamed, or deleted; one run then re-measures from filesize weighting.
      - name: Restore binpacker timing file
        if: needs.timing-cache.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: tmp/binpacker.timings
          key: ${{ needs.timing-cache.outputs.key }}
          fail-on-cache-miss: true

      # Which timing file this shard is about to partition, recorded
      # BEFORE the run: binpacker rewrites the file when it finishes.
      # shard-coverage requires every shard's digest to agree — the
      # backstop for the restore above, since one timing file is what
      # makes the shards' cuts one partition. Written ahead of the tests,
      # too, so a shard that ran always has a record to upload.
      - name: Record shard provenance
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TIMINGS_KEY: ${{ needs.timing-cache.outputs.key }}
        run: |
          mkdir -p tmp
          if [[ -f tmp/binpacker.timings ]]; then
            digest=$(sha256sum tmp/binpacker.timings | cut -d' ' -f1)
          else
            digest=absent
          fi
          jq -n --argjson shard "$SHARD" --argjson attempt "$RUN_ATTEMPT" \
            --arg digest "$digest" --arg key "$TIMINGS_KEY" \
            '{shard: $shard, run_attempt: $attempt, timings_sha256: $digest, timings_key: $key}' \
            | tee "tmp/binpacker-provenance-$SHARD.json"

      - name: Run tests
        run: >-
          make test-binpacker
          BINPACKER_FLAGS="--shard ${{ matrix.shard }}/3 --report tmp/binpacker-report-${{ matrix.shard }}.json"

      # Not on a merge-queue ref (#2139): the queue's throwaway ref is read by no other run, and its entry counts
      # against the 10 GB cache budget. The restore above still reads master's timings.
      - name: Save binpacker timing file
        if: success() && github.event_name != 'merge_group'
        uses: actions/cache/save@v6
        with:
          path: tmp/binpacker.timings
          key: binpacker-timings-v2-${{ runner.os }}-ruby${{ matrix.ruby }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}

      # Consumed by the shard-coverage job, which is the only place a
      # partition that dropped tests can be detected. The name carries
      # the attempt: a "Re-run failed jobs" attempt keeps the passed
      # shards' artifacts from the earlier attempt, and under one shared
      # name download-artifact resolved the re-run shard's duplicate to
      # the STALE report (run 35844873791), so the check never saw the
      # attempt that ran. (The stale one won because download-artifact
      # keeps the highest artifact ID per name, and IDs do not follow
      # creation order — so `latest` is no fix either.)
      - name: Upload shard run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: binpacker-report-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            tmp/binpacker-report-${{ matrix.shard }}.json
            tmp/binpacker-provenance-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # ── 1a. Specs binpacker deliberately excludes ───────────────────
  # `binpacker.yml`'s `test_exclude` keeps two things out of the sharded
  # suite because they modify global state and must own their rspec
  # process: `runner_pool_spec.rb` (also gated behind
  # RIGOR_INCLUDE_RACTOR_POOL, see spec/spec_helper.rb) and
  # `spec/integration/plugins/` (rigor-ffi re-opens Rigor::Plugin::Base,
  # which flakes `public_api_drift_spec.rb`). Without a job they have no
  # CI coverage at all — a deterministic failure in the pool spec once
  # rotted unnoticed for three weeks (fork-backend default 86ed9129 →
  # fixed 7ebeac08).
  #
  # Their own job rather than a step pinned to `matrix.shard == 1`, which
  # is where they used to live: that pinned 18s + 127s onto the shard
  # already carrying the suite's heaviest file, so shard 1's job ran 339s
  # against shard 3's 117s. As a peer job the 145s runs concurrently and
  # leaves the matrix's wall time to the matrix (run 34269150881).
  excluded-specs:
    name: Excluded specs (pool runner + plugin integration)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run pool-runner spec
        run: make test-ractor-pool

      - name: Run plugin integration tests
        run: make test-integration-plugins

  # ── 1b. Shard coverage ──────────────────────────────────────────
  # Sharding's one silent failure: shards never coordinate, so each trusts
  # the others to have cut the identical partition from the identical
  # timing data. A shard that restored a different timing file partitions
  # differently, some tests land in NO shard, and every job still reports
  # success — a shard cannot tell "not mine" from "does not exist".
  #
  # `binpacker shards-check` is the fan-in that can: it reads each shard's
  # run report and fails unless they describe one coherent split of one
  # suite — same shard count, same whole-suite discovered count, every
  # index present exactly once, and the slices summing to the whole.
  #
  # A partial rerun ("Re-run failed jobs") re-runs one shard while the
  # passed shards' reports stay from the earlier attempt.
  # `tool/shard_report_select.rb` stands in front of shards-check: it
  # takes each shard's report from the newest attempt that ran it, and
  # fails unless every chosen shard partitioned the same timing file (the
  # digest each shard records before its run). Matching counts alone
  # cannot vouch for two different cuts. The timing-cache job makes the
  # digests agree by construction, so a mismatch means that failed — a
  # cache evicted mid-run, or a rerun that lost the resolved key; re-run
  # ALL jobs. Re-running only this job, with the matrix green, re-checks
  # the same reports; the artifacts expire after a day.
  #
  # Runs whenever the matrix was not outright cancelled, so a mismatch
  # still surfaces when one shard failed.
  shard-coverage:
    name: Shard coverage (every test ran)
    needs: [changes, test]
    runs-on: ubuntu-latest
    if: always() && needs.changes.outputs.code == 'true' && needs.test.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # Deliberately not `merge-multiple`: merged, every attempt's
      # `binpacker-report-<shard>.json` lands on one path and only one
      # attempt survives. Unmerged, each artifact gets its own directory
      # (or `reports/` itself when only one matched).
      - name: Download shard run reports
        uses: actions/download-artifact@v8
        with:
          pattern: binpacker-report-*
          path: reports

      - name: Select each shard's newest report and require one timing file
        run: bundle exec ruby tool/shard_report_select.rb reports selected

      - name: Assert the shards covered the whole suite
        run: bundle exec binpacker shards-check selected/binpacker-report-*.json

  # ── 2. RBS compatibility (3.x + 4.x) ────────────────────────────
  rbs-compat:
    name: RBS compatibility (RBS ${{ matrix.rbs }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rbs: "3.x"
            constraint: "~> 3.10"
            expected_major: "3"
          - rbs: "4.x"
            constraint: "~> 4.0"
            expected_major: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # The public gemspec supports `rbs >= 3.0, < 5.0`, but RBS 3.x and
      # 4.x diverge on the env-population API (`add_signature` /
      # `MultiEntry::D` wrappers vs `add_source` / `RBS::Source` + bare
      # decls) — a divergence that crashed `rigor check` under RBS 3.x.
      # This job exercises both lines against the RBS-loading surface so
      # that range stays honest.
      #
      # The normal development bundle cannot take an `rbs` matrix axis:
      # it includes rbs-inline, whose upstream gem pins `rbs (~> 4.0)`.
      # So this focused compatibility bundle installs Rigor as a path gem
      # — only runtime dependencies, rspec, and the requested RBS line
      # are resolved, with no rbs-inline to constrain it — and never
      # rewrites the repo's Gemfile.lock.
      - name: Install RBS compatibility bundle
        env:
          RBS_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          cat > Gemfile.rbs-compat <<GEMFILE
          source "https://rubygems.org"
          ruby ">= 4.0.0", "< 4.1"
          gem "rigortype", path: "."
          gem "rspec", ">= 3.13", "< 4.0"
          gem "rbs", "$RBS_CONSTRAINT"
          GEMFILE
          BUNDLE_GEMFILE=Gemfile.rbs-compat bundle install --jobs 4 --retry 3

      - name: Assert selected RBS version
        env:
          EXPECTED_RBS_MAJOR: ${{ matrix.expected_major }}
        run: |
          BUNDLE_GEMFILE=Gemfile.rbs-compat bundle exec ruby -e '
            require "rbs"
            expected = ENV.fetch("EXPECTED_RBS_MAJOR")
            abort "expected RBS #{expected}.x, got #{RBS::VERSION}" unless RBS::VERSION.start_with?("#{expected}.")
            puts "RBS #{RBS::VERSION}"
          '

      - name: Run RBS environment compatibility specs
        run: BUNDLE_GEMFILE=Gemfile.rbs-compat bundle exec rspec spec/rigor/environment

  # ── 3. RuboCop ───────────────────────────────────────────────────
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # RuboCop stores its result cache under ~/.cache/rubocop_cache
      # on Linux. Cache it keyed on the cop config + lock so a pure
      # gem-version or source change that does not touch linting rules
      # reuses the warm cache and skips re-inspecting unchanged files.
      - name: Restore RuboCop cache
        id: restore-rubocop
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/rubocop_cache
          key: rubocop-${{ runner.os }}-${{ hashFiles('.rubocop.yml', '.rubocop_todo.yml', 'Gemfile.lock') }}
          restore-keys: rubocop-${{ runner.os }}-

      - name: Run lint
        run: make lint

      # Saved after a passing lint run, as a combined cache's post-step would, and never on a merge-queue ref
      # (#2139). An exact key hit has nothing new to save.
      - name: Save RuboCop cache
        if: success() && github.event_name != 'merge_group' && steps.restore-rubocop.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/rubocop_cache
          key: ${{ steps.restore-rubocop.outputs.cache-primary-key }}

  # ── 3a. Docs check for a Markdown-only PR ───────────────────────
  # The `changes` gate above skips every code job for a Markdown-only PR —
  # including the spec suite, which is where `spec/docs/` (link integrity,
  # agent-index and ADR budgets, changelog fragments, handbook snippets)
  # normally runs. Without this job such a PR reported "CI required" green
  # having checked nothing. It runs exactly when the suite does not, so a
  # code PR does not pay for `spec/docs/` twice. `make docs-check` is
  # seconds; the Ruby setup is most of the job.
  docs-check:
    name: Docs check
    needs: changes
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run docs check
        run: make docs-check

  # ── 4. Rigor self-check (warm + cold) ───────────────────────────
  # Two matrix variants run in parallel:
  #   warm — restores .rigor/cache from the previous run so Rigor
  #           exercises the cache read/write path and skips slices
  #           for unchanged (path, sha, config) tuples (ADR-6).
  #   cold — starts with an empty cache directory every time so the
  #           full analysis path is exercised without any cached
  #           state; catches regressions that only surface on a
  #           first-run / cache-miss code path.
  # Both must pass for the required fan-in job to succeed.
  self-check:
    name: Self-check (${{ matrix.cache }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: [warm, cold]
    # Cache validation runs in digest mode here without any env: the
    # `cache.validation: auto` default (#190) detects CI and switches from the
    # stat tier (which a fresh checkout defeats — every tuple regenerates) to
    # content hashes, deterministic across checkouts. This job dogfoods that
    # auto-detection; a regression shows up as the warm restore recomputing
    # slots it should serve.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # ADR-6: the analysis cache grows monotonically and is
      # content-addressed; restoring a warm cache from a prior run
      # skips recomputing slices for unchanged (path, sha, config)
      # tuples.  The key encodes every input that could change the
      # analysis result; a partial match restores the closest ancestor
      # cache and Rigor fills any missing slices on the fly.
      # Skipped entirely for the cold variant — no restore, no save.
      #
      # The restore-keys are scoped to the current Gemfile.lock hash so
      # that a lockfile change (e.g. adding a gem) never restores a cache
      # built under the old lockfile.  This was once load-bearing: it was
      # compensating for a run-result cache key that did not encode the
      # lockfile it depended on, so a stale-lockfile restore made the
      # gem-without-rbs count diverge between warm and cold and failed the
      # warm==cold diff gate on a correct analysis (#564).  The engine now
      # keys on the lockfile's contents itself, so the scoping is kept as
      # cache hygiene — it stops the store filling with entries whose keys
      # can no longer hit — rather than for correctness.
      - name: Restore Rigor analysis cache
        id: restore-cache
        if: matrix.cache == 'warm'
        uses: actions/cache/restore@v6
        with:
          path: .rigor/cache
          key: rigor-cache-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-${{ hashFiles('lib/**/*.rb', 'sig/**/*.rbs', 'data/builtins/**/*.yml') }}
          restore-keys: rigor-cache-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}-

      # Issue #427 — put the warm arm in the ONE state that exercises what this gate exists to catch,
      # instead of leaving it to whatever the restore happened to produce.
      #
      # The hazard is the rbs `TypeName#hash` memoisation riding into the Marshal'd `rbs.environment`
      # blob and coming back wrong in a fresh process.  Catching it needs a cross-process restore of
      # that blob AND a real analysis against it.  The arm failed to meet that on two counts:
      #
      #   1. A lockfile change leaves nothing restorable — both keys are scoped to the Gemfile.lock
      #      hash (deliberately; see the note above), so a gem bump starts the arm empty and the diff
      #      compares two cold runs.  Observed green against nothing on #412.
      #   2. Even a FULLY warm arm never loads the environment: measured, with the whole-run
      #      `analysis.run-diagnostics` slot populated, `rigor check` is served straight from it and
      #      `rbs.environment` is consulted zero times.  No analysis, so no hazard on show.
      #
      # So: prime when nothing exact was restored, then drop the whole-run slot.  What remains is the
      # RBS slices, restored across a process boundary, with a real analysis on top — which is the
      # comparison the job's name claims.  `cache-hit` is 'true' only on an exact key match, so a
      # restore-key (prefix) match still primes, where priming is itself warm and costs a second.
      - name: Prime the analysis cache when the restore missed
        if: matrix.cache == 'warm' && steps.restore-cache.outputs.cache-hit != 'true'
        run: bundle exec exe/rigor check lib > /dev/null || true

      - name: Drop the whole-run slot so the warm arm actually analyses
        if: matrix.cache == 'warm'
        run: rm -rf .rigor/cache/analysis.run-diagnostics

      # Run once with --format json so we get both structured output for
      # the warm-vs-cold diff and a human-readable summary in the CI log.
      # continue-on-error keeps the job alive long enough to upload the
      # artifact even when errors are found; we re-raise at the end.
      # `--fail-on=warning` matches `make check` (#812): a warning-severity
      # self-finding must fail CI, not ride along — #1175 rode master for
      # weeks because this run printed the warning but exited 0.
      - name: Run rigor self-check
        id: check
        continue-on-error: true
        run: |
          # `run:` executes under `bash -e`: without the `||` guard a failing
          # check aborts the script before the jq print / artifact write, so
          # the job would go red with no diagnostic output and no artifact.
          rigor_exit=0
          bundle exec exe/rigor check --format json --fail-on=warning lib > rigor-raw.json || rigor_exit=$?
          # Print human-readable diagnostic lines to the CI log.
          jq -r '.diagnostics[] |
            "\(.path):\(.line):\(.column): \(.severity): \(.message)"' \
            rigor-raw.json >&2 || true
          # Normalize for comparison: keep only stable fields, sort
          # deterministically so output order cannot produce a false diff.
          jq '[.diagnostics[] | {path, line, column, severity, rule, message}]
              | sort_by(.path, .line, .column, .rule)' \
            rigor-raw.json > rigor-diagnostics-${{ matrix.cache }}.json || true
          exit $rigor_exit

      # Issue #427 — the anti-vacuity assertion, the shape `make check-mutation-cache` already uses on
      # its own warm arm.  It asserts `rbs.environment` was SERVED this run, which is the difference
      # between "a cache was read" and "the cache that can be wrong was read".  Runs after the
      # self-check; it re-establishes the measured run's cache state itself, because that run writes the
      # whole-run slot back.
      - name: Assert the warm arm was served from cache
        if: matrix.cache == 'warm'
        run: bundle exec ruby tool/warm_cache_assertion.rb lib

      # Upload even when the check found errors so the diff job always
      # has both artifacts to compare.
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rigor-diagnostics-${{ matrix.cache }}
          path: rigor-diagnostics-${{ matrix.cache }}.json
          retention-days: 1

      - name: Fail if self-check found errors
        if: steps.check.outcome == 'failure'
        run: |
          echo "rigor self-check found errors — see diagnostic output above"
          exit 1

      # The save a combined cache's post-step would do: only after a passing job, only when the restore was not an
      # exact hit, and never on a merge-queue ref, whose entry no other run can read (#2139).
      - name: Save the Rigor analysis cache
        if: matrix.cache == 'warm' && success() && github.event_name != 'merge_group' && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .rigor/cache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

  # ── 4b. Acceptance gates over a cold analysis ───────────────────
  # Four gates that each need a full, uncached analysis and are otherwise
  # unrelated to one another. They used to be steps on the self-check matrix
  # guarded by `if: matrix.cache == 'cold'`, on the stated grounds that their
  # results are deterministic and need no warm/cold cross-check — which is
  # precisely why they do not belong to that matrix. Parked there they made a
  # job named "Self-check (cold)" spend 17% of itself on the self-check and
  # 83% on this, serialised: 27s of check against 23s + 12s + 74s + 22s of
  # gates, for a 164-196s job while its warm sibling finished in 44s.
  #
  # As their own job the four still run once, still against a fresh checkout
  # with no `.rigor/cache` to restore from (which is all "cold" ever meant
  # here), and no longer sit behind the self-check. One job rather than four
  # because ~137s already clears the Tests matrix's ~180s floor; split it
  # further only if that floor moves.
  acceptance-gates:
    name: Acceptance gates (cold analysis)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # Precision gate: `rigor coverage --threshold 0.58 lib` fails when the
      # type-inference precision ratio on Rigor's own source drops below 58 %.
      # See the Makefile's `coverage` target for how that number is calibrated.
      - name: Run precision coverage gate
        run: make coverage

      # Plugin-contract gate (ADR-43): the bundled plugin / example LIB
      # trees must stay clean under `rigor check`. ADR-43 ancestor
      # resolution makes a plugin's inherited contract calls
      # (`manifest.…`, `io_boundary.…`) resolve against `Plugin::Base`'s
      # RBS, so misuse of the contract surface surfaces here as
      # `call.undefined-method`.
      - name: Run plugin-contract check
        run: make check-plugins

      # Incremental-analysis acceptance gate (ADR-46): the incremental
      # analyzer must produce diagnostics byte-identical to a full run.
      # `--verify-incremental` re-analyzes a subset and serves the rest
      # from the per-file cache, then asserts the merge equals a full
      # `--no-cache` analysis — a mismatch would mean a stale, manufactured
      # diagnostic. The longest of the four at ~74s: it runs roughly three
      # analyses per target, over two targets.
      - name: Run incremental-analysis gate
        run: make check-incremental

      # Mutation-cache acceptance gate (#134 slice 3): the per-file
      # mutation-result cache must serve a measurement byte-identical to
      # the cold one. ADR-46 made that obligation mandatory for the
      # incremental check path and a cached per-file MEASUREMENT inherits
      # it — the number the cache serves is the number `--threshold` gates
      # a build on. The gate also asserts the warm arm really was served
      # from cache, so it cannot pass vacuously the day the cache disables
      # itself. It warms its own snapshot.
      - name: Run mutation-cache gate
        run: make check-mutation-cache

  # ── 5. Warm-vs-cold diagnostic diff ─────────────────────────────
  # The two self-check variants must agree on every diagnostic.  Any
  # difference means the cache is altering analysis results — a bug.
  # Runs whenever self-check was not outright cancelled (so the diff
  # still executes when one variant failed, surfacing a discrepancy).
  self-check-diff:
    name: Self-check diff (warm == cold)
    needs: [changes, self-check]
    runs-on: ubuntu-latest
    # Skip on a Markdown-only PR (self-check was skipped, so there are no
    # artifacts to diff). Otherwise run whenever self-check was not
    # outright cancelled, so a discrepancy still surfaces when one variant
    # failed.
    if: always() && needs.changes.outputs.code == 'true' && needs.self-check.result != 'cancelled'
    steps:
      - name: Download warm diagnostics
        uses: actions/download-artifact@v8
        with:
          name: rigor-diagnostics-warm
          path: .

      - name: Download cold diagnostics
        uses: actions/download-artifact@v8
        with:
          name: rigor-diagnostics-cold
          path: .

      - name: Assert warm == cold
        run: |
          if diff -u rigor-diagnostics-warm.json rigor-diagnostics-cold.json; then
            echo "warm and cold diagnostics are identical"
          else
            echo "Cache-dependent diagnostics detected — warm and cold differ."
            echo "A stale or corrupt cache entry is producing different results."
            exit 1
          fi

  # ── 6. Self-check under the bleeding-edge overlay ───────────────
  # ADR-50 § WD2's "Rigor's own CI exercises the overlay" made real: `rigor
  # check` under the WHOLE queued overlay (`--bleeding-edge` = adopt all)
  # must stay clean on Rigor's own lib, because WD7 graduation flips a
  # queued discipline default-on at a major, and lib drifting out of
  # compliance with a queued discipline would otherwise surface only on
  # graduation day.
  #
  # This exercises severity features only: a behaviour feature changes what
  # a separate command measures, not what `check` analyses, and its on/off
  # correctness is spec'd in the suite (byte-identity with the feature
  # off), not exercised here.
  #
  # Runs cold on purpose — deterministic, no cache interplay: no cache
  # restore and no JSON artifact, since the exit code is the whole
  # assertion.
  self-check-bleeding-edge:
    name: Self-check (bleeding-edge)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run rigor self-check under the bleeding-edge overlay
        run: bundle exec exe/rigor check --bleeding-edge --fail-on=warning lib

  # ── Engine allocation A/B (advisory, #1507) ─────────────────────
  # The PR's engine and its merge base's engine each run `rigor check
  # --no-cache lib` over the MERGE BASE's tree, so corpus growth drops
  # out and the delta is the engine's own cost. The release gate's
  # `make bench-perf` measures the same way over the previous release's
  # tree, but only at a cut; this job charges each step to its PR. It warns
  # past `pr_allocations_pct` in bench/thresholds.yml and never fails a
  # PR for a regression, so it is deliberately NOT in the `required`
  # fan-in below. It measures only what `rigor check lib` executes: the
  # tool skips a PR that touches none of `lib/`, `data/` and the
  # default-loaded `plugins/rigor-rbs-inline/`, and exits non-zero only
  # when an engine run itself fails.
  engine-allocations:
    name: Engine allocations (advisory)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Compare the merge base's engine with the PR's
        id: ab
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The merge base, not the base branch's tip: a PR branched from
          # an older master would otherwise be charged with every engine
          # change merged since.
          # The default run shell is `bash -e` without pipefail: keep a failed
          # engine run failing the step through the tee below.
          set -o pipefail
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          bundle exec ruby tool/engine_alloc_ab.rb --base "$merge_base" --head "$HEAD_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" | tee "$RUNNER_TEMP/engine-alloc-ab.txt"
          if grep -q "nothing to measure" "$RUNNER_TEMP/engine-alloc-ab.txt"; then
            echo "measured=false" >> "$GITHUB_OUTPUT"
          else
            echo "measured=true" >> "$GITHUB_OUTPUT"
          fi

      # The per-PR delta above warns only when one PR passes its own band, so a
      # cycle of small rises reaches the release gate unseen: v0.4.5's cut met
      # +3.4% against a +2% band, built from 39 PRs of which one had warned.
      # This runs the release gate's own measurement (tool/bench.rb over the
      # corpus bench/baseline.json names) on this checkout, which is the PR
      # merged onto master, and reports the cumulative allocation drift since
      # the baseline. Advisory: it warns from 1.5% and never fails the job.
      # It is skipped when the A/B found the engine unchanged.
      - name: Compare with the release gate's baseline
        if: steps.ab.outputs.measured == 'true'
        run: |
          set +e
          out=$(bundle exec ruby tool/bench.rb --target lib --reps 1 2>&1)
          set -e
          # bench.rb prints an OK line flush left on stdout and a FAIL line
          # indented on stderr, so the pattern allows leading spaces.
          line=$(printf '%s\n' "$out" | grep -E '^ *(OK|FAIL) +lib allocations:' | head -1 | sed -E 's/^ +//' || true)
          if [ -z "$line" ]; then
            echo "The release gate printed no allocations verdict (an uncalibrated baseline prints none):"
            printf '%s\n' "$out" | tail -20
            exit 0
          fi
          now=$(sed -nE 's/.*allocations: ([0-9]+).*/\1/p' <<<"$line")
          base=$(sed -nE 's/.*baseline ([0-9]+).*/\1/p' <<<"$line")
          pct=$(awk -v n="$now" -v b="$base" 'BEGIN { printf "%+.2f", (n - b) * 100 / b }')
          {
            echo "### Release-gate allocations (advisory)"
            echo
            echo "This PR merged onto master allocates $now against the release baseline's $base: **${pct}%** (the gate fails above +2%)."
            echo
            echo "\`$line\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$line ($pct%)"
          if awk -v p="$pct" 'BEGIN { exit !(p + 0 >= 1.5) }'; then
            echo "::warning title=Release gate allocations::Merged onto master, this PR allocates ${pct}% over the release baseline (the release gate fails above +2%). See the job summary."
          fi

  # ── Cross-commit `call.wrong-arity` differential (ADR-119 WD2) ───
  # The merge base's engine and the PR's each analyse the arity fixtures;
  # a firing the PR removes must be adjudicated in
  # `spec/integration/fixtures/arity_differential/arity_adjudication.yml`
  # (`tool/engine_diag_diff.rb` says how), as must a firing it adds. Gated
  # by the `changes` job's `code` output, like the other engine jobs: what
  # decides a firing is spread over the scope, the discovery tables, the
  # reflection layer and the RBS data, so a narrower filter would miss
  # some of it, and the job costs about ten seconds past the setup. A
  # skipped run is acceptable to `required`.
  arity-differential:
    name: Arity differential
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # In the merge queue the base is the commit the entry is queued onto
      # and the head the queued merge, so this compares what master is
      # about to be with and without the PR.
      - name: Compare the merge base's firings with the PR's
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fixtures=spec/integration/fixtures/arity_differential
          # The floor counts only the survivors, the firings a change must keep.
          bundle exec ruby tool/engine_diag_diff.rb --base "$merge_base" --head "$HEAD_SHA" --corpus "$HEAD_SHA" \
            --target "$fixtures" --target spec/integration/fixtures/declaration_witness \
            --rule call.wrong-arity --adjudication "$fixtures/arity_adjudication.yml" \
            --require-rows-in "$fixtures/survivors/:7" --summary "$GITHUB_STEP_SUMMARY"

  # ── Nix package (ADR-27's Nix channel) ──────────────────────────
  # Build the packaged `rigor` from `flake.nix` + `nix/Gemfile.lock` +
  # `nix/gemset.nix`. Nothing else in CI builds it, so a `gemset.nix`
  # whose version `spec/docs/nix_lockfile_sync_spec.rb` accepts but whose
  # `sha256` went stale passes the suite and only fails for a user
  # running `nix profile install`; `nix build` fetches each gem by its
  # pinned hash, so it is the check that holds them.
  #
  # Gated on the `changes` job's `nix` output rather than a workflow-level
  # path filter: a job that reports `skipped` is accepted by the
  # `required` fan-in, while a filtered workflow never reports at all and
  # would hang a required check. The gate is `nix/`, `flake.nix`,
  # `flake.lock` and this workflow file — the package's gem resolution,
  # its derivation, and the job itself. `lib/`, `exe/`, `data/` and `sig/`
  # are copied into the package too, but the suite covers them and gating
  # on all of `lib/` would run this build on nearly every PR.
  #
  # Cold this compiles Ruby 4.0 from source (5m14s in run 38463001705,
  # 4m43s of it the build); a warm store cache makes a rerun much
  # cheaper. It is gated because it is unrelated to most PRs, not because
  # it is prohibitive. Master pushes run it too, as a post-merge check.
  nix-package:
    name: Nix package
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # Keyed on the derivation's inputs, so a hash or resolution change
      # misses and a stale `sha256` can never be served from the cache.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/Gemfile.lock', 'nix/gemset.nix') }}

      - name: Build the package
        run: nix build .#rigor -L

      # `--version` alone loads no runtime gem, so it proves very little.
      # `check` loads the core RBS from the packaged `rbs`, and `nix run`
      # evaluates `apps.rigor`, the documented `nix run` entry point. Run
      # it from an empty directory so the result reflects the package, not
      # this repository's own sig/ and config. `skill --list` and
      # `docs --list` prove the bundled docs/ and skills/ trees made it
      # into the derivation (#1853). The `.rigor.yml` names
      # `rigor-minitest` and `rigor-sassc`: minitest is loaded by the
      # bundled-plugin loader from its own path, while sassc requires
      # `rigor-ffi` by bare name, so it loads only when the wrapper's
      # RUBYLIB puts every `plugins/*/lib` on the load path. Dropping
      # RUBYLIB fails this step (#1853).
      - name: Smoke-test the packaged binary
        run: |
          ./result/bin/rigor --version
          ./result/bin/rigor skill --list
          ./result/bin/rigor docs --list
          d=$(mktemp -d)
          printf 'x = 1\nputs x\n' > "$d/smoke.rb"
          printf 'plugins:\n  - rigor-minitest\n  - rigor-sassc\n' > "$d/.rigor.yml"
          (cd "$d" && nix run "$GITHUB_WORKSPACE#rigor" -- check --no-cache --fail-on=error smoke.rb)
          (cd "$d" && nix run "$GITHUB_WORKSPACE#rigor" -- plugins | grep -q 'All configured plugins loaded successfully')

  # ── Fan-in: single required-check target for branch protection ───
  # Configure branch protection to require only "CI required" rather
  # than each individual job. New jobs added above are automatically
  # gated without touching protection rules.
  required:
    name: CI required
    needs: [changes, timing-cache, test, shard-coverage, excluded-specs, rbs-compat, lint, docs-check, self-check, self-check-diff, self-check-bleeding-edge, acceptance-gates, arity-differential, nix-package]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TIMING_CACHE_RESULT: ${{ needs.timing-cache.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SHARD_COVERAGE_RESULT: ${{ needs.shard-coverage.result }}
          EXCLUDED_SPECS_RESULT: ${{ needs.excluded-specs.result }}
          RBS_COMPAT_RESULT: ${{ needs.rbs-compat.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DOCS_CHECK_RESULT: ${{ needs.docs-check.result }}
          SELF_CHECK_RESULT: ${{ needs.self-check.result }}
          SELF_CHECK_DIFF_RESULT: ${{ needs.self-check-diff.result }}
          SELF_CHECK_BLEEDING_EDGE_RESULT: ${{ needs.self-check-bleeding-edge.result }}
          ACCEPTANCE_GATES_RESULT: ${{ needs.acceptance-gates.result }}
          ARITY_DIFFERENTIAL_RESULT: ${{ needs.arity-differential.result }}
          NIX_PACKAGE_RESULT: ${{ needs.nix-package.result }}
        run: |
          failed=0
          # Change detection must always succeed — it is what decides
          # whether the gated jobs were legitimately skipped.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed (result: $CHANGES_RESULT)"
            failed=1
          fi
          # A gated job that was skipped (the code jobs on a Markdown-only
          # PR, Docs check on a code PR, Nix package when no package input
          # changed) is acceptable;
          # only an outright failure or cancellation blocks the merge.
          for job_result in "$TIMING_CACHE_RESULT" "$TEST_RESULT" "$SHARD_COVERAGE_RESULT" "$EXCLUDED_SPECS_RESULT" "$RBS_COMPAT_RESULT" "$LINT_RESULT" "$DOCS_CHECK_RESULT" "$SELF_CHECK_RESULT" "$SELF_CHECK_DIFF_RESULT" "$SELF_CHECK_BLEEDING_EDGE_RESULT" "$ACCEPTANCE_GATES_RESULT" "$ARITY_DIFFERENTIAL_RESULT" "$NIX_PACKAGE_RESULT"; do
            if [[ "$job_result" != "success" && "$job_result" != "skipped" ]]; then
              echo "A required job did not succeed (result: $job_result)"
              failed=1
            fi
          done
          exit $failed

  # ── Attestation for the merge queue (ADR-123, amended 2026-10-19) ───
  # A pull_request run into master that passed "CI required" signs an
  # artifact attestation whose subject is the tree it tested (GITHUB_SHA's
  # tree). A merge_group run whose merged tree has such an attestation,
  # signed by a workflow whose own commit has that tree, reuses the result
  # (the changes job above). The job's name carries the tree for people
  # reading the checks; the queue does not read check runs, which any
  # workflow of the repository can write.
  tested-tree:
    name: Tested tree ${{ needs.changes.outputs.tree }}
    needs: [changes, required]
    # always(): a job skipped anywhere upstream of `required` (Docs check on a
    # code PR) would otherwise skip this one implicitly. Only a PR into master
    # attests: a Markdown-only run skips the code suite on the ground that its
    # base's code passed CI, which holds for master (every code change came
    # through the queue or a full push run) but not for another branch. A
    # fork's run gets no OIDC token, so only a same-repository head attests.
    # A run into another branch executes that branch's workflow and could
    # sign anything. The queue accepts only a signer whose own commit has the
    # queued tree, so such a run either ran another ci.yml (another tree) or
    # ran this one, whose base_ref condition here refuses it. The tree check
    # relies on that condition: keep it.
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.full_name == github.repository && needs.required.result == 'success' && needs.changes.outputs.tree != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Write the tested tree
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: |
          echo "CI required passed on tree $TREE"
          printf '%s' "$TREE" > "$RUNNER_TEMP/tested-tree"
      # Not attesting only costs the queue a full run, so a failure here
      # does not fail the job.
      - name: Attest the tested tree
        # Pinned by commit: the only job here that can mint an OIDC token.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: ${{ runner.temp }}/tested-tree
          show-summary: false

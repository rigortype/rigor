    Rigor::Inference::ProjectPatchedScanner#record_def_node: 'issue #1708, records the visibility a pre_eval: patch has (the def-argument and toggle forms, private :x, module_function''s public singleton copy, an alias copying its old name''s visibility) on the pre_eval: registry entry only, so a private patch does not answer an explicit-receiver call; it writes no discovery table and derives no declaration context'
    Rigor::Inference::ProjectPatchedScanner#walk_node: grandfathered

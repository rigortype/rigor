profiles:
  default:
    test_runner: rspec
    workers: auto
    timing_file: tmp/binpacker.timings
    test_pattern: spec/**/*_spec.rb
    test_exclude:
      - spec/rigor/analysis/runner_pool_spec.rb
      - spec/integration/plugins/*_spec.rb
      - spec/integration/examples/*_spec.rb
    scheduler:
      algorithm: lpt

  # CI runs are noisier than local ones (shared runners, per-file
  # run-to-run CV ~0.13 measured on our own timing history), which
  # puts a ~6% max-deviation floor under any static schedule. Work
  # stealing absorbs that: workers that finish their LPT queue pull
  # batches from the heaviest remaining queue. Costs a few extra
  # rspec boots per worker; a clear net win on GitHub Actions where
  # the 4-worker deviation reached 15% (65s) statically.
  #
  # The matrix's runners are not one machine either: the same slice, cut
  # from the same timing file, ran 664s on one and 1208s on another
  # (runs 45901119353 and 45907406129, shard 2). A sample taken on the
  # slow one weighed its files heavier than their peers, and the next
  # partition came in 36% under prediction on the shard holding them.
  # normalize_speed records each run's samples divided by its runner's
  # speed factor, so the history the partition is cut from stays on one
  # scale. It cannot make a slow runner fast; it keeps one from skewing
  # every later cut.
  ci:
    extends: default
    normalize_speed: true
    scheduler:
      steal_enabled: true

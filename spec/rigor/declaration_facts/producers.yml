    Rigor::Inference::MatchRebinding#makes_closure?: grandfathered
    Rigor::Inference::MatchRebinding#operand_may_match?: grandfathered
    Rigor::Inference::MatchRebinding#scan: grandfathered
    Rigor::Inference::MatchRebinding#value_may_rebind?: grandfathered
lib/rigor/inference/match_rebinding/frame.rb:

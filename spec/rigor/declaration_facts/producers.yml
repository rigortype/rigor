    Rigor::Analysis::CheckRules::IvarWriteCollector#gather_writes: grandfathered
    Rigor::Analysis::CheckRules::IvarWriteCollector#walk: grandfathered
lib/rigor/analysis/check_rules/lexical_method_sites.rb:

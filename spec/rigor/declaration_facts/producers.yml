    Rigor::Inference::ScopeIndexer#add_file_possible: ADR-119 WD3, the `∪ (P_f − C)` half of the possible-methods fold; it combines two tables' kinds per name and side and decides no declaration context
    Rigor::Inference::ScopeIndexer#add_header_nesting: grandfathered
    Rigor::Inference::ScopeIndexer#alias_renamed_header_nestings: grandfathered
    Rigor::Inference::ScopeIndexer#append_ancestry_signature: grandfathered
    Rigor::Inference::ScopeIndexer#append_certainty_signature: ADR-119 WD3, it renders the file's filled siblings (possible names, contested slots) into the ADR-89 declaration signature so a certainty-only edit (`… end if X`) moves it; it reads the siblings the walk produced and decides no context
    Rigor::Inference::ScopeIndexer#append_constant_signature: grandfathered
    Rigor::Inference::ScopeIndexer#append_declaration_tables: grandfathered
    Rigor::Inference::ScopeIndexer#append_def_signatures: grandfathered
    Rigor::Inference::ScopeIndexer#append_envelope_signature: grandfathered
    Rigor::Inference::ScopeIndexer#append_mixin_signature: renders the mixin lists and the unpositioned table into the declaration signature; it derives no declaration context
    Rigor::Inference::ScopeIndexer#apply_alias_def_nodes: grandfathered
    Rigor::Inference::ScopeIndexer#apply_compact_header_renames!: grandfathered
    Rigor::Inference::ScopeIndexer#apply_dynamic_target_writes: grandfathered
    Rigor::Inference::ScopeIndexer#apply_named_visibility: grandfathered
    Rigor::Inference::ScopeIndexer#apply_visibility_call: grandfathered
    Rigor::Inference::ScopeIndexer#bare_visibility_toggle?: ADR-119 WD3, names the receiverless argument-less `private` / `protected` / `public` / `module_function` call whose certainty the visibility walk's statement loop tracks; it answers whether a node is a toggle and decides no owner or side
    Rigor::Inference::ScopeIndexer#block_mixes_in?: scans an eval block for a mixin call; it answers a question and derives no declaration context
    Rigor::Inference::ScopeIndexer#build_method_visibility_tables: the grandfathered visibility walk's entry point, moved from build_discovered_method_visibilities (now a projection of it) so the walk also returns ADR-119 WD3's contested visibility slots; it starts the walk at the top level with the same default and adds no context of its own

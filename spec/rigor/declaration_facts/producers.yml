    Rigor::Inference::ScopeIndexer#collect_initializer_block_ivars: grandfathered
    Rigor::Inference::ScopeIndexer#collect_meta_new_constant_decls?: grandfathered
    Rigor::Inference::ScopeIndexer#collect_meta_new_method_defs?: grandfathered

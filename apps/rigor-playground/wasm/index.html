<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigor Playground (WASM)</title>

  <!--
    ADR-29 WD10 — wasm location. Defaults to the same-origin relative path
    used by `rake serve` for local dev. In production the docs-site sync step
    rewrites this tag's `content` to the Cloudflare R2 URL of the version-
    pinned build, so the page never hard-codes a deploy detail. Leave the
    content empty to keep the relative default.
  -->
  <meta name="rigor-wasm-url" content="">


  <!--
    ADR-29 WD9 — fully in-browser Rigor playground.

    No backend: the Rigor engine runs in a ruby.wasm VM compiled by
    apps/rigor-playground/wasm/Rakefile (`rake build`). This page is a
    static asset; deploy it + rigor-playground.wasm to any static host
    (Cloudflare Pages, GitHub Pages, …) — the try.ruby-lang.org model.

    It reuses the WD2 JSON contract verbatim: the in-VM adapter (boot.rb)
    returns the same {diagnostics, error_count, success} / {annotations}
    shapes the Rack backend does, so the rendering code matches the
    backend page. The only difference is the transport — `callVM()`
    replaces `fetch("/check")`.
  -->

  <script>
    (function () {
      const stored = localStorage.getItem("rigor-theme") || "system"
      const dark   = stored === "dark" ||
                     (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.dataset.theme = dark ? "dark" : "light"
    })()
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/ca9a253b70.js" crossorigin="anonymous" async></script>

  <style>
    :root {
      --rigor-ink-2: #2A2F38; --rigor-ink-3: #585F6B;
      --rigor-paper: #F6F4EE; --rigor-paper-2: #EFEBE0; --rigor-paper-3: #E6E1D2; --rigor-rule: #D6D2C7;
      --rigor-term-bg: #1A1D23; --rigor-term-fg: #E6E1D2;
      --rigor-accent: #7A2A2A;
      --rigor-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --rigor-font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    :root, :root[data-theme="light"] {
      --bg: var(--rigor-paper); --surface: var(--rigor-paper-2); --border: var(--rigor-rule);
      --border-strong: #B7B2A2; --text: var(--rigor-ink-2); --muted: var(--rigor-ink-3);
      --accent: var(--rigor-accent); --hover: var(--rigor-paper-3); --active-line: #ECE7D8;
      --selection: #D9C9C5; --gutter-fg: var(--rigor-ink-3); --gutter-bg: var(--rigor-paper-2);
      --anno: var(--rigor-ink-3);
      --c-error: #B5302B; --c-warning: #8A5F12; --c-info: #2D5C9E; --c-ok: #2E6F3F; --sev-fg: #fff;
      --trace-hl: #EAD9B0; --trace-hl-border: #C79A3A;   /* type-inference animation highlight */
      /* Syntax highlight — light (deep, warm ink on parchment) */
      --syn-keyword: #8A2C6E; --syn-def: #9A5B12; --syn-type: #2E6F3F; --syn-string: #4A6E26;
      --syn-number: #9A3F1E; --syn-comment: #7C7568; --syn-meta: #2D5C9E;
      --syn-var: var(--rigor-ink-2); --syn-operator: var(--rigor-ink-3);
    }
    :root[data-theme="dark"] {
      --bg: var(--rigor-term-bg); --surface: #22262E; --border: #353941; --border-strong: #4A4F58;
      --text: var(--rigor-term-fg); --muted: #B6BAC2; --accent: #E08C84; --hover: #2A2E37;
      --active-line: #232830; --selection: #3D2F2E; --gutter-fg: #8A909B; --gutter-bg: #181B21;
      --anno: #8A909B;
      --c-error: #ED8B82; --c-warning: #E4B25A; --c-info: #8AB6E6; --c-ok: #86C28E; --sev-fg: #0E1116;
      --trace-hl: #463A22; --trace-hl-border: #8A6A2A;   /* type-inference animation highlight */
      /* Syntax highlight — dark (warm parchment tones, no cold purple/blue) */
      --syn-keyword: #E0A0B4; --syn-def: #E6B860; --syn-type: #93C9A3; --syn-string: #B5C56E;
      --syn-number: #EC9A6E; --syn-comment: #8B8475; --syn-meta: #D7B6E0;
      --syn-var: var(--rigor-term-fg); --syn-operator: #B6BAC2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; flex-direction: column; height: 100vh;
      font-family: var(--rigor-font-sans); font-size: 14px;
      background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0; min-height: 44px;
    }
    .brand { font-weight: 700; letter-spacing: -0.01em; color: var(--text); display: flex; align-items: baseline; gap: 8px; }
    .brand::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--accent); border-radius: 1px; transform: translateY(1px); }
    .brand .product { font-weight: 500; color: var(--muted); }
    .brand .wasm-tag { font-family: var(--rigor-font-mono); font-size: 10px; color: var(--accent); border: 1px solid var(--accent); border-radius: 2px; padding: 1px 4px; }
    #status { font-family: var(--rigor-font-mono); font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    #status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.8; }
    #status.checking { color: var(--c-warning); } #status.ok { color: var(--c-ok); } #status.error { color: var(--c-error); }
    .toolbar { margin-left: auto; display: flex; gap: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 7px; font: 500 13px var(--rigor-font-sans); padding: 5px 12px; min-height: 28px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); cursor: pointer; }
    .btn:hover { background: var(--hover); } .btn.active { background: var(--accent); border-color: var(--accent); color: var(--sev-fg); }
    .btn svg, .btn .fa-solid, .btn .fa-regular { width: 13px; height: 13px; font-size: 12px; flex-shrink: 0; opacity: 0.9; }
    .btn.active svg, .btn.active .fa-solid, .btn.active .fa-regular { opacity: 1; }
    main { display: flex; flex: 1; overflow: hidden; }
    #editor-wrap { flex: 1; overflow: auto; min-width: 0; }
    #sidebar { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--border); overflow: hidden; }
    #sidebar-header { display: flex; justify-content: space-between; padding: 12px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
    #diag-count { font-family: var(--rigor-font-mono); text-transform: none; }
    #diagnostics { flex: 1; overflow-y: auto; }
    .diag-empty { padding: 16px; font-family: var(--rigor-font-mono); font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
    .diag-empty::before { content: "✓"; color: var(--c-ok); font-weight: 700; }
    .diag-item { display: flex; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .diag-item:hover { background: var(--hover); }
    .diag-sev { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 2px; flex-shrink: 0; align-self: flex-start; margin-top: 1px; color: var(--sev-fg); min-width: 56px; text-align: center; }
    .diag-sev.error { background: var(--c-error); } .diag-sev.warning { background: var(--c-warning); } .diag-sev.info { background: var(--c-info); }
    .diag-body { flex: 1; min-width: 0; }
    .diag-loc { font-family: var(--rigor-font-mono); font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .diag-msg { font-size: 13px; line-height: 1.45; word-break: break-word; }
    .diag-rule { font-family: var(--rigor-font-mono); font-size: 11px; color: var(--accent); margin-top: 4px; }
    .cm-editor { height: 100%; font-size: 13.5px; } .cm-editor.cm-focused { outline: none; } .cm-scroller { height: 100%; font-family: var(--rigor-font-mono); }
    .cm-type-annotation { color: var(--anno); font-style: italic; pointer-events: none; user-select: none; }

    /* Lint hover tooltip — readable in dark + light. CM6 wraps the lint
       content (ul.cm-tooltip-lint) in an OUTER .cm-tooltip-hover container
       that carries the background, so both must be styled. */
    .cm-tooltip, .cm-tooltip.cm-tooltip-hover, .cm-tooltip.cm-tooltip-above { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,0.28); color: var(--text); }
    .cm-tooltip .cm-tooltip-arrow::before { border-top-color: var(--border-strong); border-bottom-color: var(--border-strong); }
    .cm-tooltip .cm-tooltip-arrow::after  { border-top-color: var(--surface); border-bottom-color: var(--surface); }
    ul.cm-tooltip-lint { background: var(--surface); color: var(--text); max-width: 42ch; padding: 0; margin: 0; border-radius: 4px; overflow: hidden; list-style: none; }
    .cm-tooltip-lint .cm-diagnostic { font-family: var(--rigor-font-mono); font-size: 12px; line-height: 1.5; padding: 7px 10px; margin: 0; color: var(--text); border-left-width: 3px; white-space: pre-wrap; }
    .cm-tooltip-lint .cm-diagnostic-error { border-left-color: var(--c-error); }
    .cm-tooltip-lint .cm-diagnostic-warning { border-left-color: var(--c-warning); }
    .cm-tooltip-lint .cm-diagnostic-info { border-left-color: var(--c-info); }
    .cm-tooltip-lint .cm-diagnosticSource { color: var(--muted); }

    /* Autocomplete dropdown — warm theme; selectors out-specify CM's base. */
    .cm-tooltip.cm-tooltip-autocomplete { padding: 0; overflow: hidden; }
    .cm-tooltip.cm-tooltip-autocomplete > ul { font-family: var(--rigor-font-mono); font-size: 12.5px; max-height: 16em; background: var(--surface); color: var(--text); margin: 0; padding: 4px; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 3px; color: var(--text); line-height: 1.5; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] { background: var(--accent); color: var(--sev-fg); }
    .cm-tooltip-autocomplete .cm-completionLabel { color: inherit; }
    .cm-tooltip-autocomplete .cm-completionMatchedText { text-decoration: underline; font-weight: 700; color: inherit; }
    .cm-tooltip-autocomplete .cm-completionDetail { color: var(--muted); font-style: italic; margin-left: auto; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] .cm-completionDetail { color: var(--sev-fg); opacity: 0.85; }
    .cm-tooltip-autocomplete .cm-completionIcon { color: var(--muted); opacity: 0.8; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] .cm-completionIcon { color: var(--sev-fg); }
    .cm-completionInfo { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 4px; }

    /* ── Type-inference trace animation (wasm-only) ──────────────────────────
       A browser port of `rigor trace`: the editor becomes the source panel
       (the current event's range is highlighted + gets an inline `⟶ Type`),
       while the sidebar swaps its diagnostics view for a scope table + a
       step narration + playback controls, driven by the FlowTracer event
       stream boot.rb returns from `trace`. */
    .cm-trace-active { background: var(--trace-hl); border-radius: 2px; box-shadow: inset 0 -2px 0 var(--trace-hl-border); }
    .cm-trace-type { color: var(--accent); font-style: italic; font-weight: 600; padding-left: 2px; pointer-events: none; user-select: none; white-space: pre; }

    /* The sidebar shows EITHER the diagnostics view or the trace panel, never
       both: an explicit data-view (rather than the `hidden` attribute, which
       the panels' own `display` would override) toggles between them. */
    #trace-panel { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #sidebar[data-view="trace"] #sidebar-header,
    #sidebar[data-view="trace"] #diagnostics { display: none; }
    #sidebar[data-view="trace"] #trace-panel { display: flex; }

    .tr-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
    .tr-close { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 3px; }
    .tr-close:hover { background: var(--hover); color: var(--text); }
    .tr-controls { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .tr-buttons { display: flex; align-items: center; gap: 4px; }
    .tr-buttons button { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); border-radius: 4px; cursor: pointer; font-size: 12px; }
    .tr-buttons button:hover { background: var(--hover); }
    .tr-buttons #tr-play { background: var(--accent); border-color: var(--accent); color: var(--sev-fg); }
    .tr-step { margin-left: auto; font-family: var(--rigor-font-mono); font-size: 12px; color: var(--muted); }
    #tr-scrub { width: 100%; accent-color: var(--accent); }
    /* gdb-style stepping over the expression-evaluation tree */
    .tr-steprow { display: flex; align-items: center; gap: 6px; }
    .tr-steplabel { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .tr-steprow button { flex: 1; height: 28px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); border-radius: 4px; cursor: pointer; font: 500 12px var(--rigor-font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .tr-steprow button:hover { background: var(--hover); }
    .tr-steprow button i { font-size: 10px; opacity: 0.85; }
    .tr-options { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
    .tr-options select { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); border-radius: 3px; padding: 2px 4px; }
    .tr-options label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .tr-narration { padding: 14px 16px; border-bottom: 1px solid var(--border); font-family: var(--rigor-font-mono); font-size: 12.5px; line-height: 1.6; }
    .tr-badge { display: inline-block; font-family: var(--rigor-font-sans); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 2px; color: var(--sev-fg); margin-bottom: 8px; }
    .tr-badge-bind { background: var(--c-info); }
    .tr-badge-union { background: var(--c-warning); }
    .tr-badge-dispatch { background: var(--c-ok); }
    .tr-badge-dispatch-unresolved { background: var(--muted); }
    .tr-badge-enter { background: var(--border-strong); color: var(--text); }
    .tr-badge-result { background: var(--accent); }
    .tr-narr-body { word-break: break-word; }
    .tr-name { color: var(--syn-var); font-weight: 600; }
    .tr-type { color: var(--syn-type); font-weight: 600; }
    .tr-method { color: var(--syn-def); font-weight: 600; }
    .tr-node { color: var(--syn-meta); }
    .tr-arrow, .tr-op { color: var(--muted); }
    .tr-muted { color: var(--muted); }
    .tr-stack { margin-top: 8px; color: var(--muted); font-size: 11px; }
    .tr-scope-header { padding: 8px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: var(--surface); }
    .tr-scope { flex: 1; overflow-y: auto; padding: 6px 0; }
    .tr-scope-empty { padding: 8px 16px; font-family: var(--rigor-font-mono); font-size: 12px; color: var(--muted); }
    .tr-row { display: flex; gap: 8px; padding: 5px 16px; font-family: var(--rigor-font-mono); font-size: 12.5px; align-items: baseline; }
    .tr-row-name { color: var(--syn-var); flex-shrink: 0; }
    .tr-row-name::after { content: " :"; color: var(--muted); }
    .tr-row-type { color: var(--syn-type); word-break: break-word; }
    .tr-row-changed { animation: tr-flash 0.9s ease-out; }
    @keyframes tr-flash { 0% { background: var(--trace-hl); } 100% { background: transparent; } }
    @media (prefers-reduced-motion: reduce) { .tr-row-changed { animation: none; } }

    /* Engine-loading state — the editor renders and is editable immediately;
       the wasm VM download + first env build (several seconds) is surfaced
       NON-blockingly in the diagnostics panel + the header status, so the page
       never feels gated behind a full-screen overlay. */
    .diag-loading { padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .diag-loading .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .diag-loading-msg { font-family: var(--rigor-font-mono); font-size: 12px; color: var(--text); }
    .diag-loading-msg.failed { color: var(--c-error); }
    .diag-loading-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <header>
    <span class="brand">Rigor <span class="product">Playground</span> <span class="wasm-tag">WASM</span></span>
    <span id="status" aria-live="polite">Loading…</span>
    <div class="toolbar">
      <button class="btn" id="theme-btn" title="Cycle theme">Dark</button>
      <button class="btn active" id="type-btn" aria-pressed="true"><i class="fa-solid fa-eye-slash" aria-hidden="true"></i><span>Hide types</span></button>
      <button class="btn" id="trace-btn" aria-pressed="false" title="Replay how the engine infers each type"><i class="fa-solid fa-film" aria-hidden="true"></i><span>Trace types</span></button>
    </div>
  </header>

  <main>
    <div id="editor-wrap"><div id="editor"></div></div>
    <aside id="sidebar" aria-label="Diagnostics">
      <div id="sidebar-header"><span>Diagnostics</span><span id="diag-count">0</span></div>
      <div id="diagnostics">
        <div class="diag-loading">
          <div class="spinner" aria-hidden="true"></div>
          <div class="diag-loading-msg" id="engine-load-msg">Loading the Rigor engine…</div>
          <div class="diag-loading-note">Compiling Rigor into a Ruby&nbsp;4.0 WebAssembly VM. The first analysis builds the type environment and is slower; later edits reuse it.</div>
        </div>
      </div>
      <div id="trace-panel">
        <div class="tr-header"><span>Type inference trace</span><button class="tr-close" id="trace-close" title="Exit trace" aria-label="Exit trace">✕</button></div>
        <div class="tr-controls">
          <div class="tr-buttons">
            <button id="tr-first" title="First step" aria-label="First step"><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
            <button id="tr-prev" title="Previous step" aria-label="Previous step"><i class="fa-solid fa-backward" aria-hidden="true"></i></button>
            <button id="tr-play" title="Play" aria-label="Play or pause"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
            <button id="tr-next" title="Next step" aria-label="Next step"><i class="fa-solid fa-forward" aria-hidden="true"></i></button>
            <button id="tr-last" title="Last step" aria-label="Last step"><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
            <span class="tr-step" id="tr-step">1 / 1</span>
          </div>
          <input type="range" id="tr-scrub" min="0" max="0" value="0" step="1" aria-label="Trace step">
          <div class="tr-steprow">
            <span class="tr-steplabel">Step</span>
            <button id="tr-in" title="Step in — into the next sub-expression"><i class="fa-solid fa-arrow-down-long" aria-hidden="true"></i>In</button>
            <button id="tr-over" title="Step over — evaluate this expression, skip its internals"><i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>Over</button>
            <button id="tr-out" title="Step out — finish the enclosing expression"><i class="fa-solid fa-arrow-up-long" aria-hidden="true"></i>Out</button>
          </div>
          <div class="tr-options">
            <label>Speed
              <select id="tr-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
            </label>
            <label title="Include every expression enter/result frame"><input type="checkbox" id="tr-detail"> Detailed</label>
          </div>
        </div>
        <div class="tr-narration" id="tr-narration"></div>
        <div class="tr-scope-header">scope</div>
        <div class="tr-scope" id="tr-scope"></div>
      </div>
    </aside>
  </main>

  <script type="module">
    import { basicSetup, EditorView, EditorState } from "https://esm.sh/@codemirror/basic-setup@0.20"
    import { StateField, StateEffect, Prec }       from "https://esm.sh/@codemirror/state@0.20"
    import { Decoration, WidgetType }              from "https://esm.sh/@codemirror/view@0.20"
    import { StreamLanguage, HighlightStyle, syntaxHighlighting } from "https://esm.sh/@codemirror/language@0.20?deps=@lezer/highlight@1.1.6"
    import { ruby }                                from "https://esm.sh/@codemirror/legacy-modes@0.20/mode/ruby"
    import { lintGutter, setDiagnostics }          from "https://esm.sh/@codemirror/lint@0.20"
    import { tags as t }                           from "https://esm.sh/@lezer/highlight@1.1.6"
    import LZString                               from "https://esm.sh/lz-string@1.5.0"

    // The ruby.wasm glue is imported lazily inside bootEngine() (dynamic import)
    // — NOT statically — so it stays off the editor's critical path. The editor
    // renders and is interactive before any wasm machinery is even fetched.
    const RUBY_WASM_WASI = "https://cdn.jsdelivr.net/npm/@ruby/wasm-wasi@2.7.1/dist/browser/+esm"

    // ADR-29 WD10 — the docs-site sync step injects the R2 URL into the
    // <meta name="rigor-wasm-url"> tag in production; local `rake serve` keeps
    // the same-origin relative default.
    const WASM_URL =
      document.querySelector('meta[name="rigor-wasm-url"]')?.content || "./rigor-playground.wasm"

    const SAMPLE = `# Rigor Playground (WASM) — runs entirely in your browser.

def greet(name)
  "Hello, " + name
end

result = greet("World")
result.upcase

# Try introducing an error:
x = nil
x.upcase   # possible-nil-receiver

# Inline-RBS works without a magic comment (rigor-rbs-inline is
# pre-loaded with require_magic_comment: false, per ADR-32 WD10):
class AscDesc
  # @rbs asc_or_desc: :asc | :desc
  def ascdesc(asc_or_desc)
    asc_or_desc
  end
end

AscDesc.new.ascdesc(:bad)
`

    // ── ruby.wasm transport (replaces the backend's fetch calls) ───────────
    //
    // The VM is booted once. Each request sets a JSON string on a JS global
    // (read by boot.rb via JS.global) and synchronously evaluates the adapter,
    // which returns the same JSON the Rack backend produces.

    let vm = null

    // ── Engine-loading UI (non-blocking) ──────────────────────────────────
    // Mirrors the boot phase into the header status + the diagnostics-panel
    // placeholder. No overlay: the editor stays visible and editable throughout.

    const mb = b => (b / 1048576).toFixed(1) + " MB"

    function setEnginePhase(short, detail) {
      setStatus("checking", short)
      const el = document.getElementById("engine-load-msg")
      if (el) el.textContent = detail || short
    }

    function engineFailed(message) {
      setStatus("error", "Engine failed")
      const c = document.getElementById("diagnostics")
      c.innerHTML = `
        <div class="diag-loading">
          <div class="diag-loading-msg failed">Failed to load the Rigor engine</div>
          <div class="diag-loading-note">${escHtml(message)}</div>
        </div>`
    }

    // Stream the wasm body through a byte counter so the multi-MB download shows
    // live progress, while still letting compileStreaming compile incrementally.
    let lastProgress = -1
    async function compileWasmWithProgress(url) {
      const response = await fetch(url)
      if (!response.ok) throw new Error(`could not fetch ${url} (HTTP ${response.status})`)
      if (!response.body || typeof ReadableStream === "undefined") {
        return WebAssembly.compileStreaming(response)
      }
      const total  = Number(response.headers.get("content-length")) || 0
      const reader = response.body.getReader()
      let loaded   = 0
      const tracked = new ReadableStream({
        async pull(controller) {
          const { done, value } = await reader.read()
          if (done) { controller.close(); return }
          loaded += value.byteLength
          if (total) {
            const pct = Math.min(100, Math.floor(loaded / total * 100))
            if (pct !== lastProgress) { lastProgress = pct; setEnginePhase(`Downloading ${pct}%`, `Downloading the engine… ${pct}%  (${mb(loaded)} / ${mb(total)})`) }
          } else {
            const step = Math.floor(loaded / (2 * 1048576))
            if (step !== lastProgress) { lastProgress = step; setEnginePhase("Downloading…", `Downloading the engine… ${mb(loaded)}`) }
          }
          controller.enqueue(value)
        },
        cancel(reason) { return reader.cancel(reason) }
      })
      return WebAssembly.compileStreaming(new Response(tracked, { headers: { "content-type": "application/wasm" } }))
    }

    async function bootEngine() {
      setEnginePhase("Loading…", "Downloading the engine…")
      // Fetch+compile the wasm and download the VM glue in parallel; the glue is
      // a dynamic import so it never blocked the editor render above.
      const [{ DefaultRubyVM }, module] = await Promise.all([
        import(RUBY_WASM_WASI),
        compileWasmWithProgress(WASM_URL),
      ])
      setEnginePhase("Booting VM…", "Booting the Ruby 4.0 VM…")
      const result = await DefaultRubyVM(module)
      vm = result.vm
      setEnginePhase("Loading engine…", "Loading the Rigor engine…")
      // Yield a macrotask so the "Loading engine…" paint lands before the
      // synchronous, main-thread-blocking engine require below. setTimeout
      // (not requestAnimationFrame) so it still fires in a background tab.
      await new Promise(r => setTimeout(r, 0))
      // Activate the packed bundle (ruby_wasm's generated load-path setup —
      // NOT bundler/setup, which hits a rubygems path that is disabled in the
      // ruby.wasm build) and load the in-VM adapter. boot.rb itself does the
      // `require "rubygems"` the RBS env needs and stages a writable /work
      // under DefaultRubyVM's in-memory root.
      vm.eval(`require "/bundle/setup"; require "/playground/boot"`)
    }

    function callVM(kind, request) {
      globalThis.rigorRequestJson = JSON.stringify(request)
      const json = vm.eval(`Rigor::Playground::Wasm.dispatch(${JSON.stringify(kind)})`).toString()
      return JSON.parse(json)
    }

    // ── Type-annotation ghost text (same widget as the backend page) ───────

    class TypeAnnotationWidget extends WidgetType {
      constructor(type, pad) { super(); this.type = type; this.pad = pad }
      eq(o) { return o.type === this.type && o.pad === this.pad }
      ignoreEvent() { return true }
      toDOM() {
        const el = document.createElement("span"); el.className = "cm-type-annotation"
        const spacer = document.createElement("span")
        spacer.style.cssText = `display:inline-block;width:${this.pad}ch`
        el.appendChild(spacer); el.appendChild(document.createTextNode(this.type)); return el
      }
    }
    const setAnnoEffect = StateEffect.define()
    const annoField = StateField.define({
      create: () => Decoration.none,
      update(deco, tr) { deco = deco.map(tr.changes); for (const e of tr.effects) if (e.is(setAnnoEffect)) deco = e.value; return deco },
      provide: f => EditorView.decorations.from(f)
    })
    function applyAnnotations(annotations) {
      const BASE_GAP = 3, doc = view.state.doc
      const entries = Object.entries(annotations).map(([l, type]) => ({ n: parseInt(l, 10), type })).filter(({ n }) => n >= 1 && n <= doc.lines)
      if (!entries.length) { view.dispatch({ effects: setAnnoEffect.of(Decoration.none) }); return }
      const maxLen = Math.max(...entries.map(({ n }) => doc.line(n).length))
      const ranges = entries.map(({ n, type }) => {
        const line = doc.line(n), pad = maxLen - line.length + BASE_GAP
        return Decoration.widget({ widget: new TypeAnnotationWidget(type, pad), side: 1 }).range(line.to)
      }).sort((a, b) => a.from - b.from)
      view.dispatch({ effects: setAnnoEffect.of(Decoration.set(ranges)) })
    }
    function clearAnnotations() { view.dispatch({ effects: setAnnoEffect.of(Decoration.none) }) }

    // ── Type-inference trace player (wasm-only) ────────────────────────────
    //
    // Replays the FlowTracer event stream `boot.rb`'s `trace` operation
    // returns. The editor is the source panel: the current event's range is
    // highlighted and, when the step produced a concrete type, an inline
    // `⟶ Type` widget reveals it. The sidebar's trace panel narrates the step,
    // accumulates the bound locals (the scope table), and drives playback.

    class TraceTypeWidget extends WidgetType {
      constructor(label) { super(); this.label = label }
      eq(o) { return o.label === this.label }
      ignoreEvent() { return true }
      toDOM() { const el = document.createElement("span"); el.className = "cm-trace-type"; el.textContent = " ⟶ " + this.label; return el }
    }
    const setTraceHl = StateEffect.define()
    const traceHlField = StateField.define({
      create: () => Decoration.none,
      update(deco, tr) {
        for (const e of tr.effects) {
          if (!e.is(setTraceHl)) continue
          if (!e.value) return Decoration.none
          const { from, to, label } = e.value
          const ranges = []
          if (to > from) ranges.push(Decoration.mark({ class: "cm-trace-active" }).range(from, to))
          if (label != null) ranges.push(Decoration.widget({ widget: new TraceTypeWidget(label), side: 1 }).range(to))
          return ranges.length ? Decoration.set(ranges, true) : Decoration.none
        }
        return deco.map(tr.changes)
      },
      provide: f => EditorView.decorations.from(f)
    })

    const TRACE_BASE_DELAY = 1000   // ms per step at 1×
    const TRACE_BADGE = { bind: "bind", union: "union", dispatch: "dispatch", "dispatch-unresolved": "dispatch", enter: "eval", result: "result" }
    const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches

    let traceActive = false, traceEvents = [], traceLocals = [], traceIndex = 0
    let tracePlaying = false, traceTimer = null, traceVerbose = false, traceSpeed = 1, traceLastRange = null

    function utf8Len(cp) { return cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4 }
    // Prism emits 1-based lines and 0-based BYTE columns; CM6 positions are
    // UTF-16 code units — walk the line's chars to convert (exact for ASCII).
    function bytePosToCM(lineNumber, byteColumn) {
      const doc = view.state.doc
      const n = Math.max(1, Math.min(lineNumber, doc.lines))
      const line = doc.line(n)
      if (byteColumn <= 0) return line.from
      const text = line.text
      let bytes = 0, i = 0
      while (i < text.length && bytes < byteColumn) {
        const cp = text.codePointAt(i)
        bytes += utf8Len(cp)
        i += cp > 0xffff ? 2 : 1
      }
      return line.from + i
    }
    function traceEventRange(ev) {
      const loc = ev.location
      if (!loc) return null
      const from = bytePosToCM(loc.start_line, loc.start_column)
      const to   = bytePosToCM(loc.end_line, loc.end_column)
      return { from, to: Math.max(from, to) }
    }
    // The inline `⟶ Type` reveal only where the step produced a concrete type;
    // an unresolved dispatch (fail-soft) gets no inline type, only narration.
    function traceEventLabel(ev) {
      const d = ev.data
      if (ev.kind === "result") return d.type
      if (ev.kind === "union")  return d.type
      if (ev.kind === "dispatch" && d.resolved) return d.type
      return null
    }
    function accumulateLocals(events) {
      const out = [], locals = {}
      for (const ev of events) {
        if (ev.kind === "bind") locals[ev.data.name] = ev.data.type
        out.push({ ...locals })
      }
      return out
    }
    function traceNarration(ev) {
      const d = ev.data, esc = escHtml
      switch (ev.kind) {
        case "bind":
          return { kind: "bind", html: `<span class="tr-name">${esc(d.name)}</span> <span class="tr-arrow">←</span> <span class="tr-type">${esc(d.type)}</span>` }
        case "union":
          return { kind: "union", html: `${d.members.map(m => `<span class="tr-type">${esc(m)}</span>`).join(' <span class="tr-op">|</span> ')} <span class="tr-arrow">→</span> <span class="tr-type">${esc(d.type)}</span>` }
        case "dispatch": {
          const call = `<span class="tr-type">${esc(d.receiver)}</span>.<span class="tr-method">${esc(d.method)}</span>(${d.args.map(a => `<span class="tr-type">${esc(a)}</span>`).join(', ')})`
          return d.resolved
            ? { kind: "dispatch", html: `${call} <span class="tr-arrow">→</span> <span class="tr-type">${esc(d.type)}</span>` }
            : { kind: "dispatch-unresolved", html: `${call} <span class="tr-arrow">→</span> <span class="tr-muted">no rule matched · widens to <span class="tr-type">Dynamic[top]</span></span>` }
        }
        case "enter":
          return { kind: "enter", html: `evaluating <span class="tr-node">${esc(d.node)}</span>` }
        case "result":
          return { kind: "result", html: `<span class="tr-node">${esc(d.node)}</span> <span class="tr-arrow">→</span> <span class="tr-type">${esc(d.type)}</span>` }
        default:
          return { kind: ev.kind, html: esc(JSON.stringify(d)) }
      }
    }
    function renderTraceScope(index) {
      const locals = traceLocals[index] || {}
      const ev = traceEvents[index]
      const changed = ev && ev.kind === "bind" ? ev.data.name : null
      const names = Object.keys(locals)
      if (!names.length) return `<div class="tr-scope-empty">(no locals bound yet)</div>`
      return names.map(name =>
        `<div class="tr-row${name === changed ? ' tr-row-changed' : ''}"><span class="tr-row-name">${escHtml(name)}</span><span class="tr-row-type">${escHtml(locals[name])}</span></div>`
      ).join("")
    }
    function renderTracePanel(ev) {
      document.getElementById("tr-step").textContent = `${traceIndex + 1} / ${traceEvents.length}`
      document.getElementById("tr-scrub").value = String(traceIndex)
      const n = traceNarration(ev)
      const stack = ev.stack && ev.stack.length ? `<div class="tr-stack">stack: ${ev.stack.map(escHtml).join(" › ")}</div>` : ""
      document.getElementById("tr-narration").innerHTML =
        `<span class="tr-badge tr-badge-${n.kind}">${TRACE_BADGE[n.kind] || ev.kind}</span><div class="tr-narr-body">${n.html}</div>${stack}`
      document.getElementById("tr-scope").innerHTML = renderTraceScope(traceIndex)
    }
    function renderTrace() {
      const ev = traceEvents[traceIndex]
      if (!ev) return
      const range = traceEventRange(ev)
      const effects = []
      if (range) {
        traceLastRange = range
        effects.push(setTraceHl.of({ from: range.from, to: range.to, label: traceEventLabel(ev) }))
        effects.push(EditorView.scrollIntoView(range.from, { y: "center" }))
      } else if (traceLastRange) {
        // Statement-level binds/unions carry no source range — keep the last
        // located highlight for continuity, minus its (now stale) type label.
        effects.push(setTraceHl.of({ from: traceLastRange.from, to: traceLastRange.to, label: null }))
      } else {
        effects.push(setTraceHl.of(null))
      }
      view.dispatch({ effects })
      renderTracePanel(ev)
    }
    function updatePlayButton() {
      const b = document.getElementById("tr-play")
      b.innerHTML = tracePlaying ? '<i class="fa-solid fa-pause" aria-hidden="true"></i>' : '<i class="fa-solid fa-play" aria-hidden="true"></i>'
      b.title = tracePlaying ? "Pause" : "Play"
    }
    function traceStepTo(i) { traceIndex = Math.max(0, Math.min(i, traceEvents.length - 1)); renderTrace() }
    // gdb-style stepping over the expression-evaluation tree. Events carry
    // `depth`; a verbose `enter`(d) … children(>d) … `result`(d) brackets each
    // frame, so step-over/out are depth transitions (step-in is a plain +1).
    function traceStepIn()   { tracePause(); traceStepTo(traceIndex + 1) }
    function traceStepOver() {
      tracePause()
      const d = traceEvents[traceIndex] ? traceEvents[traceIndex].depth : 0
      let j = traceIndex + 1
      while (j < traceEvents.length && traceEvents[j].depth > d) j++   // skip this node's subtree
      traceStepTo(j)
    }
    function traceStepOut() {
      tracePause()
      const d = traceEvents[traceIndex] ? traceEvents[traceIndex].depth : 0
      let j = traceIndex + 1
      while (j < traceEvents.length && traceEvents[j].depth >= d) j++  // rise past the enclosing frame
      traceStepTo(j)
    }
    function traceSchedule() {
      clearTimeout(traceTimer)
      traceTimer = setTimeout(() => {
        if (!tracePlaying) return
        if (traceIndex >= traceEvents.length - 1) { tracePause(); return }
        traceStepTo(traceIndex + 1)
        traceSchedule()
      }, TRACE_BASE_DELAY / traceSpeed)
    }
    function tracePlay() {
      if (!traceEvents.length) return
      if (traceIndex >= traceEvents.length - 1) traceStepTo(0)
      tracePlaying = true; updatePlayButton(); traceSchedule()
    }
    function tracePause() { tracePlaying = false; clearTimeout(traceTimer); updatePlayButton() }
    function traceToggle() { tracePlaying ? tracePause() : tracePlay() }

    // Records the stream via the VM. The blocking `vm.eval` is deferred one
    // frame so the "Tracing…" status paints first (mirrors runCheck).
    function computeTrace() {
      return new Promise(resolve => {
        setStatus("checking", "Tracing…")
        requestAnimationFrame(() => {
          try {
            const data = callVM("trace", { source: view.state.doc.toString(), verbose: traceVerbose })
            traceEvents = data.events || []
            traceLocals = accumulateLocals(traceEvents)
            document.getElementById("tr-scrub").max = String(Math.max(0, traceEvents.length - 1))
            setStatus("ok", `Traced ${traceEvents.length} step${traceEvents.length === 1 ? "" : "s"}`)
          } catch (e) {
            traceEvents = []; traceLocals = []
            setStatus("error", `Trace error: ${e.message}`)
          }
          resolve()
        })
      })
    }
    async function enterTrace() {
      if (!vm) { setStatus("checking", "Engine still loading…"); return }
      if (typesVisible) setTypes(false)
      traceVerbose = document.getElementById("tr-detail").checked
      await computeTrace()
      if (!traceEvents.length) { setStatus("ok", "No trace events for this source"); return }
      traceActive = true
      traceBtn.classList.add("active"); traceBtn.setAttribute("aria-pressed", "true")
      document.getElementById("sidebar").dataset.view = "trace"
      traceLastRange = null; traceIndex = 0; renderTrace()
      if (!prefersReducedMotion) tracePlay()
    }
    function exitTrace() {
      if (!traceActive) return
      tracePause()
      traceActive = false
      traceBtn.classList.remove("active"); traceBtn.setAttribute("aria-pressed", "false")
      traceLastRange = null
      view.dispatch({ effects: setTraceHl.of(null) })
      document.getElementById("sidebar").dataset.view = "diagnostics"
    }

    // ── Editor ─────────────────────────────────────────────────────────────

    const MONO = `'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace`

    /* Rigor warm syntax highlight — drives off CSS vars so it tracks the
       active light/dark theme. Higher precedence than the basicSetup default
       so the cold purple/blue is fully replaced. */
    const rigorHighlight = HighlightStyle.define([
      { tag: [t.keyword, t.controlKeyword, t.definitionKeyword, t.moduleKeyword, t.operatorKeyword, t.self], color: "var(--syn-keyword)" },
      { tag: [t.function(t.variableName), t.function(t.definition(t.variableName)), t.definition(t.variableName), t.macroName], color: "var(--syn-def)", fontWeight: "500" },
      { tag: [t.typeName, t.className, t.namespace, t.tagName], color: "var(--syn-type)" },
      { tag: [t.string, t.special(t.string), t.character], color: "var(--syn-string)" },
      { tag: [t.regexp, t.escape], color: "var(--syn-string)" },
      { tag: [t.number, t.integer, t.float, t.bool, t.null, t.atom, t.constant(t.variableName), t.unit], color: "var(--syn-number)" },
      { tag: [t.comment, t.lineComment, t.blockComment, t.docComment], color: "var(--syn-comment)", fontStyle: "italic" },
      { tag: [t.meta, t.annotation, t.processingInstruction], color: "var(--syn-meta)" },
      { tag: [t.operator, t.punctuation, t.separator, t.bracket, t.derefOperator], color: "var(--syn-operator)" },
      { tag: [t.variableName, t.propertyName, t.labelName, t.attributeName], color: "var(--syn-var)" },
      { tag: t.invalid, color: "var(--c-error)" },
    ])

    // ── Shareable URL state ────────────────────────────────────────────────
    // The source round-trips through ?c=<lz-string>: restored on load,
    // rewritten (debounced) on edit. lz-string keeps even a multi-KB snippet
    // inside a comfortable URL length; history.replaceState updates the address
    // bar without a navigation or history spam.
    const QUERY_KEY = "c"
    function sourceFromUrl() {
      const c = new URLSearchParams(location.search).get(QUERY_KEY)
      if (!c) return null
      try { return LZString.decompressFromEncodedURIComponent(c) || null } catch { return null }
    }
    const INITIAL_DOC = sourceFromUrl() ?? SAMPLE

    const view = new EditorView({
      state: EditorState.create({
        doc: INITIAL_DOC,
        extensions: [
          basicSetup, StreamLanguage.define(ruby),
          Prec.highest(syntaxHighlighting(rigorHighlight)),
          lintGutter(), annoField, traceHlField,
          // Don't clear the type overlay on each keystroke. The existing
          // annotations stay on screen (mapped through the edit) and the
          // debounced background analysis refreshes them in place once it has a
          // new result — so the overlay updates without a per-keystroke flicker.
          // A trace is a snapshot of the pre-edit source, so any edit exits it.
          EditorView.updateListener.of(u => { if (!u.docChanged) return; if (traceActive) exitTrace(); scheduleCheck(); scheduleUrlSync() }),
          EditorView.theme({
            "&": { backgroundColor: "var(--bg)", color: "var(--text)", height: "100%" },
            ".cm-content": { caretColor: "var(--accent)", fontFamily: MONO, padding: "8px 0" },
            ".cm-gutters": { backgroundColor: "var(--gutter-bg)", color: "var(--gutter-fg)", border: "none", borderRight: "1px solid var(--border)" },
            ".cm-activeLine": { backgroundColor: "var(--active-line)" },
            ".cm-selectionBackground": { backgroundColor: "var(--selection)" },
            "&.cm-focused .cm-selectionBackground": { backgroundColor: "var(--selection)" },
            ".cm-lintRange-error": { textDecoration: "underline wavy var(--c-error)", textDecorationThickness: "1.5px" },
            ".cm-lintRange-warning": { textDecoration: "underline wavy var(--c-warning)", textDecorationThickness: "1.5px" },
          })
        ]
      }),
      parent: document.getElementById("editor")
    })

    // Types are on by default — the overlay is the point of the playground. The
    // toolbar button's markup starts in its pressed ("Hide types") state to
    // match, and the first post-boot check paints the annotations.
    let debounceTimer = null, typesVisible = true

    // ── Theme toggle ─────────────────────────────────────────────────────────
    const THEME_CYCLE = ["dark", "light", "system"], THEME_LABELS = { dark: "Dark", light: "Light", system: "Auto" }
    const THEME_ICONS = { dark: "fa-solid fa-moon", light: "fa-solid fa-sun", system: "fa-solid fa-circle-half-stroke" }
    const THEME_TITLES = {
      dark:   "Theme: Dark — click for Light",
      light:  "Theme: Light — click for Auto",
      system: "Theme: Auto (matches your system) — click for Dark",
    }
    let themeMode = localStorage.getItem("rigor-theme") || "system"
    const mediaDark = matchMedia("(prefers-color-scheme: dark)")
    const themeBtn = document.getElementById("theme-btn")
    function applyTheme() {
      const dark = themeMode === "dark" || (themeMode === "system" && mediaDark.matches)
      document.documentElement.dataset.theme = dark ? "dark" : "light"
      themeBtn.innerHTML = `<i class="${THEME_ICONS[themeMode]}" aria-hidden="true"></i><span>${THEME_LABELS[themeMode]}</span>`
      themeBtn.title = THEME_TITLES[themeMode]
    }
    themeBtn.addEventListener("click", () => {
      themeMode = THEME_CYCLE[(THEME_CYCLE.indexOf(themeMode) + 1) % THEME_CYCLE.length]
      localStorage.setItem("rigor-theme", themeMode); applyTheme()
    })
    mediaDark.addEventListener("change", () => { if (themeMode === "system") applyTheme() })
    applyTheme()

    // ── Check ─────────────────────────────────────────────────────────────

    function scheduleCheck() { clearTimeout(debounceTimer); debounceTimer = setTimeout(runCheck, 500) }

    // Mirror the current source into ?c=<lz-string> (debounced). Clears the
    // param when the buffer is the untouched sample, so a plain visit keeps a
    // clean URL.
    let urlTimer = null
    function scheduleUrlSync() {
      clearTimeout(urlTimer)
      urlTimer = setTimeout(() => {
        const src = view.state.doc.toString()
        const url = src === SAMPLE
          ? location.pathname
          : `${location.pathname}?${QUERY_KEY}=${LZString.compressToEncodedURIComponent(src)}`
        history.replaceState(null, "", url)
      }, 500)
    }

    function runCheck() {
      if (!vm) return
      const source = view.state.doc.toString()
      setStatus("checking", "Checking…")
      // Defer one frame so the status paint lands before the synchronous eval.
      requestAnimationFrame(() => {
        try {
          const data = callVM("check", { source })
          const diags = data.diagnostics || []
          applyLintMarkers(diags); renderSidebar(diags)
          const n = data.error_count ?? 0
          setStatus(data.success ? "ok" : "error", data.success ? "No errors" : `${n} error${n === 1 ? "" : "s"}`)
          if (typesVisible) runAnnotateLines(source)
        } catch (e) {
          setStatus("error", `Engine error: ${e.message}`)
        }
      })
    }

    function runAnnotateLines(source) {
      try { applyAnnotations(callVM("annotate-lines", { source }).annotations || {}) } catch (_) { /* best-effort */ }
    }

    function applyLintMarkers(diagnostics) {
      const doc = view.state.doc
      const cm = diagnostics.map(d => {
        const lineNum = Math.max(1, Math.min(d.line, doc.lines)), line = doc.line(lineNum)
        const from = line.from + Math.max(0, (d.column || 1) - 1)
        const to = Math.max(from + 1, Math.min(line.to, from + 10))
        return { from, to, severity: d.severity === "error" ? "error" : d.severity === "warning" ? "warning" : "info", message: d.message + (d.rule ? `  [${d.rule}]` : "") }
      })
      view.dispatch(setDiagnostics(view.state, cm))
    }

    function renderSidebar(diagnostics) {
      const container = document.getElementById("diagnostics")
      document.getElementById("diag-count").textContent = diagnostics.length
      if (!diagnostics.length) { container.innerHTML = '<p class="diag-empty">No diagnostics</p>'; return }
      container.innerHTML = diagnostics.map((d, i) => `
        <div class="diag-item" data-index="${i}" tabindex="0" role="button">
          <span class="diag-sev ${d.severity}">${d.severity}</span>
          <div class="diag-body">
            <div class="diag-loc">Line ${d.line}, col ${d.column}</div>
            <div class="diag-msg">${escHtml(d.message)}</div>
            ${d.rule ? `<div class="diag-rule">${escHtml(d.rule)}</div>` : ""}
          </div>
        </div>`).join("")
      container.querySelectorAll(".diag-item").forEach(el => {
        const jump = () => {
          const d = diagnostics[+el.dataset.index], doc = view.state.doc
          const n = Math.max(1, Math.min(d.line, doc.lines))
          const pos = doc.line(n).from + Math.max(0, (d.column || 1) - 1)
          view.dispatch({ selection: { anchor: pos }, scrollIntoView: true }); view.focus()
        }
        el.addEventListener("click", jump)
        el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); jump() } })
      })
    }

    const typeBtn = document.getElementById("type-btn")
    function setTypes(on) {
      typesVisible = on
      typeBtn.setAttribute("aria-pressed", String(on))
      typeBtn.classList.toggle("active", on)
      typeBtn.innerHTML = on
        ? '<i class="fa-solid fa-eye-slash" aria-hidden="true"></i><span>Hide types</span>'
        : '<i class="fa-solid fa-eye" aria-hidden="true"></i><span>Show types</span>'
      if (on) runAnnotateLines(view.state.doc.toString()); else clearAnnotations()
    }
    // Types overlay and the trace player are mutually exclusive sidebar views.
    typeBtn.addEventListener("click", () => { if (traceActive) exitTrace(); setTypes(!typesVisible) })

    // ── Trace controls ─────────────────────────────────────────────────────
    const traceBtn = document.getElementById("trace-btn")
    traceBtn.addEventListener("click", () => traceActive ? exitTrace() : enterTrace())
    document.getElementById("trace-close").addEventListener("click", exitTrace)
    document.getElementById("tr-first").addEventListener("click", () => { tracePause(); traceStepTo(0) })
    document.getElementById("tr-prev").addEventListener("click", () => { tracePause(); traceStepTo(traceIndex - 1) })
    document.getElementById("tr-next").addEventListener("click", () => { tracePause(); traceStepTo(traceIndex + 1) })
    document.getElementById("tr-last").addEventListener("click", () => { tracePause(); traceStepTo(traceEvents.length - 1) })
    document.getElementById("tr-play").addEventListener("click", traceToggle)
    document.getElementById("tr-in").addEventListener("click", traceStepIn)
    document.getElementById("tr-over").addEventListener("click", traceStepOver)
    document.getElementById("tr-out").addEventListener("click", traceStepOut)
    document.getElementById("tr-scrub").addEventListener("input", e => { tracePause(); traceStepTo(parseInt(e.target.value, 10)) })
    document.getElementById("tr-speed").addEventListener("change", e => { traceSpeed = parseFloat(e.target.value); if (tracePlaying) traceSchedule() })
    document.getElementById("tr-detail").addEventListener("change", async () => {
      if (!traceActive) return
      traceVerbose = document.getElementById("tr-detail").checked
      tracePause(); await computeTrace(); traceLastRange = null; traceStepTo(0)
    })

    function setStatus(cls, text) { const el = document.getElementById("status"); el.className = cls; el.textContent = text }
    function escHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") }

    // ── Boot ──────────────────────────────────────────────────────────────
    // The editor is already constructed (synchronously, above), so it paints
    // and is interactive as soon as this module finishes. bootEngine() suspends
    // at its first `await` (the parallel glue import + wasm fetch), which yields
    // control back to the browser for that first paint — so calling it directly
    // (NOT behind requestAnimationFrame, which is starved in background tabs)
    // both starts the download immediately and keeps the editor rendering first.
    bootEngine().then(() => {
      setEnginePhase("Checking…", "Running the first analysis…")
      runCheck()
    }).catch(e => {
      engineFailed(e.message)
    })
  </script>
</body>
</html>

# Rigor — GitHub Actions workflow (SARIF → code scanning).
#
# Copy to .github/workflows/rigor.yml. Runs Rigor in its own isolated job
# on Ruby 4.0 and uploads a SARIF 2.1.0 report so findings appear on the PR
# diff and in the Security tab. See docs/manual/11-ci.md and ADR-51.
name: rigor
on: [push, pull_request]

permissions:
  contents: read
  security-events: write   # required by upload-sarif

jobs:
  rigor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rigor needs Ruby 4.0; this is why it runs in its own job (a second
      # setup-ruby would clobber your test job's Ruby). See ADR-27 / ch.11.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # Installed standalone, never in your project's Gemfile (ADR-27).
      - run: gem install rigortype

      # continue-on-error so a non-zero Rigor exit still reaches the upload.
      - run: rigor check --format sarif > rigor.sarif
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: rigor.sarif

      # Effect labels (opt-in until v0.4.0, then the default): if the project
      # has an `effects:` block and a committed .rigor-effects.yml, uncomment
      # this to fail the build when a branch changes what the code *does*.
      # Left commented because `effects check` exits 1 when the snapshot file
      # is absent — which is the point on a project that has one, and noise on
      # one that does not. See docs/manual/19-effect-labels.md § In CI.
      # - run: rigor effects check

  producers:
    Rigor::Inference::LastLine::SelfEvidence: grandfathered
    Rigor::Inference::LastLine::SelfEvidence::Scan#classify: grandfathered
    Rigor::Inference::LastLine::SelfEvidence::Scan#def_context: grandfathered
    Rigor::Inference::LastLine::SelfEvidence::Scan#mixin: grandfathered

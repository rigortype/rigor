<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigor Playground</title>

  <!--
    Rigor Playground — restyled against the Rigor Design System.

    • Light  = parchment (paper / ink / oxblood accent)
    • Dark   = terminal-bg (term-fg ink, warmer accent for contrast)
    • All diagnostic colors meet WCAG AA contrast against their surfaces
      (≥4.5:1 for text, ≥3:1 for non-text UI such as severity chips).
    • Type:  Inter (UI), JetBrains Mono (code), no serif inside the app
    • Radius/spacing/borders come from rigor-* tokens.
  -->

  <!-- Set theme before first paint to avoid flash of wrong theme -->
  <script>
    (function () {
      const stored = localStorage.getItem("rigor-theme") || "system"
      const dark   = stored === "dark" ||
                     (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.dataset.theme = dark ? "dark" : "light"
    })()
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/ca9a253b70.js" crossorigin="anonymous"></script>

  <style>
    /* ─────────────────────────────────────────────────────────────────
     * Rigor design tokens (foundation)
     * Mirrored from colors_and_type.css so the playground is
     * self-contained when served from puma without static-asset routing.
     * ──────────────────────────────────────────────────────────────── */
    :root {
      --rigor-ink:        #0E1116;
      --rigor-ink-2:      #2A2F38;
      --rigor-ink-3:      #585F6B;
      --rigor-ink-4:      #6E7480;

      --rigor-paper:      #F6F4EE;
      --rigor-paper-2:    #EFEBE0;
      --rigor-paper-3:    #E6E1D2;
      --rigor-rule:       #D6D2C7;

      --rigor-term-bg:    #1A1D23;
      --rigor-term-fg:    #E6E1D2;

      --rigor-accent:     #7A2A2A;
      --rigor-accent-2:   #5C1F1F;
      --rigor-accent-3:   #F1E2DE;

      --rigor-error:      #B5302B;
      --rigor-error-bg:   #F8E5E2;
      --rigor-warning:    #8A5F12;
      --rigor-warning-bg: #F4E6C7;
      --rigor-info:       #2D5C9E;
      --rigor-info-bg:    #E1ECF8;
      --rigor-success:    #2E6F3F;
      --rigor-success-bg: #E1EEDD;

      --rigor-font-mono:  'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --rigor-font-sans:  'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;

      --rigor-sp-1:  4px;
      --rigor-sp-2:  8px;
      --rigor-sp-3:  12px;
      --rigor-sp-4:  16px;
      --rigor-sp-5:  24px;

      --rigor-radius-1: 2px;
      --rigor-radius-2: 4px;

      --rigor-transition: 120ms ease-out;
    }

    /* ─────────────────────────────────────────────────────────────────
     * Semantic theme variables — light (default, parchment)
     *
     * Contrast (vs --bg #F6F4EE):
     *   --text      ink-2  #2A2F38   12.5 : 1   AAA
     *   --muted     ink-3  #585F6B    6.4 : 1   AAA
     *   --accent    #7A2A2A           8.7 : 1   AAA
     *   --c-error   #B5302B           4.7 : 1   AA
     *   --c-info    #2D5C9E           6.9 : 1   AAA
     *   --c-ok      #2E6F3F           5.7 : 1   AA
     *   --c-warning #8A5F12 (darkened from #B07A1C → 4.7:1, AA)
     * ──────────────────────────────────────────────────────────────── */
    :root,
    :root[data-theme="light"] {
      --bg:           var(--rigor-paper);
      --surface:      var(--rigor-paper-2);
      --surface-2:    var(--rigor-paper-3);
      --border:       var(--rigor-rule);
      --border-strong:#B7B2A2;        /* 3:1 vs paper, AA non-text */

      --text:         var(--rigor-ink-2);
      --text-strong:  var(--rigor-ink);
      --muted:        var(--rigor-ink-3);
      --inactive:     #6E7480;        /* AA against paper for icon UI */

      --accent:       var(--rigor-accent);
      --accent-press: var(--rigor-accent-2);
      --accent-tint:  var(--rigor-accent-3);

      --hover:        var(--rigor-paper-3);
      --active-line:  #ECE7D8;        /* slightly tinted */
      --selection:    #D9C9C5;        /* accent-tinted, ~AA non-text */
      --caret:        var(--rigor-accent);

      --gutter-fg:    var(--rigor-ink-3);
      --gutter-bg:    var(--rigor-paper-2);
      --anno:         var(--rigor-ink-3);

      --c-error:      var(--rigor-error);
      --c-warning:    #8A5F12;        /* darkened amber to hit 4.5:1 */
      --c-info:       var(--rigor-info);
      --c-ok:         var(--rigor-success);

      --c-error-bg:   var(--rigor-error-bg);
      --c-warning-bg: var(--rigor-warning-bg);
      --c-info-bg:    var(--rigor-info-bg);
      --c-ok-bg:      var(--rigor-success-bg);

      --sev-fg:       #FFFFFF;        /* badge text on saturated bg */

      --lint-error:   var(--rigor-error);
      --lint-warn:    #8A5F12;

      --focus-ring:   #7A2A2A;

      /* Syntax highlight — light (deep, warm ink on parchment) */
      --syn-keyword:  #8A2C6E;
      --syn-def:      #9A5B12;
      --syn-type:     #2E6F3F;
      --syn-string:   #4A6E26;
      --syn-number:   #9A3F1E;
      --syn-comment:  #7C7568;
      --syn-meta:     #2D5C9E;
      --syn-var:      var(--rigor-ink-2);
      --syn-operator: var(--rigor-ink-3);
    }

    /* ─────────────────────────────────────────────────────────────────
     * Dark theme — terminal-bg
     *
     * Saturated colors are lifted (lighter / less saturated) so each
     * pair hits AA against #1A1D23:
     *   --text      term-fg #E6E1D2     11.6 : 1   AAA
     *   --muted     #B6BAC2              6.5 : 1   AAA
     *   --accent    #E08C84              7.0 : 1   AAA
     *   --c-error   #ED8B82              6.5 : 1   AAA
     *   --c-warning #E4B25A              7.7 : 1   AAA
     *   --c-info    #8AB6E6              7.7 : 1   AAA
     *   --c-ok      #86C28E              7.5 : 1   AAA
     * ──────────────────────────────────────────────────────────────── */
    :root[data-theme="dark"] {
      --bg:           var(--rigor-term-bg);
      --surface:      #22262E;
      --surface-2:    #2A2E37;
      --border:       #353941;
      --border-strong:#4A4F58;

      --text:         var(--rigor-term-fg);
      --text-strong:  #F4F0E2;
      --muted:        #B6BAC2;
      --inactive:     #6E7480;

      --accent:       #E08C84;
      --accent-press: #EFA9A2;
      --accent-tint:  #3A2622;

      --hover:        #2A2E37;
      --active-line:  #232830;
      --selection:    #3D2F2E;
      --caret:        #E08C84;

      --gutter-fg:    #8A909B;
      --gutter-bg:    #181B21;
      --anno:         #8A909B;

      --c-error:      #ED8B82;
      --c-warning:    #E4B25A;
      --c-info:       #8AB6E6;
      --c-ok:         #86C28E;

      --c-error-bg:   #3A2422;
      --c-warning-bg: #3A2E1C;
      --c-info-bg:    #1F2C3F;
      --c-ok-bg:      #1F2F25;

      --sev-fg:       #0E1116;

      --lint-error:   #ED8B82;
      --lint-warn:    #E4B25A;

      --focus-ring:   #E08C84;

      /* Syntax highlight — dark (warm parchment tones, no cold purple/blue) */
      --syn-keyword:  #E0A0B4;
      --syn-def:      #E6B860;
      --syn-type:     #93C9A3;
      --syn-string:   #B5C56E;
      --syn-number:   #EC9A6E;
      --syn-comment:  #8B8475;
      --syn-meta:     #D7B6E0;
      --syn-var:      var(--rigor-term-fg);
      --syn-operator: #B6BAC2;
    }

    /* ─────────────────────────────────────────────────────────────────
     * Reset + base
     * ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
      border-radius: var(--rigor-radius-1);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: var(--rigor-font-sans);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Header ───────────────────────────────────────────────────── */

    header {
      display: flex;
      align-items: center;
      gap: var(--rigor-sp-3);
      padding: var(--rigor-sp-2) var(--rigor-sp-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 44px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: var(--rigor-sp-2);
      font-family: var(--rigor-font-sans);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
      color: var(--text-strong);
    }
    .brand::before {
      content: "";
      display: inline-block;
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 1px;
      transform: translateY(1px);
    }
    .brand .product {
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0;
    }

    #status {
      font-family: var(--rigor-font-mono);
      font-size: 12px;
      color: var(--muted);
      padding: 2px var(--rigor-sp-2);
      border-radius: var(--rigor-radius-1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #status::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.8;
    }
    #status.checking { color: var(--c-warning); }
    #status.ok       { color: var(--c-ok); }
    #status.error    { color: var(--c-error); }

    .toolbar { margin-left: auto; display: flex; gap: var(--rigor-sp-2); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--rigor-font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 12px;
      min-height: 28px;
      border-radius: var(--rigor-radius-2);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: background var(--rigor-transition),
                  border-color var(--rigor-transition),
                  color var(--rigor-transition);
    }
    .btn:hover  { background: var(--hover); border-color: var(--text); }
    .btn:active { background: var(--surface-2); }
    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--sev-fg);
    }
    .btn.active:hover { background: var(--accent-press); border-color: var(--accent-press); }
    .btn svg, .btn .fa-solid, .btn .fa-regular { width: 13px; height: 13px; font-size: 12px; flex-shrink: 0; opacity: 0.9; }
    .btn.active svg, .btn.active .fa-solid, .btn.active .fa-regular { opacity: 1; }

    /* ─── Main layout ──────────────────────────────────────────────── */

    main { display: flex; flex: 1; overflow: hidden; }

    #editor-wrap { flex: 1; overflow: auto; min-width: 0; }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-left: 1px solid var(--border);
      overflow: hidden;
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--rigor-sp-3) var(--rigor-sp-4);
      font-family: var(--rigor-font-sans);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #diag-count {
      font-family: var(--rigor-font-mono);
      font-size: 11px;
      letter-spacing: 0;
      text-transform: none;
      color: var(--muted);
    }

    #diagnostics { flex: 1; overflow-y: auto; }

    /* Empty state */
    .diag-empty {
      padding: var(--rigor-sp-4);
      font-family: var(--rigor-font-mono);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: var(--rigor-sp-2);
    }
    .diag-empty::before {
      content: "✓";
      color: var(--c-ok);
      font-weight: 700;
    }

    /* Diagnostic list rows */
    .diag-item {
      display: flex;
      gap: var(--rigor-sp-3);
      padding: var(--rigor-sp-3) var(--rigor-sp-4);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background var(--rigor-transition);
    }
    .diag-item:hover         { background: var(--hover); }
    .diag-item:focus-visible { background: var(--hover); outline-offset: -2px; }

    .diag-sev {
      font-family: var(--rigor-font-sans);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: var(--rigor-radius-1);
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 1px;
      color: var(--sev-fg);
      min-width: 56px;
      text-align: center;
    }
    .diag-sev.error   { background: var(--c-error); }
    .diag-sev.warning { background: var(--c-warning); }
    .diag-sev.info    { background: var(--c-info); }

    .diag-body { flex: 1; min-width: 0; }

    .diag-loc {
      font-family: var(--rigor-font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .diag-msg {
      font-family: var(--rigor-font-sans);
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
    }
    .diag-rule {
      font-family: var(--rigor-font-mono);
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
    }

    /* ─── CodeMirror integration ───────────────────────────────────── */

    .cm-editor              { height: 100%; font-size: 13.5px; }
    .cm-editor.cm-focused   { outline: none; }
    .cm-scroller            { height: 100%; font-family: var(--rigor-font-mono); }

    /* Type-annotation ghost text — subtle but readable
       (anno color hits ≥4.5:1 vs --bg in both themes; italic style cues
        secondary meaning without sacrificing legibility) */
    .cm-type-annotation {
      color: var(--anno);
      font-style: italic;
      pointer-events: none;
      user-select: none;
    }

    /* ADR-29 slice 4 — /type-of hover tooltip. CodeMirror 6
       wraps our tooltip DOM in a `.cm-tooltip` container; the
       inner `.cm-type-tooltip` carries the type string. */
    .cm-tooltip.cm-tooltip-above {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: var(--rigor-radius-2);
      padding: 0;
    }
    .cm-type-tooltip {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      padding: 4px 8px;
      color: var(--text);
      white-space: pre;
      max-width: 60ch;
      overflow-x: auto;
    }

    /* Lint hover tooltip — readable in dark + light. CM6 wraps the lint
       content (ul.cm-tooltip-lint) in an OUTER .cm-tooltip-hover container
       that carries the background, so both must be styled. */
    .cm-tooltip,
    .cm-tooltip.cm-tooltip-hover,
    .cm-tooltip.cm-tooltip-above {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--rigor-radius-2);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      color: var(--text);
    }
    .cm-tooltip .cm-tooltip-arrow::before { border-top-color: var(--border-strong); border-bottom-color: var(--border-strong); }
    .cm-tooltip .cm-tooltip-arrow::after  { border-top-color: var(--surface);       border-bottom-color: var(--surface); }
    ul.cm-tooltip-lint {
      background: var(--surface);
      color: var(--text);
      max-width: 42ch;
      padding: 0; margin: 0;
      border-radius: var(--rigor-radius-2);
      overflow: hidden;
      list-style: none;
    }
    .cm-tooltip-lint .cm-diagnostic {
      font-family: var(--rigor-font-mono);
      font-size: 12px;
      line-height: 1.5;
      padding: 7px 10px;
      margin: 0;
      color: var(--text);
      border-left-width: 3px;
      white-space: pre-wrap;
    }
    .cm-tooltip-lint .cm-diagnostic-error   { border-left-color: var(--c-error); }
    .cm-tooltip-lint .cm-diagnostic-warning { border-left-color: var(--c-warning); }
    .cm-tooltip-lint .cm-diagnostic-info    { border-left-color: var(--c-info); }
    .cm-tooltip-lint .cm-diagnosticSource   { color: var(--muted); }

    /* Autocomplete dropdown — warm theme; selectors out-specify CM's base. */
    .cm-tooltip.cm-tooltip-autocomplete { padding: 0; overflow: hidden; }
    .cm-tooltip.cm-tooltip-autocomplete > ul {
      font-family: var(--rigor-font-mono);
      font-size: 12.5px;
      max-height: 16em;
      background: var(--surface);
      color: var(--text);
      margin: 0; padding: 4px;
    }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: var(--rigor-radius-1);
      color: var(--text);
      line-height: 1.5;
    }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] {
      background: var(--accent);
      color: var(--sev-fg);
    }
    .cm-tooltip-autocomplete .cm-completionLabel { color: inherit; }
    .cm-tooltip-autocomplete .cm-completionMatchedText { text-decoration: underline; font-weight: 700; color: inherit; }
    .cm-tooltip-autocomplete .cm-completionDetail { color: var(--muted); font-style: italic; margin-left: auto; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] .cm-completionDetail { color: var(--sev-fg); opacity: 0.85; }
    .cm-tooltip-autocomplete .cm-completionIcon { color: var(--muted); opacity: 0.8; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] .cm-completionIcon { color: var(--sev-fg); }
    .cm-completionInfo { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--rigor-radius-2); }

    /* High-contrast scrollbars for the diagnostics + editor regions */
    #diagnostics::-webkit-scrollbar,
    .cm-scroller::-webkit-scrollbar { width: 10px; height: 10px; }
    #diagnostics::-webkit-scrollbar-thumb,
    .cm-scroller::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: var(--rigor-radius-1);
    }
    #diagnostics::-webkit-scrollbar-thumb:hover,
    .cm-scroller::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* Reduced motion respect */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    /* ─── Responsive: collapse sidebar below 720px ────────────────── */
    @media (max-width: 720px) {
      main { flex-direction: column; }
      #sidebar {
        width: 100%;
        max-height: 40vh;
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">Rigor <span class="product">Playground</span></span>
    <span id="status" aria-live="polite">Ready</span>
    <div class="toolbar">
      <button class="btn" id="theme-btn" title="Cycle theme (Dark / Light / Auto)" aria-label="Toggle theme">Dark</button>
      <button class="btn active" id="type-btn" aria-pressed="true"><i class="fa-solid fa-eye-slash" aria-hidden="true"></i><span>Hide types</span></button>
    </div>
  </header>

  <main>
    <div id="editor-wrap">
      <div id="editor"></div>
    </div>
    <aside id="sidebar" aria-label="Diagnostics">
      <div id="sidebar-header">
        <span>Diagnostics</span>
        <span id="diag-count">0</span>
      </div>
      <div id="diagnostics"><p class="diag-empty">No diagnostics</p></div>
    </aside>
  </main>

  <script type="module">
    import { basicSetup, EditorView, EditorState } from "https://esm.sh/@codemirror/basic-setup@0.20"
    import { StateField, StateEffect, Prec }       from "https://esm.sh/@codemirror/state@0.20"
    import { Decoration, WidgetType, hoverTooltip } from "https://esm.sh/@codemirror/view@0.20"
    import { StreamLanguage, HighlightStyle, syntaxHighlighting } from "https://esm.sh/@codemirror/language@0.20?deps=@lezer/highlight@1.1.6"
    import { ruby }                                from "https://esm.sh/@codemirror/legacy-modes@0.20/mode/ruby"
    import { lintGutter, setDiagnostics }          from "https://esm.sh/@codemirror/lint@0.20"
    import { tags as t }                           from "https://esm.sh/@lezer/highlight@1.1.6"
    import LZString                                from "https://esm.sh/lz-string@1.5.0"

    const API = ""

    const SAMPLE = `# Rigor Playground — edit this code and see diagnostics in real time

def greet(name)
  "Hello, " + name
end

result = greet("World")
result.upcase

# Try introducing an error:
x = nil
x.upcase   # possible-nil-receiver

# Inline-RBS annotations work here without a magic comment.
# The playground pre-loads rigor-rbs-inline with
# require_magic_comment: false (per ADR-32 WD10). The call
# below should flag :bad as an argument-type-mismatch.
class AscDesc
  # @rbs asc_or_desc: :asc | :desc
  def ascdesc(asc_or_desc)
    asc_or_desc
  end
end

AscDesc.new.ascdesc(:bad)
`

    // ── Type annotation widget ─────────────────────────────────────────────

    class TypeAnnotationWidget extends WidgetType {
      constructor(type, pad) { super(); this.type = type; this.pad = pad }
      eq(other)              { return other.type === this.type && other.pad === this.pad }
      ignoreEvent()          { return true }
      toDOM() {
        const el = document.createElement("span")
        el.className = "cm-type-annotation"
        const spacer = document.createElement("span")
        spacer.style.cssText = `display:inline-block;width:${this.pad}ch`
        spacer.setAttribute("aria-hidden", "true")
        el.appendChild(spacer)
        el.appendChild(document.createTextNode(this.type))
        return el
      }
    }

    // ── Decoration state field ─────────────────────────────────────────────

    const setAnnoEffect = StateEffect.define()

    const annoField = StateField.define({
      create: () => Decoration.none,
      update(deco, tr) {
        deco = deco.map(tr.changes)
        for (const e of tr.effects) {
          if (e.is(setAnnoEffect)) deco = e.value
        }
        return deco
      },
      provide: f => EditorView.decorations.from(f)
    })

    function applyAnnotations(annotations) {
      const BASE_GAP = 3
      const doc     = view.state.doc
      const entries = Object.entries(annotations)
        .map(([lineStr, type]) => ({ n: parseInt(lineStr, 10), type }))
        .filter(({ n }) => n >= 1 && n <= doc.lines)
      if (!entries.length) {
        view.dispatch({ effects: setAnnoEffect.of(Decoration.none) })
        return
      }
      const maxLen = Math.max(...entries.map(({ n }) => doc.line(n).length))
      const ranges = entries.map(({ n, type }) => {
        const line = doc.line(n)
        const pad  = maxLen - line.length + BASE_GAP
        return Decoration.widget({ widget: new TypeAnnotationWidget(type, pad), side: 1 })
                         .range(line.to)
      })
      ranges.sort((a, b) => a.from - b.from)
      view.dispatch({
        effects: setAnnoEffect.of(Decoration.set(ranges))
      })
    }

    function clearAnnotations() {
      view.dispatch({ effects: setAnnoEffect.of(Decoration.none) })
    }

    // ── Editor ────────────────────────────────────────────────────────────
    // EditorView.theme() values resolve var(--*) at render time, so the
    // editor follows light/dark without a Compartment swap.

    const MONO_FONT = `'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace`

    /* Rigor warm syntax highlight — drives off CSS vars so it tracks the
       active light/dark theme. Higher precedence than the basicSetup default
       so the cold purple/blue is fully replaced. */
    const rigorHighlight = HighlightStyle.define([
      { tag: [t.keyword, t.controlKeyword, t.definitionKeyword, t.moduleKeyword, t.operatorKeyword, t.self], color: "var(--syn-keyword)" },
      { tag: [t.function(t.variableName), t.function(t.definition(t.variableName)), t.definition(t.variableName), t.macroName], color: "var(--syn-def)", fontWeight: "500" },
      { tag: [t.typeName, t.className, t.namespace, t.tagName], color: "var(--syn-type)" },
      { tag: [t.string, t.special(t.string), t.character], color: "var(--syn-string)" },
      { tag: [t.regexp, t.escape], color: "var(--syn-string)" },
      { tag: [t.number, t.integer, t.float, t.bool, t.null, t.atom, t.constant(t.variableName), t.unit], color: "var(--syn-number)" },
      { tag: [t.comment, t.lineComment, t.blockComment, t.docComment], color: "var(--syn-comment)", fontStyle: "italic" },
      { tag: [t.meta, t.annotation, t.processingInstruction], color: "var(--syn-meta)" },
      { tag: [t.operator, t.punctuation, t.separator, t.bracket, t.derefOperator], color: "var(--syn-operator)" },
      { tag: [t.variableName, t.propertyName, t.labelName, t.attributeName], color: "var(--syn-var)" },
      { tag: t.invalid, color: "var(--c-error)" },
    ])

    // ── Type-of hover (ADR-29 slice 4) ────────────────────────────────────
    //
    // CodeMirror 6's hoverTooltip fires after a short hover dwell (default
    // 300 ms). On each fire, we compute the (1-based line, 0-based column)
    // pair for the hovered position and POST to /type-of. A 422 response
    // (no resolvable type) renders no tooltip; a 200 with a `type` field
    // renders the type as a small dark popover anchored above the cursor.
    //
    // Concurrency: hoverTooltip serialises by hover event, and the
    // backend's per-IP concurrency is capped at 4 in-flight requests by
    // fly.toml (ADR-29 WD5). A user hovering rapidly across the document
    // would still only fire one request per dwell.
    const typeHover = hoverTooltip(async (view, pos) => {
      const line       = view.state.doc.lineAt(pos)
      const lineNumber = line.number
      const column     = pos - line.from

      let data
      try {
        const response = await fetch(`${API}/type-of`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            source: view.state.doc.toString(),
            line:   lineNumber,
            column: column
          })
        })
        if (!response.ok) return null
        data = await response.json()
      } catch (_e) {
        return null
      }

      if (!data || !data.type) return null

      return {
        pos,
        above: true,
        create() {
          const dom = document.createElement("div")
          dom.className   = "cm-type-tooltip"
          dom.textContent = data.type
          return { dom }
        }
      }
    }, { hideOn: () => false })

    // ── Shareable URL state ────────────────────────────────────────────────
    // The source round-trips through ?c=<lz-string>: restored on load,
    // rewritten (debounced) on edit. history.replaceState updates the address
    // bar without a navigation or history spam.
    const QUERY_KEY = "c"
    function sourceFromUrl() {
      const c = new URLSearchParams(location.search).get(QUERY_KEY)
      if (!c) return null
      try { return LZString.decompressFromEncodedURIComponent(c) || null } catch { return null }
    }
    const INITIAL_DOC = sourceFromUrl() ?? SAMPLE

    const view = new EditorView({
      state: EditorState.create({
        doc: INITIAL_DOC,
        extensions: [
          basicSetup,
          StreamLanguage.define(ruby),
          Prec.highest(syntaxHighlighting(rigorHighlight)),
          lintGutter(),
          annoField,
          typeHover,
          // Don't clear the type overlay on each keystroke. The existing
          // annotations stay on screen (mapped through the edit) and the
          // debounced background /annotate-lines refreshes them in place once
          // it returns — so the overlay updates without a per-keystroke flicker.
          EditorView.updateListener.of(update => {
            if (!update.docChanged) return
            scheduleCheck()
            scheduleUrlSync()
          }),
          EditorView.theme({
            "&"                       : { backgroundColor: "var(--bg)",         color: "var(--text)",      height: "100%" },
            ".cm-content"             : { caretColor: "var(--caret)",            fontFamily: MONO_FONT,
                                          padding: "8px 0" },
            ".cm-cursor"              : { borderLeftColor: "var(--caret)", borderLeftWidth: "2px" },
            ".cm-gutters"             : { backgroundColor: "var(--gutter-bg)",   color: "var(--gutter-fg)",
                                          border: "none", borderRight: "1px solid var(--border)" },
            ".cm-lineNumbers .cm-gutterElement": { padding: "0 12px 0 8px" },
            ".cm-activeLineGutter"    : { backgroundColor: "var(--hover)", color: "var(--text)" },
            ".cm-activeLine"          : { backgroundColor: "var(--active-line)" },
            ".cm-selectionBackground" : { backgroundColor: "var(--selection)" },
            "&.cm-focused .cm-selectionBackground": { backgroundColor: "var(--selection)" },
            ".cm-lintRange-error"     : { textDecoration: "underline wavy var(--lint-error)",
                                          textDecorationThickness: "1.5px" },
            ".cm-lintRange-warning"   : { textDecoration: "underline wavy var(--lint-warn)",
                                          textDecorationThickness: "1.5px" },
          })
        ]
      }),
      parent: document.getElementById("editor")
    })

    // ── State ─────────────────────────────────────────────────────────────

    let debounceTimer    = null
    // Types are on by default — the overlay is the point of the playground.
    // The toolbar button's markup starts in its pressed ("Hide types") state to
    // match, and the boot check paints the first annotations.
    let typesVisible     = true
    let lastDiagnostics  = []

    // ── Theme ─────────────────────────────────────────────────────────────

    const THEME_CYCLE  = ["dark", "light", "system"]
    const THEME_LABELS = { dark: "Dark", light: "Light", system: "Auto" }
    const THEME_ICONS  = { dark: "fa-solid fa-moon", light: "fa-solid fa-sun", system: "fa-solid fa-circle-half-stroke" }
    const THEME_TITLES = {
      dark:   "Theme: Dark — click for Light",
      light:  "Theme: Light — click for Auto",
      system: "Theme: Auto (matches your system) — click for Dark",
    }

    let themeMode = localStorage.getItem("rigor-theme") || "system"
    const mediaDark = window.matchMedia("(prefers-color-scheme: dark)")

    function isDarkResolved() {
      if (themeMode === "dark")  return true
      if (themeMode === "light") return false
      return mediaDark.matches
    }

    function applyTheme() {
      document.documentElement.dataset.theme = isDarkResolved() ? "dark" : "light"
      themeBtn.innerHTML = `<i class="${THEME_ICONS[themeMode]}" aria-hidden="true"></i><span>${THEME_LABELS[themeMode]}</span>`
      themeBtn.title = THEME_TITLES[themeMode]
    }

    const themeBtn = document.getElementById("theme-btn")
    themeBtn.addEventListener("click", () => {
      themeMode = THEME_CYCLE[(THEME_CYCLE.indexOf(themeMode) + 1) % THEME_CYCLE.length]
      localStorage.setItem("rigor-theme", themeMode)
      applyTheme()
    })

    mediaDark.addEventListener("change", () => {
      if (themeMode === "system") applyTheme()
    })

    applyTheme()

    // ── Check ─────────────────────────────────────────────────────────────

    function scheduleCheck() {
      clearTimeout(debounceTimer)
      debounceTimer = setTimeout(runCheck, 600)
    }

    // Mirror the current source into ?c=<lz-string> (debounced). Clears the
    // param when the buffer is the untouched sample, so a plain visit keeps a
    // clean URL.
    let urlTimer = null
    function scheduleUrlSync() {
      clearTimeout(urlTimer)
      urlTimer = setTimeout(() => {
        const src = view.state.doc.toString()
        const url = src === SAMPLE
          ? location.pathname
          : `${location.pathname}?${QUERY_KEY}=${LZString.compressToEncodedURIComponent(src)}`
        history.replaceState(null, "", url)
      }, 600)
    }

    async function runCheck() {
      const source = view.state.doc.toString()
      setStatus("checking", "Checking…")
      try {
        const checkRes  = await post("/check", { source })
        if (!checkRes.ok) throw new Error(`HTTP ${checkRes.status}`)
        const checkData = await checkRes.json()

        lastDiagnostics = checkData.diagnostics || []
        applyLintMarkers(lastDiagnostics)
        renderSidebar(lastDiagnostics)
        const errCount = checkData.error_count ?? 0
        setStatus(
          checkData.success ? "ok" : "error",
          checkData.success ? "No errors" : `${errCount} error${errCount === 1 ? "" : "s"}`
        )

        if (typesVisible) await runAnnotateLines(source)
      } catch (e) {
        setStatus("error", `Offline: ${e.message}`)
      }
    }

    async function runAnnotateLines(source) {
      try {
        const res  = await post("/annotate-lines", { source })
        if (!res.ok) return
        const data = await res.json()
        applyAnnotations(data.annotations || {})
      } catch (_) { /* best-effort */ }
    }

    function applyLintMarkers(diagnostics) {
      const doc     = view.state.doc
      const cmDiags = diagnostics.map(d => {
        const lineNum = Math.max(1, Math.min(d.line, doc.lines))
        const line    = doc.line(lineNum)
        const from    = line.from + Math.max(0, (d.column || 1) - 1)
        const to      = Math.max(from + 1, Math.min(line.to, from + 10))
        return {
          from,
          to,
          severity: d.severity === "error" ? "error" : d.severity === "warning" ? "warning" : "info",
          message:  d.message + (d.rule ? `  [${d.rule}]` : "")
        }
      })
      view.dispatch(setDiagnostics(view.state, cmDiags))
    }

    // ── Sidebar ───────────────────────────────────────────────────────────

    function renderSidebar(diagnostics) {
      const container = document.getElementById("diagnostics")
      const counter   = document.getElementById("diag-count")
      counter.textContent = diagnostics.length

      if (!diagnostics.length) {
        container.innerHTML = '<p class="diag-empty">No diagnostics</p>'
        return
      }
      container.innerHTML = diagnostics.map((d, i) => `
        <div class="diag-item" data-index="${i}" tabindex="0" role="button"
             aria-label="${escHtml(d.severity)} at line ${d.line}: ${escHtml(d.message)}">
          <span class="diag-sev ${d.severity}">${d.severity}</span>
          <div class="diag-body">
            <div class="diag-loc">Line ${d.line}, col ${d.column}</div>
            <div class="diag-msg">${escHtml(d.message)}</div>
            ${d.rule ? `<div class="diag-rule">${escHtml(d.rule)}</div>` : ""}
          </div>
        </div>
      `).join("")

      container.querySelectorAll(".diag-item").forEach(el => {
        const jump = () => {
          const d   = diagnostics[+el.dataset.index]
          const doc = view.state.doc
          const n   = Math.max(1, Math.min(d.line, doc.lines))
          const pos = doc.line(n).from + Math.max(0, (d.column || 1) - 1)
          view.dispatch({ selection: { anchor: pos }, scrollIntoView: true })
          view.focus()
        }
        el.addEventListener("click", jump)
        el.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); jump() }
        })
      })
    }

    // ── Type overlay toggle ───────────────────────────────────────────────

    const typeBtn = document.getElementById("type-btn")

    typeBtn.addEventListener("click", async () => {
      typesVisible = !typesVisible
      typeBtn.setAttribute("aria-pressed", String(typesVisible))
      if (typesVisible) {
        typeBtn.innerHTML = '<i class="fa-solid fa-eye-slash" aria-hidden="true"></i><span>Hide types</span>'
        typeBtn.classList.add("active")
        await runAnnotateLines(view.state.doc.toString())
      } else {
        typeBtn.innerHTML = '<i class="fa-solid fa-eye" aria-hidden="true"></i><span>Show types</span>'
        typeBtn.classList.remove("active")
        clearAnnotations()
      }
    })

    // ── Utilities ─────────────────────────────────────────────────────────

    function post(path, body) {
      return fetch(`${API}${path}`, {
        method:  "POST",
        headers: { "content-type": "application/json" },
        body:    JSON.stringify(body)
      })
    }

    function setStatus(cls, text) {
      const el = document.getElementById("status")
      el.className   = cls
      el.textContent = text
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    }

    // ── Boot ──────────────────────────────────────────────────────────────
    scheduleCheck()
  </script>
</body>
</html>
